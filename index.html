// 人類玩家（含報聽、託管），每個決定都記錄下來供牌譜回放
const human = {
  human: true,
  async turn(g, p, o) { const a = await humanTurn(g, p, o); G.rec.push(a); return a; },
  async claim(g, p, t, o, from) { const a = await humanClaim(g, p, t, o, from); G.rec.push(a); return a; }
};
function humanTurn(g, p, o) {
  if (G.auto) return wait(SPD() * .8).then(() => MJ.AI.turn(g, p, o));
  if (G.ting) { const h = g.players[p].hand; return wait(o.tsumo ? 400 : 550).then(() => o.tsumo ? { type: 'tsumo' } : { type: 'discard', tile: h[h.length - 1] }); }
  return new Promise(res => { G.pending = { kind: 'turn', o, res }; G.sel = -1; vib(25); renderGame(); });
}
function humanClaim(g, p, t, o, from) {
  if (G.auto) return wait(SPD() * .5).then(() => MJ.AI.claim(g, p, t, o, from));
  if (G.ting) return wait(300).then(() => o.hu ? { type: 'hu' } : { type: 'pass' });
  return new Promise(res => { G.pending = { kind: 'claim', o, t, from, res }; vib(40); renderGame(); });

function resolvePending(v) { const pd = G.pending; G.pending = null; G.sel = -1; if (pd) pd.res(v); renderGame(); }

  if (kind !== 'replay') return MJ.AI;
  return { async turn(g, p, o) { await gate(); return MJ.AI.turn(g, p, o); }, async claim(g, p, t, o, f) { await gate(); return MJ.AI.claim(g, p, t, o, f); } };
}

const POPXY = () => [[STW / 2, 372], [STW - 220, 262], [STW / 2, 136], [230, 262]];
function popup(p, text, kind) {
  const d = document.createElement('div'); d.className = 'pop k-' + kind;
  const xy = POPXY()[vpos(p)]; d.style.left = xy[0] + 'px'; d.style.top = xy[1] + 'px'; d.innerHTML = `<span>${text}</span>`;
  $('#pops').appendChild(d); setTimeout(() => d.remove(), 1200);

function emote(p, text) {
  G.emo[p] = text; renderGame(); const tk = G.token;
  setTimeout(() => { if (G.emo[p] === text) { delete G.emo[p]; if (tk === G.token) renderGame(); } }, 2600);
}
const BOT_EMO = { win: ['😆', '胡啦！', '運氣好而已～', '🎉'], lose: ['😭', '唉唷…', '下把換我', '🤯'], claim: ['嘿嘿', '😏', '謝啦'] };
const SEATXY = p => { const xy = POPXY()[vpos(p)]; return vpos(p) === 0 ? { x: STW / 2, y: 470 } : { x: xy[0], y: xy[1] }; };
function onEvent(ev) {
  try {
    if (ev.type === 'deal') { G.dealAnim = true; G.liftOnce = true; if (CFG.td3 && ANIM()) liftTable(); else beep('shuffle'); }
    else if (ev.type === 'draw') { if (ev.p === G.view) { G.drawAnim = true; beep('draw'); } }
    else if (ev.type === 'claim') {
      const kind = ev.text === '碰' ? 'pon' : ev.text === '吃' ? 'chi' : 'kan';
      popup(ev.p, ev.text, kind + ' burst'); beep('claim'); say(kind, ev.p, ev.text);
      if (G.kind === 'play' && ev.p !== 0 && Math.random() < .12) setTimeout(() => emote(ev.p, pick(BOT_EMO.claim)), 400);
    } else if (ev.type === 'discard') { G.newRiver = ev.p; beep('discard'); sayTile(ev.t, ev.p); }
  } catch (e) {}
  const from = ev.type === 'claim' ? G.lastRiverXY : null;
  renderGame();
  try {
    if (ev.type === 'discard' && ANIM()) {
      const el = $(`#game .river.r${vpos(ev.p)} .t.last`);
      if (el) { flyTile(ev.t, SEATXY(ev.p), el, 32, 260); G.lastRiverXY = stageXY(el); }
    } else if (ev.type === 'claim' && from && ANIM()) {
      const m = G.game.players[ev.p].melds.at(-1), host = vpos(ev.p) === 0 ? $('#myhand') : $(`#game .melds.${['', 'm-r', 'm-top', 'm-l'][vpos(ev.p)]}`);
      const me = host && host.querySelectorAll('.meld'), last = me && me[me.length - 1];
      if (m && last && m.type !== 'akan' && m.type !== 'kakan') { const idx = meldOrder(m).findIndex(([t, c]) => c || t === m.claimed); const el = last.children[Math.max(0, idx)]; flyTile(m.claimed ?? m.tiles[0], from, el, null, 300); }
    }
  } catch (e) {}
}

async function startHand() {
  const token = ++G.token;
  Object.assign(G, { pending: null, sel: -1, reveal: G.kind === 'replay', result: null, ting: false, tingPick: false, rec: [], emo: {}, status: '' });
  G.handNo++;
  const seed = G.kind === 'replay' ? G.rp.seed : newSeed();
  G.lfTiles = PK.LF.pickTiles(seed);
  G.handStart = { seed, dealer: G.dealer, roundWind: roundWind(), scores: G.scores.slice(), lian: G.lian };
  const g = new MJ.Game({ dealer: G.dealer, roundWind: roundWind(), scores: G.scores, lian: G.lian, base: G.base, perTai: G.perTai, players: G.n, rules: G.rules, preset: G.preset || 'std', rng: MJ.mulberry32(seed) });
  G.game = g; G.wallBreak = (seed >>> 3) % (g.tileTotal / 2);
  let agents;
  if (G.kind === 'play') agents = [human].concat(Array(G.n - 1).fill(MJ.AI));
  else if (G.kind === 'spectate') agents = Array(G.n).fill(MJ.AI);
  else { let i = 0; const acts = G.rp.acts; const next = async () => { await wait(650 / G.rspeed); await gate(); return acts[i++] || { type: 'pass' }; };
    agents = [{ human: true, turn: next, claim: next }].concat(Array(G.n - 1).fill(aiAgent('replay'))); }
  const delay = () => G.kind === 'replay' ? 650 / G.rspeed : SPD();
  if (G.kind === 'play' && G.handNo === 1) notify('start', `${WINDS[roundWind()]}風圈開始・${nameOf(G.dealer)} 坐莊`);
  try {
    const res = await MJ.playHand(g, agents, { delay, onEvent, isAborted: () => token !== G.token });
    if (token !== G.token) return;
    handOver(res);
  } catch (e) { if (e.message !== 'ABORT') { console.error(e); G.status = '錯誤：' + e.message; renderGame(); } }
}
const handLabel = () => G.kind === 'replay' ? G.rp.label : `${WINDS[roundWind()]}風圈・第 ${Math.min(G.dealerMoves + 1, G.hands)} / ${G.hands} 局`;
function handText(res) { if (res.type === 'win' && res.special) return `${nameOf(res.winner)} ${res.special} ${res.total} 台`; return res.type === 'win' ? `${nameOf(res.winner)} ${res.selfDraw ? '自摸' : '胡'} ${res.total} 台${res.selfDraw ? '' : '（' + nameOf(res.from) + ' 放槍）'}` : '流局'; }

function handOver(res) {
  const g = G.game; G.result = res; G.reveal = true; G.pending = null;
  try { lfAdjust(res); } catch (e) { console.error(e); }
  res.handLabel = handLabel(); res.lianBefore = G.lian;
  if (res.type === 'win') { popup(res.winner, res.special || (res.selfDraw ? '自摸' : '胡'), 'hu'); beep('win'); vib([60, 40, 120]); } else { beep('lose'); say('draw', 0, '流局'); }
  G.flipAnim = true; winFx(res);
  if (G.kind === 'replay') { renderGame(); setTimeout(() => { if (G.result === res) showResult(); }, 1300); return; }
  if (G.kind === 'spectate') {
    if (res.type === 'win' && res.winner !== G.dealer) { G.dealer = (G.dealer + 1) % G.n; G.dealerMoves++; G.lian = 0; } else G.lian++;
    G.status = '本局：' + handText(res) + '・3 秒後下一局'; renderGame();
    const tk = G.token; setTimeout(() => { if (tk === G.token && G.kind === 'spectate') startHand(); }, 3200); return;
  }
  let delta = 0;
  if (res.type === 'win') {
    if (res.winner === 0) delta = Object.values(res.payments).reduce((a, b) => a + b, 0);
    else if (res.payments[0]) delta = -res.payments[0];
    const others = G.players.map((_, i) => i).filter(i => i !== 0);
    setTimeout(() => { if (res.winner !== 0) emote(res.winner, pick(BOT_EMO.win)); else if (Math.random() < .6) emote(pick(others), pick(BOT_EMO.lose)); }, 900);
  }
  res.delta = delta; WAL.coins += delta;
  ST.hands++; ST.todayHands++;
  if (G.kind === 'play') v5Track(G.n === 2 || (G.cfg && G.cfg.lf) ? 'mj' : 'mj', res);
  if (res.type === 'win' && res.winner === 0) { ST.wins++; ST.todayWins++; if (res.selfDraw) ST.tsumo++; ST.best = Math.max(ST.best, res.total); }
  if (res.type !== 'win') ST.draws++;
  // 本場最大牌型
  if (res.type === 'win' && (!G.best || res.total > G.best.total)) G.best = { no: G.handNo, who: nameOf(res.winner), total: res.total, names: res.tai.map(x => x[0]).join('、') || '無台' };
  // 俱樂部彩金
  if (G.cfg.club && CLUB && res.type === 'win' && res.total >= 10 && CLUB.pool > 0) {

function cardHTML(c, w = 56, cls = '', attr = '') {

  if (c >= 52) return `<div class="pc joker ${c === 53 ? 'big' : 'small'} ${cls}" ${sa}>${jokerSVG(c === 53)}</div>`;
  const s = CG.st(c), red = s === 1 || s === 2;

}

// ---------- 牌局狀態 ----------
const CS = { token: 0, pending: null, sel: new Set(), auto: false, hint: -1, acts: {}, msg: '' };
const cWait = ms => new Promise(r => setTimeout(r, ms));
const CSPD = () => 700 * CFG.speed;
const cpos = p => CS.n === 4 ? p : CS.n === 3 ? [0, 1, 3][p] : [0, 2][p];
const cname = p => p === 0 ? '你' : CS.players[p].name;

function startCardMatch(cfg) {
  closeModal();
  const n = GAMES[cfg.game].n;
  Object.assign(CS, { cfg, game: cfg.game, n, players: cfg.players.slice(0, n), base: cfg.base, rounds: cfg.rounds, scores: Array(n).fill(0), roundNo: 0, over: false, auto: false, log: [], best: null,
    matchId: 'c' + Date.now() + rnd(1000), starter: rnd(n), st: null, pending: null });
  show('cgame'); startCRound();
}
function startCRound() {
  const tk = ++CS.token;
  Object.assign(CS, { pending: null, sel: new Set(), hint: -1, acts: {}, msg: '', result: null, seed: (Math.random() * 2147483647) | 0 });
  CS.roundNo++;
  CS.rng = CG.mulberry32(CS.seed);
  CS.rec = null;
  const run = { ssz: runSSZ, b2: runB2, ddz: runDDZ, aq: runAQ, he: runHE, sl: runSL }[CS.game];
  run(tk).catch(e => { if (e && e.message === 'ABORT') return; console.error(e); CS.msg = '錯誤：' + e.message; renderC(); });
}
const chk = tk => { if (tk !== CS.token) throw new Error('ABORT'); };
function askHuman(kind, data) {
  return new Promise(res => { CS.pending = Object.assign({ kind, res }, data || {}); vib(25); renderC(); });
}
function resolveC(v) { const pd = CS.pending; CS.pending = null; CS.sel = new Set(); CS.hint = -1; if (pd) pd.res(v); renderC(); }
function cpop(p, text, kind = 'chi') {
  const XY = { 0: [STW / 2, 330], 1: [STW - 230, 200], 2: [STW / 2, 120], 3: [230, 200] }[cpos(p)];
  const d = document.createElement('div'); d.className = 'pop k-' + kind; d.style.left = XY[0] + 'px'; d.style.top = XY[1] + 'px'; d.innerHTML = `<span>${text}</span>`;

}

// ---------- 十三支 ----------
async function runSSZ(tk) {
  const SSZ = CG.SSZ, hands = SSZ.deal(CS.rng);
  CS.st = { hands, rows: [[], [], []], left: hands[0].slice(), done: [false, false, false, false], plays: [], phase: 'arrange', sugg: SSZ.suggest(hands[0], 3), special: SSZ.special(hands[0]) }; crecStart();
  beep('riffle'); renderC();
  // 電腦陸續排好
  for (let p = 1; p < 4; p++) setTimeout(() => { if (tk === CS.token && CS.st.phase === 'arrange') { CS.st.done[p] = true; renderC(); } }, 900 + p * 700 + rnd(900));
  const mine = CS.auto ? autoSSZ() : await askHuman('ssz');
  chk(tk);
  const plays = hands.map((h, p) => {
    if (p === 0) return mine;
    const sp = SSZ.special(h); return sp ? { arr: sp.arr, special: sp } : { arr: SSZ.best(h) };
  });
  CS.st.plays = plays; CS.st.done = [true, true, true, true]; CS.st.phase = 'compare'; crecStep('比牌');
  const r = SSZ.settle(plays); CS.st.res = r;
  beep('claim'); renderC();
  r.shot.forEach((row, i) => row.forEach((v, j) => { if (v) setTimeout(() => { if (tk === CS.token) cpop(i, '打槍', 'pon'); }, 700 + i * 250); }));
  r.homerun.forEach((v, i) => { if (v) setTimeout(() => { if (tk === CS.token) cpop(i, '全壘打', 'hu'); }, 1500); });
  plays.forEach((pl, i) => { if (pl.special) setTimeout(() => { if (tk === CS.token) cpop(i, '報到・' + pl.special.name, 'hu'); }, 500); });
  await cWait(1800); chk(tk);
  const text = r.homerun.some(Boolean) ? `${cname(r.homerun.indexOf(true))} 全壘打` : `${cname(r.pts.indexOf(Math.max(...r.pts)))} 最多 ${Math.max(...r.pts)} 水`;
  cRoundOver(r.pts, sszDetail(plays, r), text, Math.max(...r.pts));
}
function autoSSZ() { const h = CS.st.hands[0], sp = CG.SSZ.special(h); return sp ? { arr: sp.arr, special: sp } : { arr: CG.SSZ.best(h) }; }
function sszDetail(plays, r) {
  const rowsHTML = (p) => {
    const pl = plays[p];
    if (pl.special) return `<div class="sszsp">報到：${pl.special.name}（${pl.special.value} 水）</div>`;
    const e = CG.SSZ.evalArr(pl.arr), foul = r.info[p].foul;
    return pl.arr.map((row, k) => `<div class="sszr">${row.map(c => cardHTML(c, 26)).join('')}<small>${foul ? '倒水' : e[k].name}${p !== 0 && !foul && !plays[0].special && !r.info[0].foul ? ` <em class="${r.rows[0][p][k] > 0 ? 'pos' : r.rows[0][p][k] < 0 ? 'neg' : ''}">${r.rows[0][p][k] > 0 ? '你贏' : r.rows[0][p][k] < 0 ? '你輸' : '平'}</em>` : ''}</small></div>`).join('');
  };
  return `<div class="sszcmp">${plays.map((_, p) => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b>${r.homerun[p] ? '<span class="tagx hu">全壘打</span>' : ''}${r.info[p].foul ? '<span class="tagx neg">倒水</span>' : ''}<span class="num ${r.pts[p] > 0 ? 'pos' : r.pts[p] < 0 ? 'neg' : ''}">${r.pts[p] > 0 ? '+' : ''}${r.pts[p]} 水</span></div>${rowsHTML(p)}</div>`).join('')}</div>`;
}

// ---------- 大老二 ----------
async function runB2(tk) {
  const B2 = CG.B2, S = B2.newRound(CS.rng); CS.st = S; CS.acts = {}; crecStart();
  beep('riffle'); renderC();
  CS.msg = `${cname(S.turn)}有梅花 3，先出牌`; renderC(); await cWait(800); chk(tk);
  while (S.winner == null) {
    chk(tk);
    const p = S.turn, wasLead = !!S.lead;
    let cards;
    if (p === 0 && !CS.auto) cards = await askHuman('b2');
    else { await cWait(CSPD()); chk(tk); cards = B2.ai(S, p); }
    chk(tk);
    const leadBy = S.lead && S.lead.by;
    B2.act(S, p, cards);
    CS.msg = '';
    if (cards) { CS.acts[p] = { cards: cards.slice().sort((a, b) => a - b), name: B2.classify(cards).name }; beep('flick'); CS.newPile = p; crecStep(`${cname(p)} 出 ${CS.acts[p].name}`); if (cards.length === 5) cpop(p, B2.classify(cards).name, 'pon'); if (S.hands[p].length === 1 && S.winner == null) cpop(p, '報單！', 'hu'); }
    else CS.acts[p] = { pass: true };
    if (wasLead && !S.lead && S.winner == null) { renderC(); await cWait(650); chk(tk); CS.acts = {}; CS.msg = `${cname(leadBy)}最大，重新出牌`; }
    renderC();
  }
  const w = S.winner, r = S.result;
  const detail = `<div class="b2res">${S.hands.map((h, p) => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b>${p === w ? '<span class="tagx hu">出完</span>' : `<small>剩 ${h.length} 張${r.detail[p].twos ? `・含 2 ×${r.detail[p].twos}` : ''}・×${r.detail[p].mul}</small>`}<span class="num ${r.pts[p] > 0 ? 'pos' : 'neg'}">${r.pts[p] > 0 ? '+' : ''}${r.pts[p]}</span></div><div class="sszr">${h.map(c => cardHTML(c, 24)).join('')}</div></div>`).join('')}</div>`;
  await cWait(900); chk(tk);
  cRoundOver(r.pts, detail, `${cname(w)} 先出完`, r.pts[w]);
}

// ---------- 鬥地主 ----------
async function runDDZ(tk) {
  const D = CG.DDZ; let S, tries = 0;
  for (;;) {
    S = D.newRound(CS.rng, (CS.starter + CS.roundNo) % 3); CS.st = S; CS.acts = {}; crecStart();
    beep('riffle'); renderC(); await cWait(500); chk(tk);
    while (S.phase === 'bid') {
      const p = S.turn; let v;
      if (p === 0 && !CS.auto) v = await askHuman('bid');
      else { await cWait(CSPD() * .8); chk(tk); v = (tries >= 3 && p === S.starter && !S.cur) ? Math.max(1, D.aiBid(S.hands[p], S.cur)) : D.aiBid(S.hands[p], S.cur); }
      chk(tk);
      D.bid(S, p, v); CS.acts[p] = { text: v ? v + ' 分' : '不叫' }; beep('tap'); renderC();
    }
    if (S.phase === 'play') break;
    tries++; CS.msg = '沒有人叫地主，重新發牌'; renderC(); await cWait(1200); chk(tk); CS.msg = '';
  }
  CS.acts = {}; cpop(S.landlord, '地主', 'hu'); CS.msg = `${cname(S.landlord)}當地主（${S.cur} 分），拿走 3 張底牌`; renderC(); await cWait(1000); chk(tk);
  while (S.phase === 'play') {
    chk(tk);
    const p = S.turn, wasLead = !!S.last;
    let cards;
    if (p === 0 && !CS.auto) cards = await askHuman('ddz');
    else { await cWait(CSPD()); chk(tk); cards = D.ai(S, p); }
    chk(tk);
    const lastBy = S.last && S.last.p;
    D.play(S, p, cards); CS.msg = '';
    if (cards) { const pl = S.last.play; CS.acts[p] = { cards: S.last.cards, name: D.TYPE[pl.type] }; beep('flick'); CS.newPile = p; crecStep(`${cname(p)} 出 ${CS.acts[p].name}`);
      if (pl.type === 'bomb' || pl.type === 'rocket') { cpop(p, D.TYPE[pl.type] + ' ×2', 'hu burst'); vib(60); beep('boom'); bombFx(p); } else if (['straight', 'pairs', 'plane', 'plane1', 'plane2'].includes(pl.type)) cpop(p, D.TYPE[pl.type], 'pon');
      if (S.hands[p].length <= 2 && S.phase === 'play') cpop(p, `剩 ${S.hands[p].length} 張`, 'chi'); }
    else CS.acts[p] = { pass: true };
    if (wasLead && !S.last && S.phase === 'play') { renderC(); await cWait(600); chk(tk); CS.acts = {}; CS.msg = `${cname(lastBy)}最大，重新出牌`; }
    renderC();
  }
  const r = S.result;
  if (r.spring) cpop(S.winner, r.spring, 'hu');
  const detail = `<div class="ddzres"><div class="sub">${r.landlordWin ? '地主勝' : '農民勝'}・叫 ${r.bid} 分・炸彈 ${r.bombs} 個${r.spring ? '・' + r.spring : ''}・倍數 ×${r.mult}</div>${S.hands.map((h, p) => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b><span class="tagx ${p === S.landlord ? 'hu' : ''}">${p === S.landlord ? '地主' : '農民'}</span><span class="num ${r.pts[p] > 0 ? 'pos' : 'neg'}">${r.pts[p] > 0 ? '+' : ''}${r.pts[p]}</span></div><div class="sszr">${h.map(c => cardHTML(c, 24)).join('') || '<small>出完</small>'}</div></div>`).join('')}</div>`;
  await cWait(1000); chk(tk);
  cRoundOver(r.pts, detail, `${r.landlordWin ? '地主' : '農民'}勝 ×${r.mult}`, r.mult);
}

// ---------- 暗棋 ----------
async function runAQ(tk) {
  const A = CG.AQ, first = (CS.starter + CS.roundNo) % 2, S = A.newGame(CS.rng, first); CS.st = S; CS.aqSel = -1; crecStart();
  beep('riffle'); CS.msg = `${cname(first)}先手：翻開的第一顆棋決定顏色`; renderC();
  while (!S.result) {
    chk(tk);
    const p = S.turn; let mv;
    if (p === 0 && !CS.auto) mv = await askHuman('aq');
    else { await cWait(CSPD() * .9); chk(tk); mv = A.ai(S, p, CS.rng); }
    chk(tk);
    const cap = mv.t === 'move' && S.board[mv.to];
    A.apply(S, p, mv); CS.msg = ''; CS.aqSel = -1; crecStep(`${cname(p)} ${mv.t === 'flip' ? '翻棋' : '走棋'}`);
    if (mv.t === 'flip' && S.plies === 1) cpop(p, (S.color[p] ? '黑方' : '紅方'), 'chi');
    if (cap) { beep('claim'); cpop(p, '吃 ' + A.NAMES[cap.side][cap.r], cap.r >= 6 ? 'hu' : 'pon'); } else beep('discard');
    renderC();
  }
  const w = S.result.winner, pts = w == null ? [0, 0] : w === 0 ? [1, -1] : [-1, 1];
  const left = q => S.board.filter(x => x && x.side === S.color[q]).length;
  const detail = `<div class="ddzres"><div class="sub">${S.result.reason}・共 ${S.plies} 步</div>${[0, 1].map(p => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b><span class="tagx">${S.color[p] == null ? '未定' : S.color[p] ? '黑方' : '紅方'}</span><small>剩 ${left(p)} 子・吃 ${S.captured[p].length} 子</small><span class="num ${pts[p] > 0 ? 'pos' : pts[p] < 0 ? 'neg' : ''}">${pts[p] > 0 ? '+1' : pts[p] < 0 ? '−1' : '0'}</span></div><div class="sszr">${S.captured[p].map(x => pieceHTML(Object.assign({}, x, { up: true }), 24)).join('')}</div></div>`).join('')}</div>`;
  await cWait(900); chk(tk);
  cRoundOver(pts, detail, w == null ? '和局' : `${cname(w)} 獲勝`, 1);
}

// ---------- 結算 ----------
function cRoundOver(pts, detail, text, mag) {
  if (CS.rec) crecEnd(text);
  const base = CS.base, delta = pts[0] * base;
  pts.forEach((v, i) => CS.scores[i] += v * base);
  WAL.coins += delta;
  const g = CS.game; CST[g] = CST[g] || { rounds: 0, wins: 0, matches: 0, firsts: 0, net: 0 };
  CST[g].rounds++; if (pts[0] > 0) CST[g].wins++; CST[g].net += delta;
  CS.log.push({ text });
  if (!CS.best || mag > CS.best.mag) CS.best = { no: CS.roundNo, who: text, mag };
  CS.result = { pts, detail, text, delta };
  v5Track(g, { pts, delta });
  CS.over = CS.roundNo >= CS.rounds;
  if (CS.over) finishC();
  saveCST(); save(); refreshWallet(); renderC();
  cRoundFx(pts);
  setTimeout(() => { if (CS.result && CS.result.pts === pts) showCResult(); }, 600);
}
function finishC() {
  const order = CS.scores.map((_, i) => i).sort((a, b) => CS.scores[b] - CS.scores[a]);
  const rank = order.indexOf(0) + 1, g = CS.game;
  ST.matches++; if (rank === 1) ST.firsts++; CST[g].matches++; if (rank === 1) CST[g].firsts++;
  const h = { id: CS.matchId, game: g, date: today(), mode: `${GAMES[g].name}・${CS.cfg.mode}`, n: CS.n, hands: CS.rounds, rounds: CS.rounds, base: CS.base, perTai: 0, scores: CS.scores.slice(), names: CS.players.map(p => p.name), avs: CS.players.map(p => p.av), rank, delta: CS.scores[0], bestHand: null, hands_: CS.log.slice() };
  HIST.unshift(h); HIST = HIST.slice(0, 40); CS.rank = rank;
  if (CS.cfg.club && CLUB) { CLUB.records.unshift({ date: today(), game: g, names: h.names, hands: CS.rounds, base: CS.base, perTai: 0, delta: CS.scores[0], jackpot: '' }); CLUB.records = CLUB.records.slice(0, 30); }
  if (rank === 1) sendMail('冠軍獎勵', `恭喜你在「${h.mode}」拿下第一名！附上獎勵 300 金幣。`, { coins: 300 });
}
// 牌桌特效：炸彈爆炸、勝負
function bombFx(p) { try { const XY = { 0: [.5, .62], 1: [.78, .38], 2: [.5, .22], 3: [.22, .38] }[cpos(p)]; particles({ x: innerWidth * XY[0], y: innerHeight * XY[1], n: 120, speed: 9, dur: 1300, colors: ['#ff5a1f', '#ffb000', '#fff1a8', '#ff2a2a', '#555'] }); shake($('#cgame')); } catch (e) {} }
function cRoundFx(pts) { try { const v = pts && pts[0]; if (v > 0) { beep('win'); bigText('勝利', 'gold', 1500); particles({ rays: true, n: 80, speed: 7, dur: 1400 }); } else if (v < 0) { beep('lose'); bigText('惜敗', 'grey', 1300); } else beep('tap'); } catch (e) {} }
function showCResult() {
  const r = CS.result; if (!r) return;
  const win = r.pts[0] > 0, ttl = r.pts[0] > 0 ? '你贏了！' : r.pts[0] < 0 ? '這局輸了' : '平手';
  modal(`<h2 class="grad">${ttl}</h2><div class="sub">${GAMES[CS.game].name}・第 ${CS.roundNo} / ${CS.rounds} 局・${esc(r.text)}・每${GAMES[CS.game].unit} ${CS.base} 金幣</div>
    ${r.detail}
    <div class="sub" style="margin-top:8px">本局金幣 <b class="num ${r.delta > 0 ? 'pos' : r.delta < 0 ? 'neg' : ''}">${r.delta > 0 ? '+' : ''}${fmt(r.delta)}</b>・累計 ${CS.players.map((P, i) => `${esc(cname(i))} <b class="num">${fmt(CS.scores[i])}</b>`).join('・')}</div>
    <div class="foot"><button class="btn ghost" id="mView">看牌桌</button><button class="btn primary" id="mNext">${CS.over ? '最終結算' : '下一局'}</button></div>`, pn => {
      pn.querySelector('#mView').onclick = closeModal;

}
function showCFinal() {

  const myRank = order.indexOf(0) + 1;
  modal(`<h2 class="grad">${myRank === 1 ? '恭喜奪冠！' : myRank === CS.n ? '下次再接再厲' : `第 ${myRank} 名`}</h2><div class="sub" style="margin-bottom:10px">${GAMES[CS.game].name}・${CS.cfg.mode}・${CS.rounds} 局・底 ${CS.base}</div>
    <div class="rcols"><div>${order.map((p, i) => `<div class="rank ${p === 0 ? 'me' : ''}"><div class="no n${i + 1}">${i + 1}</div>${avatar(CS.players[p].av, 38)}<div class="nm">${esc(CS.players[p].name)}</div><div class="sc num ${CS.scores[p] > 0 ? 'pos' : CS.scores[p] < 0 ? 'neg' : ''}">${CS.scores[p] > 0 ? '+' : ''}${fmt(CS.scores[p])}</div></div>`).join('')}</div>
    <div><h4>各局</h4><div class="sub" style="line-height:1.7">${CS.log.map((x, i) => `第 ${i + 1} 局：${esc(x.text)}`).join('<br>')}</div><div class="sub" style="margin-top:10px">金幣餘額 <b class="num">${fmt(WAL.coins)}</b>${myRank === 1 ? '<br>🏆 冠軍獎勵已寄到郵件' : ''}</div></div></div>
    <div class="foot"><button class="btn ghost" id="fShare">分享戰績</button><button class="btn ghost" id="fHome">${CS.cfg.mode === '好友房' ? '返回房間' : '返回大廳'}</button><button class="btn primary" id="fAgain">再來一場</button></div>`, pn => {
      pn.querySelector('#fShare').onclick = () => shareText(`我在鬧熱牌局「${GAMES[CS.game].name}」拿下第 ${myRank} 名，${CS.scores[0] >= 0 ? '贏了' : '輸了'} ${fmt(Math.abs(CS.scores[0]))} 金幣！`);
      pn.querySelector('#fHome').onclick = () => leaveC(true);
      pn.querySelector('#fAgain').onclick = () => { if (lowCoins(CS.base * 4)) return; startCardMatch(CS.cfg); };

}
function leaveC(force) {
