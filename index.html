<html lang="zh-TW">
<head>

<title>鬧熱牌局｜台灣麻將・十三支・大老二・鬥地主・暗棋</title>
<style>
.t{--w:46px;width:var(--w);height:calc(var(--w)*1.36);position:relative;flex:none;display:inline-block;
  border-radius:calc(var(--w)*.15);
  background:linear-gradient(160deg,#ffffff 0%,#fbf6e8 45%,#efe5c9 100%);
  box-shadow:
    inset 0 calc(var(--w)*.03) 0 rgba(255,255,255,.9),
    inset 0 calc(var(--w)*-.03) calc(var(--w)*.04) rgba(120,95,40,.18),
    0 calc(var(--w)*.05) 0 #e6dbbb,
    0 calc(var(--w)*.10) 0 var(--bk2,#27a36a),
    0 calc(var(--w)*.13) 0 var(--bk4,#11663f),
    0 calc(var(--w)*.18) calc(var(--w)*.22) rgba(0,0,0,.35);
  margin-bottom:calc(var(--w)*.13);
  transition:transform .16s cubic-bezier(.3,1.5,.6,1), box-shadow .16s;
}
.t svg{position:absolute;left:7%;top:6%;width:86%;height:86%;overflow:visible}
.t.back{background:linear-gradient(160deg,var(--bk1,#47d08f) 0%,var(--bk2,#22a065) 55%,var(--bk3,#16804e) 100%);
  box-shadow:inset 0 calc(var(--w)*.03) 0 rgba(255,255,255,.35),0 calc(var(--w)*.06) 0 var(--bk4,#0f5f39),0 calc(var(--w)*.10) 0 #f4ecd2,0 calc(var(--w)*.13) 0 #d9cca5,0 calc(var(--w)*.18) calc(var(--w)*.22) rgba(0,0,0,.35)}
.t.back::after{content:"";position:absolute;inset:16%;border-radius:20%;border:1.5px solid rgba(255,255,255,.18)}
:root{--k:1;--mint:#3ef0b5;--coral:#ff7a59;--gold:#ffc857;--cream:#f6f1e7;--ink:#0b1f22;
  --ui:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06161a;color:var(--cream);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#bg{position:fixed;inset:0;background:
  radial-gradient(60% 70% at 18% 20%,rgba(62,240,181,.22),transparent 60%),
  radial-gradient(50% 60% at 85% 80%,rgba(255,122,89,.20),transparent 60%),
  radial-gradient(40% 50% at 80% 10%,rgba(120,110,255,.18),transparent 60%),
  linear-gradient(160deg,#0a2a30 0%,#071b20 55%,#050f14 100%)}
#bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 85%)}
#stage{position:fixed;left:50%;top:50%;width:var(--W,960px);height:540px;transform:translate(-50%,-50%) scale(var(--k));transform-origin:center}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:scale(.985)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
button{font-family:var(--ui);cursor:pointer;border:0;color:inherit}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.btn{border-radius:999px;padding:12px 26px;font-size:18px;font-weight:800;letter-spacing:1px;transition:transform .12s ease,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active,.chip:active,.cbtn:active,.icon:active,.card:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(135deg,#ffd36b 0%,#ff9a52 45%,#ff6b6b 100%);color:#fff;box-shadow:0 8px 22px rgba(255,110,90,.45),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(150,40,20,.45)}
.btn.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.28);color:var(--cream);backdrop-filter:blur(10px)}
.btn.mint{background:linear-gradient(135deg,#6dffd0,#1fc99a);color:#053b2d;box-shadow:0 8px 20px rgba(31,201,154,.4)}
.icon{width:40px;height:40px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.icon svg{width:22px;height:22px}
.chip{padding:10px 18px;border-radius:999px;font-size:16px;font-weight:700;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);transition:all .18s;color:var(--cream);min-width:74px}
.chip.on{background:linear-gradient(135deg,#7dffd6,#22c99b);color:#04382b;border-color:transparent;box-shadow:0 6px 16px rgba(34,201,155,.4)}
.num{font-variant-numeric:tabular-nums;font-weight:800}

/* ---------- table ---------- */
.felt{position:absolute;inset:6px;border-radius:38px;
  background:radial-gradient(ellipse 60% 55% at 50% 47%,var(--f1,#1f9a76) 0%,var(--f2,#137a5f) 38%,var(--f3,#0d5a49) 70%,var(--f4,#093f36) 100%);
  box-shadow:inset 0 0 0 2px rgba(62,240,181,.25),inset 0 0 60px rgba(0,0,0,.45),0 0 0 7px #0a2125,0 0 0 8px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.6)}
.felt::before{content:"";position:absolute;left:50%;top:47%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(rgba(130,255,210,.16),transparent 62%)}
.felt::after{content:"";position:absolute;inset:0;border-radius:38px;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.25) .6px,transparent .7px);background-size:4px 4px}
.g-abs{position:absolute}
.seatchip{position:absolute;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;min-width:132px;transition:box-shadow .25s,border-color .25s}
.seatchip .avatar{width:36px;height:36px;font-size:15px}
.seatchip .nm{font-size:14px;font-weight:800;line-height:1.1;white-space:nowrap}
.seatchip .row2{display:flex;gap:5px;align-items:center;font-size:12px;margin-top:2px}
.seatchip .sc{font-weight:800}
.seatchip .sc.pos{color:var(--mint)}.seatchip .sc.neg{color:#ff9b8a}
.wtag{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:rgba(255,255,255,.16);font-weight:900;font-size:12px}
.dtag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:7px;background:linear-gradient(135deg,#ff8a5c,#ff4d6d);font-weight:900;font-size:12px;color:#fff}
.seatchip.active{border-color:rgba(62,240,181,.9);box-shadow:0 0 0 3px rgba(62,240,181,.25),0 0 26px rgba(62,240,181,.45)}
.backs-top{left:50%;top:16px;transform:translateX(-50%);display:flex;gap:1px}
.sideb{width:26px;height:13px;border-radius:4px;background:linear-gradient(90deg,#3fcb8a,#1c9560);box-shadow:inset 0 -3px 0 #f4ecd2,0 2px 3px rgba(0,0,0,.35);margin-bottom:-1px}
.backs-side{top:112px;display:flex;flex-direction:column;align-items:center;width:44px}
.backs-side.reveal{display:grid;grid-template-columns:repeat(2,20px);gap:1px 2px}
.b-l{left:14px}.b-r{right:14px}
.melds{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;align-items:flex-end}
.meld{display:inline-flex;gap:1px;padding:2px;border-radius:7px;background:rgba(0,0,0,.18)}
.m-top{left:calc(50% + 168px);top:12px;width:calc(50% - 230px);max-width:300px}
.m-l{left:62px;top:110px;width:74px}
.m-r{right:62px;top:110px;width:74px;justify-content:flex-end}
.river{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.r2{left:calc(50% - 144px);top:64px;width:290px}
.r0{left:calc(50% - 144px);top:312px;width:290px}
.r3{left:160px;top:112px;width:116px}
.r1{right:158px;top:112px;width:116px}
.river .t.last{box-shadow:0 0 0 2px #ff7a59,0 0 14px rgba(255,122,89,.8),0 calc(var(--w)*.10) 0 #27a36a}
.river .t.new{animation:drop .38s cubic-bezier(.2,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(var(--dy,40px)) scale(1.6);opacity:0}100%{transform:none;opacity:1}}
.plate{left:calc(50% - 100px);top:186px;width:200px;height:120px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(5,30,28,.75),rgba(5,25,24,.55));border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.plate .w{position:absolute;font-weight:900;font-size:15px;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);transition:all .25s}
.plate .w.on{background:linear-gradient(135deg,#7dffd6,#22c99b);color:#04382b;box-shadow:0 0 16px rgba(62,240,181,.7)}
.plate .w0{bottom:-13px;left:87px}.plate .w2{top:-13px;left:87px}.plate .w3{left:-13px;top:47px}.plate .w1{right:-13px;top:47px}
.plate .rd{font-size:13px;opacity:.8;letter-spacing:1px}
.plate .left{font-size:38px;line-height:1.05;font-weight:900;background:linear-gradient(180deg,#fff,#a8ffe4);-webkit-background-clip:text;background-clip:text;color:transparent}
.plate .left small{font-size:13px;-webkit-text-fill-color:rgba(255,255,255,.7);margin-left:3px;font-weight:700}
.plate .tags{display:flex;gap:5px;margin-top:3px;font-size:11px}
.plate .tags span{padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.1)}
.plate .tags .lz{background:linear-gradient(135deg,#ff8a5c,#ff4d6d);font-weight:800}
.status{left:calc(50% - 144px);top:290px;width:290px;text-align:center;font-size:12px;opacity:0}
.myflw{left:14px;top:428px;display:flex;gap:2px;width:140px;flex-wrap:wrap}
.me-chip{left:12px;top:462px}
.hand{left:160px;right:10px;top:452px;height:80px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.hand .t.h{cursor:pointer}
@media (hover:hover){.hand .t.h:hover{transform:translateY(-6px)}}
.hand .t.sel,.hand .t.sel:hover{transform:translateY(-16px);box-shadow:0 0 0 2.5px var(--mint),0 0 22px rgba(62,240,181,.6),0 calc(var(--w)*.10) 0 #27a36a,0 calc(var(--w)*.13) 0 #11663f}
.hand .gap{width:14px;flex:none}
.hand .t .tp{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;padding:1px 5px;border-radius:6px;background:var(--mint);color:#04382b;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.hand .t.win{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(255,200,87,.8)}
.claimbar{right:12px;top:372px;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.cbtn{width:66px;height:66px;border-radius:50%;font-size:28px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;
  box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .12s;animation:cin .35s cubic-bezier(.2,1.6,.5,1) both;text-shadow:0 2px 3px rgba(0,0,0,.3)}
@keyframes cin{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.cbtn.hu{background:radial-gradient(circle at 35% 30%,#ff9a8a,#ff4d5e 55%,#d11f3c);box-shadow:0 0 0 4px rgba(255,77,94,.3),0 8px 22px rgba(255,77,94,.55),inset 0 2px 0 rgba(255,255,255,.45)}
.cbtn.zm{background:radial-gradient(circle at 35% 30%,#ffe9a3,#ffb547 55%,#f08a1c);color:#5a2a00;text-shadow:none;box-shadow:0 0 0 4px rgba(255,181,71,.3),0 8px 22px rgba(255,160,60,.55),inset 0 2px 0 rgba(255,255,255,.6)}
.cbtn.pon{background:radial-gradient(circle at 35% 30%,#9ec5ff,#4a7dff 55%,#2b54d9)}
.cbtn.kan{background:radial-gradient(circle at 35% 30%,#d9a8ff,#9b5cff 55%,#6d34d6)}
.cbtn.chi{background:radial-gradient(circle at 35% 30%,#9effd8,#22c99b 55%,#0d9673)}
.cbtn.pass{background:radial-gradient(circle at 35% 30%,#a9b8bd,#62757b 60%,#475559);font-size:22px}
.cbtn.wide{width:auto;border-radius:22px;padding:6px 12px;flex-direction:row;gap:4px;height:66px;font-size:22px}
.cbtn small{font-size:11px;font-weight:700;opacity:.9}
.ting{left:160px;top:404px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 12px;border-radius:14px;font-size:13px;font-weight:700}
.ting .w{display:inline-flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800;color:var(--mint)}
.ting .w .t{margin-bottom:3px}
.tbtn{top:10px;width:40px;height:40px}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:76px;font-weight:900;letter-spacing:4px;pointer-events:none;z-index:40;white-space:nowrap;
  -webkit-text-stroke:3px #fff;paint-order:stroke fill;animation:popin 1.15s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.pop span{background:var(--pg);-webkit-background-clip:text;background-clip:text;color:transparent}
.pop.k-hu{--pg:linear-gradient(180deg,#ffd36b,#ff4d5e)}.pop.k-pon{--pg:linear-gradient(180deg,#bcd6ff,#3c6dff)}
.pop.k-kan{--pg:linear-gradient(180deg,#e6c4ff,#8a4dff)}.pop.k-chi{--pg:linear-gradient(180deg,#b6ffe6,#13b788)}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}
  45%{transform:translate(-50%,-50%) scale(.96)}60%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(2,10,12,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.on{opacity:1;pointer-events:auto}
.modal .panel{width:660px;max-height:500px;overflow:auto;padding:22px 26px;transform:translateY(16px) scale(.96);transition:transform .35s cubic-bezier(.2,1.4,.5,1)}
.modal.on .panel{transform:none}
.panel{background:linear-gradient(160deg,rgba(28,58,62,.92),rgba(10,28,32,.94))!important}
.panel h2{margin:0 0 4px;font-size:30px;font-weight:900}
.panel h2.grad{background:linear-gradient(90deg,#ffd36b,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h4{margin:14px 0 6px;font-size:14px;opacity:.7;font-weight:700;letter-spacing:1px}
.panel .sub{opacity:.8;font-size:15px}
.panel .foot{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.panel .foot .btn{padding:10px 22px;font-size:17px}
.taigrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.taigrid div{display:flex;justify-content:space-between;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:15px}
.taigrid b{color:var(--gold)}
.total{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.total .big{font-size:40px;font-weight:900;background:linear-gradient(90deg,#ffd36b,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scores div{padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);text-align:center;font-size:13px}
.scores div b{display:block;font-size:19px;margin-top:2px}
.scores .d{font-size:12px;font-weight:800}
.pos{color:var(--mint)}.neg{color:#ff9b8a}
.winrow{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;margin-top:8px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);margin-bottom:8px;font-size:16px;font-weight:700}
.setrow .r{margin-left:auto;display:flex;gap:8px}
.toggle{width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.6,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle.on{background:linear-gradient(135deg,#7dffd6,#22c99b)}.toggle.on::after{transform:translateX(24px)}
.rules{font-size:14.5px;line-height:1.7;padding-left:20px;margin:6px 0}
.rules b{color:var(--mint)}
.inp{width:100%;font-size:20px;padding:12px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-family:var(--ui);outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--mint)}
.rank{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06);margin-bottom:8px}
.rank.me{background:linear-gradient(135deg,rgba(62,240,181,.22),rgba(14,155,120,.12));border:1px solid rgba(62,240,181,.5)}
.rank .no{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;background:rgba(255,255,255,.12)}
.rank .no.n1{background:linear-gradient(135deg,#ffe08a,#ffb22e);color:#5a3a00}.rank .no.n2{background:linear-gradient(135deg,#eef2f6,#aab6c2);color:#333}.rank .no.n3{background:linear-gradient(135deg,#ffc79a,#d9844a);color:#4a2200}
.rank .nm{font-size:17px;font-weight:800}.rank .sc{margin-left:auto;font-size:22px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);text-align:center;font-size:13px;opacity:.95}
.stat b{display:block;font-size:28px;margin-top:4px}
#rotate{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#0a2a30,#050f14);font-size:20px;font-weight:800;text-align:center}
#rotate svg{width:90px;height:90px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}50%,70%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
#rotate small{font-weight:500;opacity:.7;font-size:14px}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}

.modal .panel.wide{width:880px;max-height:520px;padding:20px 26px}
.rcols{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.taigrid.one{grid-template-columns:1fr}
.scores{grid-template-columns:repeat(2,1fr)}

/* ================= v3 ================= */
.status{left:calc(50% - 180px);top:314px;width:360px;text-align:center;font-size:13px;opacity:1;padding:8px 12px;border-radius:14px;z-index:5}
.btn.sm{padding:7px 14px;font-size:14px;letter-spacing:0}
.btn:disabled{opacity:.45;pointer-events:none}

/* login */

/* ================= v4「鬧熱牌局」新風格：新粗獷派（Neo-brutalism）糖果色 ================= */
:root{--ink:#1d1a2e;--paper:#fff4dc;--lemon:#ffd84d;--lilac:#b9a6ff;--mint2:#7ee8c4;--coralx:#ff8a7a;--sky:#8fd3ff;--pink:#ffb3d1;
  --cream:#1d1a2e;--mint:#2fbf8f;--gold:#f0a500;--sh:4px 4px 0 var(--ink);--sh2:2px 2px 0 var(--ink);
  --ui:'Avenir Next','PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',system-ui,sans-serif}
html,body{background:var(--paper);color:var(--ink)}
#bg{background:
  radial-gradient(circle at 8% 88%,var(--lilac) 0 70px,transparent 71px),
  radial-gradient(circle at 96% 12%,var(--pink) 0 90px,transparent 91px),
  radial-gradient(circle at 70% 105%,var(--mint2) 0 120px,transparent 121px),
  var(--paper)}
#bg::after{background-image:radial-gradient(rgba(29,26,46,.14) 1.2px,transparent 1.4px);background-size:20px 20px;mask-image:none}
.glass{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border:2.5px solid var(--ink);border-radius:16px;box-shadow:var(--sh)}
.btn{border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:14px;color:var(--ink);text-shadow:none!important;letter-spacing:.5px}
.btn:active,.chip:active,.icon:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--lemon);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:#fff;border:2.5px solid var(--ink);color:var(--ink);backdrop-filter:none}
.btn.mint{background:var(--mint2);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.line{background:#6be38a!important;color:var(--ink)!important;border:2.5px solid var(--ink)!important;box-shadow:3px 3px 0 var(--ink)!important}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.icon{border:2.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:var(--sh2)}
.chip{background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:12px}
.chip.on{background:var(--lilac);color:var(--ink);border-color:var(--ink);box-shadow:var(--sh2)}
.sub{opacity:.72}
.pos,.num.pos,.sc.pos,.dl.pos,b.pos{color:#0b9466!important}.neg,.num.neg,.sc.neg,.dl.neg,b.neg{color:#e0393f!important}
.modal{background:rgba(29,26,46,.42)}
.panel{background:#fffdf6!important;border:3px solid var(--ink)!important;box-shadow:6px 6px 0 var(--ink)!important;border-radius:20px!important;color:var(--ink)}
.panel h2.grad,h2.grad{background:linear-gradient(transparent 58%,var(--lemon) 58%,var(--lemon) 92%,transparent 92%);-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);display:inline-block;padding:0 4px}
.panel h4{opacity:.85}
.toast{background:var(--ink)!important;color:#fff;border:2.5px solid var(--ink)!important;box-shadow:4px 4px 0 var(--lemon)!important}
.tabs{background:#fff;border:2.5px solid var(--ink);box-shadow:var(--sh2)}
.tabs button{color:var(--ink);opacity:.8}.tabs button.on{background:var(--lemon);opacity:1;box-shadow:inset 0 0 0 2px var(--ink)}
.inp{background:#fff!important;border:2.5px solid var(--ink)!important;color:var(--ink)!important;border-radius:12px!important}
.inp::placeholder{color:rgba(29,26,46,.4)}
.ttl{color:#c46b00}
/* topbar */
.profile,.coins{color:var(--ink)}
.coins .plus{background:var(--coralx);border:2px solid var(--ink)}
.coins.rcard{padding-right:14px}
.ti{color:var(--ink);font-weight:700}
.ti svg{background:#fff;border:2.5px solid var(--ink);box-shadow:var(--sh2);color:var(--ink)}
.ti em{background:#ff4d5e;box-shadow:0 0 0 2px var(--ink)}
.bnav button{color:var(--ink);opacity:.8}.bnav button.on{background:var(--mint2);opacity:1;box-shadow:inset 0 0 0 2px var(--ink)}
.hdr h1{color:var(--ink)}
/* logo */
.logo .wm{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);filter:none;display:flex;gap:10px;font-size:76px;letter-spacing:2px}
.logo .wm span{display:inline-block;padding:2px 14px 6px;border:3.5px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);background:var(--lemon)}
.logo .wm .l2{background:var(--lilac);transform:rotate(3deg)}
.logo .wm .l1{transform:rotate(-3deg)}
.logo .tag{font-weight:800;letter-spacing:1px;font-size:14px;opacity:.85;margin-top:18px}
#login .logo{position:absolute;left:44px;top:70px}
#login .fan{left:60px;top:300px}
#login .fan .t,#login .fan .pc,#login .fan .aqp{animation:float 4s ease-in-out infinite}
.loginp{color:var(--ink)}
.agree a{color:#6a4cc4!important}
/* home */
.hhead{position:absolute;left:24px;top:76px;right:24px;display:flex;align-items:center;gap:12px}
.hwm{font-size:30px;font-weight:900;padding:0 10px 2px;background:var(--lemon);border:2.5px solid var(--ink);border-radius:12px;box-shadow:var(--sh2);transform:rotate(-2deg)}
.hwm b{color:#6a4cc4;margin-left:2px}
.hpill{font-weight:800;font-size:14px;padding:5px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff}
.hpill.gift{margin-left:auto;background:var(--pink);box-shadow:var(--sh2);animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.games{position:absolute;left:24px;right:24px;top:124px;height:228px;display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1fr;gap:14px}
.gcard{position:relative;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);text-align:left;padding:14px;overflow:hidden;color:var(--ink);transition:transform .12s}
.gcard:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
@media (hover:hover){.gcard:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}}
.c-mint{background:var(--mint2)}.c-lemon{background:var(--lemon)}.c-lilac{background:var(--lilac)}.c-coral{background:var(--coralx)}.c-sky{background:var(--sky)}
.gcard::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(29,26,46,.12) 1.2px,transparent 1.4px);background-size:14px 14px}
.gart{position:absolute;left:14px;top:14px;width:120px;height:80px}
.gart .t,.gart .pc,.gart .aqp{position:absolute}
.gglyph{position:absolute;right:-8px;top:72px;font-size:84px;font-weight:900;opacity:.16;line-height:1;letter-spacing:-6px}
.gcard h2{position:absolute;left:14px;bottom:52px;margin:0;font-size:28px;font-weight:900;letter-spacing:1px}
.gcard p{position:absolute;left:14px;right:12px;bottom:30px;margin:0;font-size:12px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gn{position:absolute;left:14px;bottom:8px;font-size:11px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.gcard .gplay{position:absolute;right:12px;bottom:10px;width:36px;height:36px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--sh2)}
.hrow2{position:absolute;left:24px;right:24px;top:370px;display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr 1fr;gap:12px}
.hbtn{height:62px;border:2.5px solid var(--ink);border-radius:16px;box-shadow:var(--sh);background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px}
.hbtn b{font-size:17px}.hbtn small{font-size:11px;opacity:.75;font-weight:700}
.hbtn:active{transform:translate(2px,2px);box-shadow:var(--sh2)}
/* game hub */
.hubw{display:grid;grid-template-columns:330px 1fr;gap:20px;height:100%}
.hubart{position:relative;border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:400px}
.hubart .gart.big{transform:scale(1.6);transform-origin:left top;left:24px;top:24px}
.hubart .gglyph{top:auto;bottom:70px;font-size:140px}
.hubart b{font-size:40px;font-weight:900}.hubart small{font-weight:700;opacity:.8}
.hubart .btn{align-self:flex-start}
.hubbtns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.hubb{height:120px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;box-shadow:var(--sh);text-align:left;padding:16px;position:relative;color:var(--ink)}
.hubb:nth-child(1){background:var(--lemon)}.hubb:nth-child(2){background:var(--pink)}
.hubb b{display:block;font-size:24px;font-weight:900;margin-top:24px}.hubb small{font-size:13px;font-weight:700;opacity:.75}
.hubb .emo{position:absolute;left:16px;top:12px;font-size:26px}
.hubb:active{transform:translate(2px,2px);box-shadow:var(--sh2)}
.gpick{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.gpk{border:2.5px solid var(--ink);border-radius:16px;box-shadow:var(--sh);padding:16px 10px;height:120px;text-align:left;color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end}
.gpk b{font-size:22px}.gpk small{font-size:11px;font-weight:700;opacity:.8}
.stag{position:absolute;right:8px;top:8px;background:var(--coralx);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:11px;font-weight:900}
.sitem{position:relative}
.nocharge{margin-top:12px;padding:10px 14px;border:2.5px dashed var(--ink);border-radius:14px;background:#fff;opacity:1!important;line-height:1.6}
.gpsbar{font-size:12px;font-weight:700;padding:6px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;margin-bottom:8px}
.gpsbar.on{background:var(--mint2)}
.gpsd{display:block;font-size:11px;opacity:.75}
.mrec{display:block;font-size:11px;opacity:.7}
.tut-g{display:flex;gap:16px;align-items:center;justify-content:center}
/* 麻將牌桌 */
.felt{border:3px solid var(--ink);box-shadow:inset 0 0 0 6px rgba(255,255,255,.35),6px 6px 0 var(--ink);background:
  radial-gradient(circle,rgba(255,255,255,.18) 1.2px,transparent 1.4px) 0 0/18px 18px,
  radial-gradient(ellipse 60% 55% at 50% 47%,var(--f1) 0%,var(--f2) 45%,var(--f3) 100%)}
.felt::before{background:radial-gradient(rgba(255,255,255,.35),transparent 62%)}
.felt::after{display:none}
.plate{background:#fff;border:2.5px solid var(--ink);box-shadow:var(--sh);color:var(--ink)}
.plate .left{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
.plate .left small{-webkit-text-fill-color:var(--ink)}
.plate .tags span{background:var(--paper);border:1.5px solid var(--ink)}
.plate .tags .lz{background:var(--coralx)}
.plate .w{background:#fff;color:var(--ink);border:2px solid var(--ink)}.plate .w.on{background:var(--lemon);box-shadow:var(--sh2)}
.seatchip{color:var(--ink)}
.seatchip.active{border-color:var(--ink);box-shadow:0 0 0 4px var(--lemon),4px 4px 0 var(--ink)}
.wtag{background:var(--paper);border:1.5px solid var(--ink);color:var(--ink)}
.dtag{background:var(--coralx);border:1.5px solid var(--ink);color:var(--ink)}

<script>
// ==ENGINE START==
const MJ = (() => {
  const RESERVE = 16;            // 留 16 張海底（牌尾）不摸
  const BASE = 100, PER_TAI = 20; // 底 100、每台 20
  const NUMS = '一二三四五六七八九';
  const SUITN = ['萬', '筒', '條'];
  const HON = '東南西北中發白';
  const FLW = '春夏秋冬梅蘭竹菊';
  const WINDS = '東南西北';
  const DRAGON_NAME = { 31: '紅中', 32: '青發', 33: '白板' };

  const isFlower = t => t >= 34;
  const isHonor = t => t >= 27 && t < 34;
  function tileName(t) {
    if (t < 27) return NUMS[t % 9] + SUITN[(t / 9) | 0];
    if (t < 34) return HON[t - 27];
    return FLW[t - 34];
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function buildWall(rng, flowers = true) {
    const w = [];
    for (let t = 0; t < 34; t++) for (let k = 0; k < 4; k++) w.push(t);
    if (flowers) for (let f = 34; f < 42; f++) w.push(f);
    for (let i = w.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [w[i], w[j]] = [w[j], w[i]]; }
    return w;
  }
  function counts(tiles) { const c = new Array(34).fill(0); for (const t of tiles) if (t < 34) c[t]++; return c; }
  const sortTiles = a => a.sort((x, y) => x - y);

  // ---------- 胡牌判定 ----------
  function setsOnly(c) {
    let i = 0; while (i < 34 && c[i] === 0) i++;
    if (i === 34) return true;
    if (c[i] >= 3) { c[i] -= 3; const ok = setsOnly(c); c[i] += 3; if (ok) return true; }
    if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--; const ok = setsOnly(c); c[i]++; c[i + 1]++; c[i + 2]++;
      if (ok) return true;
    }
    return false;
  }
  function isWinHand(tiles, meldCount) {
    if (tiles.length !== (5 - meldCount) * 3 + 2) return false;
    if (tiles.some(isFlower)) return false;
    const c = counts(tiles);
    for (let i = 0; i < 34; i++) if (c[i] >= 2) {
      c[i] -= 2; const ok = setsOnly(c); c[i] += 2; if (ok) return true;
    }
    return false;
  }
  function seqOnly(c) {
    let i = 0; while (i < 34 && c[i] === 0) i++;
    if (i === 34) return true;
    if (i >= 27 || i % 9 > 6 || !c[i + 1] || !c[i + 2]) return false;
    c[i]--; c[i + 1]--; c[i + 2]--; const ok = seqOnly(c); c[i]++; c[i + 1]++; c[i + 2]++;
    return ok;
  }
  function allSequencesHand(tiles) {
    const c = counts(tiles);
    for (let i = 0; i < 27; i++) if (c[i] >= 2) { c[i] -= 2; const ok = seqOnly(c); c[i] += 2; if (ok) return true; }
    return false;
  }
  function allTripletsHand(tiles) {
    const c = counts(tiles); let pairs = 0;
    for (let i = 0; i < 34; i++) { if (c[i] === 0 || c[i] === 3) continue; if (c[i] === 2) pairs++; else return false; }
    return pairs === 1;
  }

  // 嚦咕嚦咕：門清 17 張＝7 對＋1 刻（4 張同牌可當 2 對）
  function isLigu(tiles, meldCount) {
    if (meldCount !== 0 || tiles.length !== 17 || tiles.some(isFlower)) return false;
    const c = counts(tiles); let three = 0;
    for (let i = 0; i < 34; i++) { if (c[i] === 0 || c[i] === 2 || c[i] === 4) continue; if (c[i] === 3) three++; else return false; }
    return three === 1;
  }
  // 手牌拆解中最多可有幾個暗刻（skip：放槍胡的那張牌組成的刻子不算暗刻）
  function maxConcealedTriplets(tiles, skip) {
    const c = counts(tiles); let best = -1;
    (function dfs(hasPair, n) {
      let i = 0; while (i < 34 && c[i] === 0) i++;
      if (i === 34) { if (hasPair && n > best) best = n; return; }
      if (c[i] >= 3) { c[i] -= 3; dfs(hasPair, n + (i === skip ? 0 : 1)); c[i] += 3; }
      if (!hasPair && c[i] >= 2) { c[i] -= 2; dfs(true, n); c[i] += 2; }
      if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) { c[i]--; c[i + 1]--; c[i + 2]--; dfs(hasPair, n); c[i]++; c[i + 1]++; c[i + 2]++; }
    })(false, 0);
    return Math.max(0, best);
  }
  // 規則預設：約定（預設）／北部牌／南部牌
  const PRESETS = {
    std: { name: '約定規則', desc: '有花・莊家1台＋連N拉N・花每張1台・無字無花4台・無上限', flowers: true, dealerTai: true, duting: false, cap: 0, sky: [16, 16, 8] },
    north: { name: '北部牌', desc: '有花 18 墩・莊家1台＋連N拉N・獨聽（邊張/中洞/單吊）1台・無上限', flowers: true, dealerTai: true, duting: true, cap: 0, sky: [16, 16, 8] },
    south: { name: '南部牌', desc: '無花 17 墩・只算連N拉N（無莊家台）・不算獨聽・4台滿（莊家/連莊另計）', flowers: false, dealerTai: false, duting: false, cap: 4, sky: [24, 16, 16] },
  };

  // ---------- 向聽數（AI 用） ----------
  const memo = new Map();
  function pareto(list) {
    return list.filter(a => !list.some(b => b !== a && b[0] >= a[0] && b[1] >= a[1] && b[2] >= a[2] && (b[0] > a[0] || b[1] > a[1] || b[2] > a[2])));
  }
  function groupOptions(arr, honor) {
    const key = (honor ? 'h' : 's') + arr.join('');
    let r = memo.get(key); if (r) return r;
    const n = arr.length, c = arr.slice(), out = new Set();
    (function dfs(i, s, p, q) {
      while (i < n && c[i] === 0) i++;
      if (i >= n) { out.add(s * 100 + Math.min(p, 9) * 10 + q); return; }
      if (c[i] >= 3) { c[i] -= 3; dfs(i, s + 1, p, q); c[i] += 3; }
      if (!honor && i <= n - 3 && c[i + 1] && c[i + 2]) { c[i]--; c[i + 1]--; c[i + 2]--; dfs(i, s + 1, p, q); c[i]++; c[i + 1]++; c[i + 2]++; }

let AC = null, bgmTimer = null, bgmGain = null;
function ac() { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function beep(kind) {
  if (!CFG.sound || !CFG.sfxVol) return;
  try {
    const A = ac(), now = A.currentTime, V = CFG.sfxVol / 10;
    const tone = (f, t0, dur, type = 'triangle', vol = .18) => {
      const o = A.createOscillator(), g = A.createGain(); o.type = type; o.frequency.setValueAtTime(f, now + t0);
      g.gain.setValueAtTime(0, now + t0); g.gain.linearRampToValueAtTime(vol * V, now + t0 + .008); g.gain.exponentialRampToValueAtTime(.0005, now + t0 + dur);
      o.connect(g).connect(A.destination); o.start(now + t0); o.stop(now + t0 + dur + .02);
    };
    if (kind === 'tap') tone(1500, 0, .05, 'sine', .08);
    else if (kind === 'discard') { tone(320, 0, .09, 'square', .07); tone(1800, 0, .03, 'sine', .06); }
    else if (kind === 'claim') { tone(520, 0, .12); tone(780, .08, .16); }
    else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .35, 'triangle', .16));
    else if (kind === 'draw') tone(260, 0, .25, 'sine', .1);
    else if (kind === 'coin') [1200, 1600, 2000].forEach((f, i) => tone(f, i * .06, .12, 'sine', .1));
    else if (kind === 'join') { tone(660, 0, .1, 'sine', .1); tone(990, .08, .14, 'sine', .1); }
  } catch (e) {}
}
function vib(ms) { if (CFG.vibrate && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }
const CHORDS = [[220, 277.2, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6], [196, 246.9, 329.6]];
function bgmUpdate() {
  if (!CFG.bgm || !CFG.bgmVol) { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } if (bgmGain) bgmGain.gain.value = 0; return; }
  try {
    const A = ac();
    if (!bgmGain) { bgmGain = A.createGain(); bgmGain.connect(A.destination); }
    bgmGain.gain.value = CFG.bgmVol / 10 * .05;
    if (bgmTimer) return;
    let i = 0;
    const play = () => {
      const now = A.currentTime;
      CHORDS[i++ % CHORDS.length].forEach((f, k) => {
        const o = A.createOscillator(), g = A.createGain(); o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.5, now + 1.2); g.gain.linearRampToValueAtTime(0, now + 3.9);
        o.connect(g).connect(bgmGain); o.start(now + k * .05); o.stop(now + 4);
        if (k === 2) { const o2 = A.createOscillator(), g2 = A.createGain(); o2.type = 'triangle'; o2.frequency.value = f * 2;
          g2.gain.setValueAtTime(0, now + 1.6); g2.gain.linearRampToValueAtTime(.18, now + 1.7); g2.gain.exponentialRampToValueAtTime(.001, now + 3);
          o2.connect(g2).connect(bgmGain); o2.start(now + 1.6); o2.stop(now + 3.1); }
      });
    };
    play(); bgmTimer = setInterval(play, 4000);
  } catch (e) {}
}

OPEN.signin = () => {
  const gap = SIGN.last ? daysBetween(SIGN.last, today()) : 99;
  const can = SIGN.last !== today();
  let streak = SIGN.streak;
  if (can && gap > 1) streak = 0;
  if (streak >= 7 && can) streak = 0;
  const shown = can ? streak : SIGN.streak;
  modal(`<h2>每日簽到</h2><div class="sub">天天登入・好禮相送　已連續簽到 <b>${shown}</b> / 7 天</div>
    <div class="signg">${SIGN_REW.map(([c, j], i) => `<div class="sd ${i < shown ? 'got' : ''} ${i === streak && can ? 'now' : ''} ${i === 6 ? 'd7' : ''}"><small>第 ${i + 1} 天</small><div class="rw">${c ? coinSVG + '<b>' + fmt(c) + '</b>' : ''}${j ? '<span>' + jadeSVG + '<b>' + j + '</b></span>' : ''}</div>${i < shown ? '<i>✓</i>' : ''}</div>`).join('')}</div>

function trendSVG(list, w = 520, h = 150) {
  const pts = list.slice(0, 20).reverse(); if (pts.length < 2) return '<div class="empty">至少完成兩場後會顯示趨勢圖</div>';
  let acc = 0; const ys = pts.map(p => acc += p.delta); const mn = Math.min(0, ...ys), mx = Math.max(0, ...ys), sp = mx - mn || 1;
  const X = i => 30 + i * (w - 50) / (pts.length - 1), Y = v => 12 + (mx - v) / sp * (h - 34);
  const path = ys.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  return `<svg class="trend" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43e0b0" stop-opacity=".5"/><stop offset="1" stop-color="#43e0b0" stop-opacity="0"/></linearGradient></defs>
    <line x1="30" x2="${w - 20}" y1="${Y(0)}" y2="${Y(0)}" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
    <path d="${path}L${X(ys.length - 1)} ${h - 22}L30 ${h - 22}Z" fill="url(#tg)"/><path d="${path}" fill="none" stroke="#43e0b0" stroke-width="3" stroke-linejoin="round"/>
    ${ys.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${pts[i].delta >= 0 ? '#ffd36b' : '#ff7a7a'}"/>`).join('')}
    <text x="30" y="${h - 6}" fill="#cfe" font-size="11">較早</text><text x="${w - 20}" y="${h - 6}" fill="#cfe" font-size="11" text-anchor="end">最近</text>
    <text x="4" y="${Y(mx) + 4}" fill="#cfe" font-size="10">${fmt(mx)}</text><text x="4" y="${Y(mn) + 4}" fill="#cfe" font-size="10">${fmt(mn)}</text></svg>`;
}

// 人類玩家（含報聽、託管），每個決定都記錄下來供牌譜回放

const POPXY = () => [[STW / 2, 372], [STW - 220, 262], [STW / 2, 136], [230, 262]];

  setTimeout(() => { if (G.emo[p] === text) { delete G.emo[p]; if (tk === G.token) renderGame(); } }, 2600);

const BOT_EMO = { win: ['😆', '胡啦！', '運氣好而已～', '🎉'], lose: ['😭', '唉唷…', '下把換我', '🤯'], claim: ['嘿嘿', '😏', '謝啦'] };

async function startHand() {
  const token = ++G.token;
  Object.assign(G, { pending: null, sel: -1, reveal: G.kind === 'replay', result: null, ting: false, tingPick: false, rec: [], emo: {}, status: '' });
  G.handNo++;
  const seed = G.kind === 'replay' ? G.rp.seed : (Math.random() * 2147483647) | 0;
  G.handStart = { seed, dealer: G.dealer, roundWind: roundWind(), scores: G.scores.slice(), lian: G.lian };
  const g = new MJ.Game({ dealer: G.dealer, roundWind: roundWind(), scores: G.scores, lian: G.lian, base: G.base, perTai: G.perTai, players: G.n, rules: G.rules, preset: G.preset || 'std', rng: MJ.mulberry32(seed) });
  G.game = g; G.wallBreak = (seed >>> 3) % (g.tileTotal / 2);

  else { let i = 0; const acts = G.rp.acts; const next = async () => { await wait(650 / G.rspeed); await gate(); return acts[i++] || { type: 'pass' }; };
    agents = [{ human: true, turn: next, claim: next }].concat(Array(G.n - 1).fill(aiAgent('replay'))); }
  const delay = () => G.kind === 'replay' ? 650 / G.rspeed : SPD();
  if (G.kind === 'play' && G.handNo === 1) notify('start', `${WINDS[roundWind()]}風圈開始・${nameOf(G.dealer)} 坐莊`);
  try {
    const res = await MJ.playHand(g, agents, { delay, onEvent, isAborted: () => token !== G.token });
    if (token !== G.token) return;
    handOver(res);
  } catch (e) { if (e.message !== 'ABORT') { console.error(e); G.status = '錯誤：' + e.message; renderGame(); } }
}
const handLabel = () => G.kind === 'replay' ? G.rp.label : `${WINDS[roundWind()]}風圈・第 ${Math.min(G.dealerMoves + 1, G.hands)} / ${G.hands} 局`;
function handText(res) { if (res.type === 'win' && res.special) return `${nameOf(res.winner)} ${res.special} ${res.total} 台`; return res.type === 'win' ? `${nameOf(res.winner)} ${res.selfDraw ? '自摸' : '胡'} ${res.total} 台${res.selfDraw ? '' : '（' + nameOf(res.from) + ' 放槍）'}` : '流局'; }

function handOver(res) {
  const g = G.game; G.result = res; G.reveal = true; G.pending = null;
  res.handLabel = handLabel(); res.lianBefore = G.lian;
  if (res.type === 'win') { popup(res.winner, res.special || (res.selfDraw ? '自摸' : '胡'), 'hu'); beep('win'); vib([60, 40, 120]); } else beep('draw');
  if (G.kind === 'replay') { renderGame(); setTimeout(() => { if (G.result === res) showResult(); }, 1300); return; }
  if (G.kind === 'spectate') {
    if (res.type === 'win' && res.winner !== G.dealer) { G.dealer = (G.dealer + 1) % G.n; G.dealerMoves++; G.lian = 0; } else G.lian++;
    G.status = '本局：' + handText(res) + '・3 秒後下一局'; renderGame();
    const tk = G.token; setTimeout(() => { if (tk === G.token && G.kind === 'spectate') startHand(); }, 3200); return;
  }
  let delta = 0;
  if (res.type === 'win') {
    if (res.winner === 0) delta = Object.values(res.payments).reduce((a, b) => a + b, 0);
    else if (res.payments[0]) delta = -res.payments[0];
    const others = G.players.map((_, i) => i).filter(i => i !== 0);
    setTimeout(() => { if (res.winner !== 0) emote(res.winner, pick(BOT_EMO.win)); else if (Math.random() < .6) emote(pick(others), pick(BOT_EMO.lose)); }, 900);
  }
  res.delta = delta; WAL.coins += delta;
  ST.hands++; ST.todayHands++;
  if (res.type === 'win' && res.winner === 0) { ST.wins++; ST.todayWins++; if (res.selfDraw) ST.tsumo++; ST.best = Math.max(ST.best, res.total); }
  if (res.type !== 'win') ST.draws++;
  // 本場最大牌型
  if (res.type === 'win' && (!G.best || res.total > G.best.total)) G.best = { no: G.handNo, who: nameOf(res.winner), total: res.total, names: res.tai.map(x => x[0]).join('、') || '無台' };
  // 俱樂部彩金
  if (G.cfg.club && CLUB && res.type === 'win' && res.total >= 10 && CLUB.pool > 0) {
    const prize = Math.floor(CLUB.pool / 2); CLUB.pool -= prize; res.jackpot = prize;
    G.jackpots.push(`${nameOf(res.winner)} ${res.total} 台獨得彩金 ${fmt(prize)}`);
    if (res.winner === 0) { WAL.coins += prize; res.delta += prize; }
  }

  REPLAYS.unshift({ id: rid, date: today(), n: G.n, base: G.base, perTai: G.perTai, rules: G.rules, preset: G.preset, names: G.players.map(p => p.name), avs: G.players.map(p => p.av),
    text: `${G.cfg.mode}・${res.handLabel}・${handText(res)}`, label: res.handLabel, ...G.handStart, acts: G.rec.slice() });
  REPLAYS = REPLAYS.slice(0, 15);
  G.log.push({ text: handText(res), rid });

const CHIPXY = { 1: 'right:12px;top:58px', 2: 'left:62px;top:10px', 3: 'left:12px;top:58px', 0: 'left:12px;top:462px' };
function seatChip(p, g) {

}
const meldHTML = (m, w, reveal) => `<span class="meld">${m.tiles.map((t, i) => tile(m.type === 'akan' && !reveal && (i === 0 || i === 3) ? -1 : t, w)).join('')}</span>`;
function riverHTML(p, g, w) {
  const pl = g.players[p], ld = g.lastDiscard, pos = vpos(p), dy = [40, 0, -40, 0][pos], dx = [0, 40, 0, -40][pos];
  const html = pl.discards.map((t, i) => {

  }).join('');
  return `<div class="g-abs river r${pos} ${G.n === 2 ? 'two' : ''}">${html}</div>`;
}
function wallHTML(g) {
  const TT = g.tileTotal || 144, ST2 = TT / 2, PS = ST2 / 4; // 有花 18 墩／無花 17 墩
  const R = g.wall.length, back = g.backN || 0, front = TT - R - back, endIdx = TT - back, rsvFrom = Math.max(front, endIdx - MJ.RESERVE);
  const sides = [[], [], [], []];
  for (let s = 0; s < ST2; s++) {
    let c = 0, rsv = false;
    for (const ti of [2 * s, 2 * s + 1]) if (ti >= front && ti < endIdx) { c++; if (ti >= rsvFrom) rsv = true; }
    const a = (s + G.wallBreak) % ST2; sides[Math.floor(a / PS)][a % PS] = `<i class="ws c${c} ${rsv ? 'rsv' : ''}"></i>`;
  }

  const cls = ['w-b', 'w-r', 'w-t', 'w-l'];

function waitsOf(hand, meldCount, g, p) {

  const sp = !g.rules || g.rules.special !== false;
  for (let t = 0; t < 34; t++) if (MJ.isWinHand([...hand, t], meldCount) || (sp && MJ.isLigu([...hand, t], meldCount))) out.push([t, Math.max(0, 4 - vis[t])]);

  $('#game').dataset.kind = G.kind;
  // 牌牆

    if (p === V) continue;
    const pos = vpos(p), pl = g.players[p];
    h.push(seatChip(p, g));
    if (pos === 2) h.push(`<div class="g-abs backs-top">${G.reveal ? pl.hand.map(t => tile(t, 19)).join('') : pl.hand.map(() => tile(-1, 18)).join('')}</div>`);
    else h.push(`<div class="g-abs backs-side ${pos === 3 ? 'b-l' : 'b-r'} ${G.reveal ? 'reveal' : ''}">${G.reveal ? pl.hand.map(t => tile(t, 20)).join('') : pl.hand.map(() => '<div class="sideb"></div>').join('')}</div>`);

  for (let p = 0; p < G.n; p++) h.push(riverHTML(p, g, two ? 25 : 27));

  // 中央
  const left = Math.max(0, g.wall.length - MJ.RESERVE);
  const wcls = p => (g.turn === p && !g.result ? 'on' : '');
  const wseat = pos => { const p = g.players.findIndex((_, i) => vpos(i) === pos); return p < 0 ? '' : `<div class="w w${pos} ${wcls(p)}">${WINDS[g.players[p].seatWind]}</div>`; };
  h.push(`<div class="g-abs plate"><div class="rd">${handLabel()}</div>
    <div class="left num">${left}<small>張</small></div>
    <div class="tags">${G.lian ? `<span class="lz">連莊 ${G.lian}</span>` : ''}<span>${MJ.PRESETS[G.preset || 'std'].name.replace('規則', '').replace('牌', '')}</span><span>底 ${G.base}</span><span>台 ${G.perTai}</span>${g.rules.cap ? `<span>${g.rules.cap}台滿</span>` : ''}</div>${[0, 1, 2, 3].map(wseat).join('')}</div>`);
  // 自己（或觀戰視角）
  h.push(seatChip(V, g));
  if (me.flowers.length) h.push(`<div class="g-abs myflw">${me.flowers.map(t => tile(t, 22)).join('')}</div>`);
  let tiles = me.hand.slice(), drawn = null;
  if (g.drawnBy === V && !g.result) drawn = tiles.pop();
  tiles.sort((a, b) => a - b);
  const disp = drawn != null ? [...tiles, drawn] : tiles; G.disp = disp;
  const meldTiles = me.melds.reduce((s, m) => s + m.tiles.length, 0);
  const meldW = meldTiles * 33 + me.melds.length * 8;
  const tw = Math.min(48, Math.floor((STW - 180 - meldW - 16) / (disp.length + .4)) - 2);
  const myTurn = G.pending && G.pending.kind === 'turn';
  let tingSet = new Set();
  if (myTurn && (CFG.ting || G.tingPick || !G.ting)) {
    for (const t of new Set(disp)) { const rest = me.hand.slice(); rest.splice(rest.indexOf(t), 1); if (waitsOf(rest, me.melds.length, g, V).length) tingSet.add(t); }
  }
  G.tingSet = tingSet;
  const winT = g.result && g.result.type === 'win' && g.result.winner === V ? g.result.winTile : null;
  let winMarked = false;
  const handHtml = me.melds.map(m => meldHTML(m, 32, true)).join('') + (me.melds.length ? '<span class="gap"></span>' : '') +
    disp.map((t, i) => {
      let cls = 'h' + (i === G.sel ? ' sel' : '') + (G.tingPick && !tingSet.has(t) ? ' dim' : '');
      if (winT != null && t === winT && !winMarked && i === disp.length - 1) { cls += ' win'; winMarked = true; }
      const badge = (CFG.ting || G.tingPick) && tingSet.has(t) ? '<span class="tp">聽</span>' : '';
      return (drawn != null && i === disp.length - 1 ? '<span class="gap"></span>' : '') + tile(t, tw, cls, `data-i="${i}"`).replace('</div>', badge + '</div>');
    }).join('');
  h.push(`<div class="g-abs hand" id="myhand">${handHtml}</div>`);
  if (CFG.ting && !g.result && G.kind !== 'replay') {
    let waits = [], label = '';
    if (myTurn && G.sel >= 0) { const rest = me.hand.slice(); rest.splice(rest.indexOf(disp[G.sel]), 1); waits = waitsOf(rest, me.melds.length, g, V); label = '打這張聽'; }
    else if (!myTurn) { waits = waitsOf(me.hand, me.melds.length, g, V); label = G.ting ? '已報聽' : '聽牌'; }
    if (waits.length) h.push(`<div class="g-abs ting glass">${label}<span style="display:flex;gap:4px">${waits.map(([t, n]) => `<span class="w">${tile(t, 20)}剩${n}</span>`).join('')}</span></div>`);
  }
  // 動作列
  let cb = '';
  const pd = G.pending;
  if (G.kind === 'spectate') cb = `<span class="glass pillnote">👁 觀戰中・${esc(G.specName)}</span><button class="btn ghost" data-act="leave">離開觀戰</button>`;
  else if (G.kind === 'replay') cb = `<span class="glass pillnote">▶ 牌譜回放</span><button class="btn ghost sm" data-act="rpause">${G.paused ? '▶ 播放' : '⏸ 暫停'}</button><button class="btn ghost sm" data-act="rspeed">${G.rspeed}×</button><button class="btn ghost sm" data-act="rrestart">↺ 重播</button><button class="btn ghost sm" data-act="leave">離開</button>`;
  else if (g.result) cb = `<button class="btn ghost" data-act="result">查看結果</button><button class="btn primary" data-act="next">${G.over ? '最終結算' : '下一局'}</button>`;
  else if (G.auto) cb = `<span class="glass pillnote">🤖 託管中，電腦代打</span><button class="btn primary" data-act="unauto">取消託管</button>`;
  else if (pd && pd.kind === 'turn') {
    if (pd.o.tsumo) cb += `<button class="cbtn zm" data-act="tsumo">自摸</button>`;
    pd.o.akan.forEach(t => cb += `<button class="cbtn kan wide" data-act="akan" data-t="${t}">${tile(t, 24)}<span>暗槓</span></button>`);
    pd.o.kakan.forEach(t => cb += `<button class="cbtn kan wide" data-act="kakan" data-t="${t}">${tile(t, 24)}<span>加槓</span></button>`);
    if (!G.ting && tingSet.size && g.canDraw()) cb += `<button class="cbtn ting2 ${G.tingPick ? 'on' : ''}" data-act="baoting">${G.tingPick ? '取消' : '報聽'}</button>`;
    if (G.sel >= 0) cb += `<button class="btn primary" data-act="discard">${G.tingPick ? '報聽打出' : '打出'}</button>`;
    else if (!cb || G.tingPick) cb += `<span class="glass pillnote">${G.tingPick ? '選一張標「聽」的牌打出並報聽' : '輪到你：點一張牌，再點一次打出'}</span>`;
  } else if (pd && pd.kind === 'claim') {
    const o = pd.o;
    cb += `<span class="glass pillnote">${roleOf(pd.from)}${o.rob ? '加槓（可搶槓胡）' : '打出'}${tile(pd.t, 26)}</span>`;
    o.chi.forEach((pr, i) => cb += `<button class="cbtn chi wide" data-act="chi" data-k="${i}"><span>吃</span>${[...pr, pd.t].sort((a, b) => a - b).map(x => tile(x, 20)).join('')}</button>`);
    if (o.pon) cb += `<button class="cbtn pon" data-act="pon">碰</button>`;
    if (o.kan) cb += `<button class="cbtn kan" data-act="kan">槓</button>`;
    if (o.hu) cb += `<button class="cbtn hu" data-act="hu">胡</button>`;
    cb += `<button class="cbtn pass" data-act="pass">過</button>`;
  }
  h.push(`<div class="g-abs claimbar">${cb}</div>`);
  if (G.status) h.push(`<div class="g-abs status glass">${G.status}</div>`);
  $('#tbl').innerHTML = h.join('');
}

// ---------- 操作 ----------
$('#tbl').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) {
    const a = b.dataset.act, pd = G.pending; beep('tap');
    if (a === 'next') { if (G.over) showFinal(); else nextHand(); return; }
    if (a === 'result') { showResult(); return; }
    if (a === 'leave') { leaveGame(); return; }
    if (a === 'unauto') { G.auto = false; toast('已取消託管'); renderGame(); return; }
    if (a === 'rpause') { G.paused = !G.paused; renderGame(); return; }
    if (a === 'rspeed') { G.rspeed = G.rspeed >= 4 ? 1 : G.rspeed * 2; renderGame(); return; }
    if (a === 'rrestart') { G.paused = false; replayStart(); return; }
    if (!pd) return;
    if (a === 'baoting') { G.tingPick = !G.tingPick; if (G.tingPick && G.sel >= 0 && !G.tingSet.has(G.disp[G.sel])) G.sel = -1; renderGame(); return; }
    if (a === 'discard' && G.sel >= 0) humanDiscard(G.disp[G.sel]);
    else if (a === 'tsumo') resolvePending({ type: 'tsumo' });
    else if (a === 'akan' || a === 'kakan') resolvePending({ type: a, tile: +b.dataset.t });
    else if (['hu', 'pon', 'kan', 'pass'].includes(a)) resolvePending({ type: a });
    else if (a === 'chi') resolvePending({ type: 'chi', tiles: pd.o.chi[+b.dataset.k] });
    return;
  }
  const pi = e.target.closest('[data-pinfo]');
  if (pi) { playerInfo(+pi.dataset.pinfo); return; }
  const t = e.target.closest('#myhand .t.h');
  if (t && G.pending && G.pending.kind === 'turn') {
    const i = +t.dataset.i;
    if (G.tingPick && !G.tingSet.has(G.disp[i])) { toast('報聽時只能打出標「聽」的牌'); return; }
    if (G.sel === i) { humanDiscard(G.disp[i]); return; }
    G.sel = i; beep('tap'); renderGame();
  }
});
function humanDiscard(t) {
  if (G.tingPick) { G.ting = true; G.tingPick = false; popup(0, '聽', 'chi'); toast('已報聽：之後自動摸打，可胡時自動胡牌'); }
  resolvePending({ type: 'discard', tile: t });
}

}

    else h += `<div class="sub">${r.handLabel}・${r.selfDraw ? '自摸' : `${youOr(r.from)}${roleOf(r.from) && r.from ? '（' + roleOf(r.from) + '）' : ''}放槍`} ${r.winTile != null ? tileName(r.winTile) : ''}</div>`;

    h += `<div class="rcols"><div><h4>台數明細</h4><div class="taigrid">${r.tai.length ? r.tai.map(([n, v]) => `<div><span>${n}</span><b>${v} 台</b></div>`).join('') : '<div><span>無台（只算底）</span><b>0 台</b></div>'}</div>`;

const CS = { token: 0, pending: null, sel: new Set(), auto: false, hint: -1, acts: {}, msg: '' };

function startCardMatch(cfg) {

function startCRound() {

const chk = tk => { if (tk !== CS.token) throw new Error('ABORT'); };
function askHuman(kind, data) {

// ---------- 十三支 ----------
async function runSSZ(tk) {
  const SSZ = CG.SSZ, hands = SSZ.deal(CS.rng);
  CS.st = { hands, rows: [[], [], []], left: hands[0].slice(), done: [false, false, false, false], plays: [], phase: 'arrange', sugg: SSZ.suggest(hands[0], 3), special: SSZ.special(hands[0]) };
  beep('draw'); renderC();
  // 電腦陸續排好
  for (let p = 1; p < 4; p++) setTimeout(() => { if (tk === CS.token && CS.st.phase === 'arrange') { CS.st.done[p] = true; renderC(); } }, 900 + p * 700 + rnd(900));
  const mine = CS.auto ? autoSSZ() : await askHuman('ssz');
  chk(tk);
  const plays = hands.map((h, p) => {
    if (p === 0) return mine;
    const sp = SSZ.special(h); return sp ? { arr: sp.arr, special: sp } : { arr: SSZ.best(h) };
  });
  CS.st.plays = plays; CS.st.done = [true, true, true, true]; CS.st.phase = 'compare';
  const r = SSZ.settle(plays); CS.st.res = r;
  beep('claim'); renderC();
  r.shot.forEach((row, i) => row.forEach((v, j) => { if (v) setTimeout(() => { if (tk === CS.token) cpop(i, '打槍', 'pon'); }, 700 + i * 250); }));
  r.homerun.forEach((v, i) => { if (v) setTimeout(() => { if (tk === CS.token) cpop(i, '全壘打', 'hu'); }, 1500); });
  plays.forEach((pl, i) => { if (pl.special) setTimeout(() => { if (tk === CS.token) cpop(i, '報到・' + pl.special.name, 'hu'); }, 500); });
  await cWait(1800); chk(tk);
  const text = r.homerun.some(Boolean) ? `${cname(r.homerun.indexOf(true))} 全壘打` : `${cname(r.pts.indexOf(Math.max(...r.pts)))} 最多 ${Math.max(...r.pts)} 水`;
  cRoundOver(r.pts, sszDetail(plays, r), text, Math.max(...r.pts));
}
function autoSSZ() { const h = CS.st.hands[0], sp = CG.SSZ.special(h); return sp ? { arr: sp.arr, special: sp } : { arr: CG.SSZ.best(h) }; }
function sszDetail(plays, r) {
  const rowsHTML = (p) => {
    const pl = plays[p];
    if (pl.special) return `<div class="sszsp">報到：${pl.special.name}（${pl.special.value} 水）</div>`;
    const e = CG.SSZ.evalArr(pl.arr), foul = r.info[p].foul;
    return pl.arr.map((row, k) => `<div class="sszr">${row.map(c => cardHTML(c, 26)).join('')}<small>${foul ? '倒水' : e[k].name}${p !== 0 && !foul && !plays[0].special && !r.info[0].foul ? ` <em class="${r.rows[0][p][k] > 0 ? 'pos' : r.rows[0][p][k] < 0 ? 'neg' : ''}">${r.rows[0][p][k] > 0 ? '你贏' : r.rows[0][p][k] < 0 ? '你輸' : '平'}</em>` : ''}</small></div>`).join('');
  };
  return `<div class="sszcmp">${plays.map((_, p) => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b>${r.homerun[p] ? '<span class="tagx hu">全壘打</span>' : ''}${r.info[p].foul ? '<span class="tagx neg">倒水</span>' : ''}<span class="num ${r.pts[p] > 0 ? 'pos' : r.pts[p] < 0 ? 'neg' : ''}">${r.pts[p] > 0 ? '+' : ''}${r.pts[p]} 水</span></div>${rowsHTML(p)}</div>`).join('')}</div>`;
}

// ---------- 大老二 ----------
async function runB2(tk) {
  const B2 = CG.B2, S = B2.newRound(CS.rng); CS.st = S; CS.acts = {};
  beep('draw'); renderC();
  CS.msg = `${cname(S.turn)}有梅花 3，先出牌`; renderC(); await cWait(800); chk(tk);
  while (S.winner == null) {
    chk(tk);
    const p = S.turn, wasLead = !!S.lead;
    let cards;
    if (p === 0 && !CS.auto) cards = await askHuman('b2');
    else { await cWait(CSPD()); chk(tk); cards = B2.ai(S, p); }
    chk(tk);
    const leadBy = S.lead && S.lead.by;
    B2.act(S, p, cards);
    CS.msg = '';
    if (cards) { CS.acts[p] = { cards: cards.slice().sort((a, b) => a - b), name: B2.classify(cards).name }; beep('discard'); if (cards.length === 5) cpop(p, B2.classify(cards).name, 'pon'); if (S.hands[p].length === 1 && S.winner == null) cpop(p, '報單！', 'hu'); }
    else CS.acts[p] = { pass: true };
    if (wasLead && !S.lead && S.winner == null) { renderC(); await cWait(650); chk(tk); CS.acts = {}; CS.msg = `${cname(leadBy)}最大，重新出牌`; }
    renderC();
  }
  beep('win');
  const w = S.winner, r = S.result;
  const detail = `<div class="b2res">${S.hands.map((h, p) => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b>${p === w ? '<span class="tagx hu">出完</span>' : `<small>剩 ${h.length} 張${r.detail[p].twos ? `・含 2 ×${r.detail[p].twos}` : ''}・×${r.detail[p].mul}</small>`}<span class="num ${r.pts[p] > 0 ? 'pos' : 'neg'}">${r.pts[p] > 0 ? '+' : ''}${r.pts[p]}</span></div><div class="sszr">${h.map(c => cardHTML(c, 24)).join('')}</div></div>`).join('')}</div>`;
  await cWait(900); chk(tk);
  cRoundOver(r.pts, detail, `${cname(w)} 先出完`, r.pts[w]);
}

// ---------- 鬥地主 ----------
async function runDDZ(tk) {
  const D = CG.DDZ; let S, tries = 0;
  for (;;) {
    S = D.newRound(CS.rng, (CS.starter + CS.roundNo) % 3); CS.st = S; CS.acts = {};
    beep('draw'); renderC(); await cWait(500); chk(tk);
    while (S.phase === 'bid') {
      const p = S.turn; let v;
      if (p === 0 && !CS.auto) v = await askHuman('bid');
      else { await cWait(CSPD() * .8); chk(tk); v = (tries >= 3 && p === S.starter && !S.cur) ? Math.max(1, D.aiBid(S.hands[p], S.cur)) : D.aiBid(S.hands[p], S.cur); }
      chk(tk);
      D.bid(S, p, v); CS.acts[p] = { text: v ? v + ' 分' : '不叫' }; beep('tap'); renderC();
    }
    if (S.phase === 'play') break;
    tries++; CS.msg = '沒有人叫地主，重新發牌'; renderC(); await cWait(1200); chk(tk); CS.msg = '';
  }
  CS.acts = {}; cpop(S.landlord, '地主', 'hu'); CS.msg = `${cname(S.landlord)}當地主（${S.cur} 分），拿走 3 張底牌`; renderC(); await cWait(1000); chk(tk);
  while (S.phase === 'play') {
    chk(tk);
    const p = S.turn, wasLead = !!S.last;
    let cards;
    if (p === 0 && !CS.auto) cards = await askHuman('ddz');
    else { await cWait(CSPD()); chk(tk); cards = D.ai(S, p); }
    chk(tk);
    const lastBy = S.last && S.last.p;
    D.play(S, p, cards); CS.msg = '';
    if (cards) { const pl = S.last.play; CS.acts[p] = { cards: S.last.cards, name: D.TYPE[pl.type] }; beep('discard');
      if (pl.type === 'bomb' || pl.type === 'rocket') { cpop(p, D.TYPE[pl.type] + ' ×2', 'hu'); vib(60); } else if (['straight', 'pairs', 'plane', 'plane1', 'plane2'].includes(pl.type)) cpop(p, D.TYPE[pl.type], 'pon');
      if (S.hands[p].length <= 2 && S.phase === 'play') cpop(p, `剩 ${S.hands[p].length} 張`, 'chi'); }
    else CS.acts[p] = { pass: true };
    if (wasLead && !S.last && S.phase === 'play') { renderC(); await cWait(600); chk(tk); CS.acts = {}; CS.msg = `${cname(lastBy)}最大，重新出牌`; }
    renderC();
  }
  beep('win');
  const r = S.result;
  if (r.spring) cpop(S.winner, r.spring, 'hu');
  const detail = `<div class="ddzres"><div class="sub">${r.landlordWin ? '地主勝' : '農民勝'}・叫 ${r.bid} 分・炸彈 ${r.bombs} 個${r.spring ? '・' + r.spring : ''}・倍數 ×${r.mult}</div>${S.hands.map((h, p) => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b><span class="tagx ${p === S.landlord ? 'hu' : ''}">${p === S.landlord ? '地主' : '農民'}</span><span class="num ${r.pts[p] > 0 ? 'pos' : 'neg'}">${r.pts[p] > 0 ? '+' : ''}${r.pts[p]}</span></div><div class="sszr">${h.map(c => cardHTML(c, 24)).join('') || '<small>出完</small>'}</div></div>`).join('')}</div>`;
  await cWait(1000); chk(tk);
  cRoundOver(r.pts, detail, `${r.landlordWin ? '地主' : '農民'}勝 ×${r.mult}`, r.mult);
}

// ---------- 暗棋 ----------
async function runAQ(tk) {
  const A = CG.AQ, first = (CS.starter + CS.roundNo) % 2, S = A.newGame(CS.rng, first); CS.st = S; CS.aqSel = -1;
  beep('draw'); CS.msg = `${cname(first)}先手：翻開的第一顆棋決定顏色`; renderC();
  while (!S.result) {
    chk(tk);
    const p = S.turn; let mv;
    if (p === 0 && !CS.auto) mv = await askHuman('aq');
    else { await cWait(CSPD() * .9); chk(tk); mv = A.ai(S, p, CS.rng); }
    chk(tk);
    const cap = mv.t === 'move' && S.board[mv.to];
    A.apply(S, p, mv); CS.msg = ''; CS.aqSel = -1;
    if (mv.t === 'flip' && S.plies === 1) cpop(p, (S.color[p] ? '黑方' : '紅方'), 'chi');
    if (cap) { beep('claim'); cpop(p, '吃 ' + A.NAMES[cap.side][cap.r], cap.r >= 6 ? 'hu' : 'pon'); } else beep('discard');
    renderC();
  }
  beep(S.result.winner === 0 ? 'win' : 'draw');
  const w = S.result.winner, pts = w == null ? [0, 0] : w === 0 ? [1, -1] : [-1, 1];
  const left = q => S.board.filter(x => x && x.side === S.color[q]).length;
  const detail = `<div class="ddzres"><div class="sub">${S.result.reason}・共 ${S.plies} 步</div>${[0, 1].map(p => `<div class="sszp ${p === 0 ? 'me' : ''}"><div class="who">${avatar(CS.players[p].av, 26)}<b>${esc(cname(p))}</b><span class="tagx">${S.color[p] == null ? '未定' : S.color[p] ? '黑方' : '紅方'}</span><small>剩 ${left(p)} 子・吃 ${S.captured[p].length} 子</small><span class="num ${pts[p] > 0 ? 'pos' : pts[p] < 0 ? 'neg' : ''}">${pts[p] > 0 ? '+1' : pts[p] < 0 ? '−1' : '0'}</span></div><div class="sszr">${S.captured[p].map(x => pieceHTML(Object.assign({}, x, { up: true }), 24)).join('')}</div></div>`).join('')}</div>`;
  await cWait(900); chk(tk);
  cRoundOver(pts, detail, w == null ? '和局' : `${cname(w)} 獲勝`, 1);
}

// ---------- 結算 ----------
function cRoundOver(pts, detail, text, mag) {
  const base = CS.base, delta = pts[0] * base;
  pts.forEach((v, i) => CS.scores[i] += v * base);
  WAL.coins += delta;
  const g = CS.game; CST[g] = CST[g] || { rounds: 0, wins: 0, matches: 0, firsts: 0, net: 0 };
  CST[g].rounds++; if (pts[0] > 0) CST[g].wins++; CST[g].net += delta;
  CS.log.push({ text });
  if (!CS.best || mag > CS.best.mag) CS.best = { no: CS.roundNo, who: text, mag };
  CS.result = { pts, detail, text, delta };
  CS.over = CS.roundNo >= CS.rounds;
  if (CS.over) finishC();
  saveCST(); save(); refreshWallet(); renderC();
  setTimeout(() => { if (CS.result && CS.result.pts === pts) showCResult(); }, 600);
}
function finishC() {
  const order = CS.scores.map((_, i) => i).sort((a, b) => CS.scores[b] - CS.scores[a]);
  const rank = order.indexOf(0) + 1, g = CS.game;
  ST.matches++; if (rank === 1) ST.firsts++; CST[g].matches++; if (rank === 1) CST[g].firsts++;
  const h = { id: CS.matchId, game: g, date: today(), mode: `${GAMES[g].name}・${CS.cfg.mode}`, n: CS.n, hands: CS.rounds, rounds: CS.rounds, base: CS.base, perTai: 0, scores: CS.scores.slice(), names: CS.players.map(p => p.name), avs: CS.players.map(p => p.av), rank, delta: CS.scores[0], bestHand: null, hands_: CS.log.slice() };
