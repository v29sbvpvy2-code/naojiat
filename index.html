<title>鬧熱牌局｜台灣麻將・十三支・大老二・鬥地主・暗棋</title>
<style>
/* 台灣麻將牌：大而厚的方正牌身，象牙白牌面＋厚實的有色牌背（雙層），圓角較小 */
.t{--w:46px;width:var(--w);height:calc(var(--w)*1.34);position:relative;flex:none;display:inline-block;
  border-radius:calc(var(--w)*.085);
  background:linear-gradient(180deg,#f8f9fb 0%,#eceef2 45%,#d9dde3 100%);
  box-shadow:
    inset 0 calc(var(--w)*.02) 0 rgba(255,255,255,.95),
    inset calc(var(--w)*.018) 0 0 rgba(255,255,255,.6),
    inset 0 calc(var(--w)*-.03) calc(var(--w)*.045) rgba(110,85,40,.2),
    inset calc(var(--w)*-.018) 0 calc(var(--w)*.03) rgba(110,85,40,.12),
    0 calc(var(--w)*.035) 0 #e6dbbb,
    0 calc(var(--w)*.065) 0 #d6c9a3,
    0 calc(var(--w)*.075) 0 var(--bk1,#3f8a5e),
    0 calc(var(--w)*.15) 0 var(--bk2,#2a6b48),
    0 calc(var(--w)*.2) 0 var(--bk4,#123a25),
    0 calc(var(--w)*.23) calc(var(--w)*.16) rgba(0,0,0,.5);
  margin-bottom:calc(var(--w)*.2);
  transition:transform .16s ease, box-shadow .16s;
}
.t svg{position:absolute;left:4.5%;top:4%;width:91%;height:92%;overflow:visible}
.t.back{background:linear-gradient(170deg,var(--bk1,#3f8a5e) 0%,var(--bk2,#2a6b48) 55%,var(--bk3,#1d5236) 100%);
  box-shadow:inset 0 calc(var(--w)*.025) 0 rgba(255,255,255,.25),inset 0 calc(var(--w)*-.03) calc(var(--w)*.05) rgba(0,0,0,.3),0 calc(var(--w)*.06) 0 var(--bk4,#123a25),0 calc(var(--w)*.075) 0 #d6c9a3,0 calc(var(--w)*.15) 0 #efe6cb,0 calc(var(--w)*.17) 0 #cdbf98,0 calc(var(--w)*.2) calc(var(--w)*.16) rgba(0,0,0,.45)}
.t.back::after{content:"";position:absolute;inset:14%;border-radius:10%;border:1px solid rgba(255,240,200,.16)}
:root{--k:1;--mint:#c9a45a;--coral:#ff7a59;--gold:#ffc857;--cream:#f6f1e7;--ink:#0b1f22;
  --ui:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06161a;color:var(--cream);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#bg{position:fixed;inset:0;background:
  radial-gradient(60% 70% at 18% 20%,rgba(201,164,90,.22),transparent 60%),
  radial-gradient(50% 60% at 85% 80%,rgba(255,122,89,.20),transparent 60%),
  radial-gradient(40% 50% at 80% 10%,rgba(120,110,255,.18),transparent 60%),
  linear-gradient(160deg,#0a2a30 0%,#071b20 55%,#050f14 100%)}
#bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 85%)}
#stage{position:fixed;left:50%;top:50%;width:var(--W,960px);height:540px;transform:translate(-50%,-50%) scale(var(--k));transform-origin:center}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:scale(.985)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
button{font-family:var(--ui);cursor:pointer;border:0;color:inherit}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.btn{border-radius:999px;padding:12px 26px;font-size:18px;font-weight:800;letter-spacing:1px;transition:transform .12s ease,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active,.chip:active,.cbtn:active,.icon:active,.card:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(135deg,#ffd36b 0%,#ff9a52 45%,#ff6b6b 100%);color:#fff;box-shadow:0 8px 22px rgba(255,110,90,.45),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(150,40,20,.45)}
.btn.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.28);color:var(--cream);backdrop-filter:blur(10px)}
.btn.mint{background:linear-gradient(135deg,#6dffd0,#1fc99a);color:#053b2d;box-shadow:0 8px 20px rgba(31,201,154,.4)}
.icon{width:40px;height:40px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.icon svg{width:22px;height:22px}
.chip{padding:10px 18px;border-radius:999px;font-size:16px;font-weight:700;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);transition:all .18s;color:var(--cream);min-width:74px}
.chip.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;border-color:transparent;box-shadow:0 6px 16px rgba(34,201,155,.4)}
.num{font-variant-numeric:tabular-nums;font-weight:800}

/* ---------- table ---------- */
.felt{position:absolute;inset:6px;border-radius:38px;
  background:radial-gradient(ellipse 60% 55% at 50% 47%,var(--f1,#1f9a76) 0%,var(--f2,#137a5f) 38%,var(--f3,#0d5a49) 70%,var(--f4,#093f36) 100%);
  box-shadow:inset 0 0 0 2px rgba(201,164,90,.25),inset 0 0 60px rgba(0,0,0,.45),0 0 0 7px #0a2125,0 0 0 8px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.6)}
.felt::before{content:"";position:absolute;left:50%;top:47%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(rgba(130,255,210,.16),transparent 62%)}
.felt::after{content:"";position:absolute;inset:0;border-radius:38px;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.25) .6px,transparent .7px);background-size:4px 4px}
.g-abs{position:absolute}
.seatchip{position:absolute;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;min-width:132px;transition:box-shadow .25s,border-color .25s}
.seatchip .avatar{width:36px;height:36px;font-size:15px}
.seatchip .nm{font-size:14px;font-weight:800;line-height:1.1;white-space:nowrap}
.seatchip .row2{display:flex;gap:5px;align-items:center;font-size:12px;margin-top:2px}
.seatchip .sc{font-weight:800}
.seatchip .sc.pos{color:var(--mint)}.seatchip .sc.neg{color:#ff9b8a}
.wtag{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:rgba(255,255,255,.16);font-weight:900;font-size:12px}
.dtag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:7px;background:linear-gradient(135deg,#ff8a5c,#ff4d6d);font-weight:900;font-size:12px;color:#fff}
.seatchip.active{border-color:rgba(201,164,90,.9);box-shadow:0 0 0 3px rgba(201,164,90,.25),0 0 26px rgba(201,164,90,.45)}
.backs-top{left:50%;top:16px;transform:translateX(-50%);display:flex;gap:1px}
.sideb{width:26px;height:13px;border-radius:4px;background:linear-gradient(90deg,#3fcb8a,#1c9560);box-shadow:inset 0 -3px 0 #f4ecd2,0 2px 3px rgba(0,0,0,.35);margin-bottom:-1px}
.backs-side{top:112px;display:flex;flex-direction:column;align-items:center;width:44px}
.backs-side.reveal{display:grid;grid-template-columns:repeat(2,20px);gap:1px 2px}
.b-l{left:14px}.b-r{right:14px}
.melds{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;align-items:flex-end}
.meld{display:inline-flex;gap:1px;padding:2px;border-radius:7px;background:rgba(0,0,0,.18)}
.m-top{left:calc(50% + 168px);top:12px;width:calc(50% - 230px);max-width:300px}
.m-l{left:62px;top:110px;width:74px}
.m-r{right:62px;top:110px;width:74px;justify-content:flex-end}
.river{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.r2{left:calc(50% - 144px);top:64px;width:290px}
.r0{left:calc(50% - 144px);top:312px;width:290px}
.r3{left:160px;top:112px;width:116px}
.r1{right:158px;top:112px;width:116px}
.river .t.last{box-shadow:0 0 0 2px #ff7a59,0 0 14px rgba(255,122,89,.8),0 calc(var(--w)*.10) 0 #27a36a}
.river .t.new{animation:drop .38s cubic-bezier(.2,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(var(--dy,40px)) scale(1.6);opacity:0}100%{transform:none;opacity:1}}
.plate{left:calc(50% - 100px);top:186px;width:200px;height:120px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(5,30,28,.75),rgba(5,25,24,.55));border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.plate .w{position:absolute;font-weight:900;font-size:15px;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);transition:all .25s}
.plate .w.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;box-shadow:0 0 16px rgba(201,164,90,.7)}
.plate .w0{bottom:-13px;left:87px}.plate .w2{top:-13px;left:87px}.plate .w3{left:-13px;top:47px}.plate .w1{right:-13px;top:47px}
.plate .rd{font-size:13px;opacity:.8;letter-spacing:1px}
.plate .left{font-size:38px;line-height:1.05;font-weight:900;background:linear-gradient(180deg,#fff,#a8ffe4);-webkit-background-clip:text;background-clip:text;color:transparent}
.plate .left small{font-size:13px;-webkit-text-fill-color:rgba(255,255,255,.7);margin-left:3px;font-weight:700}
.plate .tags{display:flex;gap:5px;margin-top:3px;font-size:11px}
.plate .tags span{padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.1)}
.plate .tags .lz{background:linear-gradient(135deg,#ff8a5c,#ff4d6d);font-weight:800}
.status{left:calc(50% - 144px);top:290px;width:290px;text-align:center;font-size:12px;opacity:0}
.myflw{left:14px;top:428px;display:flex;gap:2px;width:140px;flex-wrap:wrap}
.me-chip{left:12px;top:462px}
.hand{left:160px;right:10px;top:452px;height:80px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.hand .t.h{cursor:pointer}
@media (hover:hover){.hand .t.h:hover{transform:translateY(-6px)}}
.hand .t.sel,.hand .t.sel:hover{transform:translateY(-16px);box-shadow:0 0 0 2.5px var(--mint),0 0 22px rgba(201,164,90,.6),0 calc(var(--w)*.10) 0 #27a36a,0 calc(var(--w)*.13) 0 #11663f}
.hand .gap{width:14px;flex:none}
.hand .t .tp{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;padding:1px 5px;border-radius:6px;background:var(--mint);color:#2a1a0b;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.hand .t.win{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(255,200,87,.8)}
.claimbar{right:12px;top:372px;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.cbtn{width:66px;height:66px;border-radius:50%;font-size:28px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;
  box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .12s;animation:cin .35s cubic-bezier(.2,1.6,.5,1) both;text-shadow:0 2px 3px rgba(0,0,0,.3)}
@keyframes cin{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.cbtn.hu{background:radial-gradient(circle at 35% 30%,#ff9a8a,#ff4d5e 55%,#d11f3c);box-shadow:0 0 0 4px rgba(255,77,94,.3),0 8px 22px rgba(255,77,94,.55),inset 0 2px 0 rgba(255,255,255,.45)}
.cbtn.zm{background:radial-gradient(circle at 35% 30%,#ffe9a3,#ffb547 55%,#f08a1c);color:#5a2a00;text-shadow:none;box-shadow:0 0 0 4px rgba(255,181,71,.3),0 8px 22px rgba(255,160,60,.55),inset 0 2px 0 rgba(255,255,255,.6)}
.cbtn.pon{background:radial-gradient(circle at 35% 30%,#9ec5ff,#4a7dff 55%,#2b54d9)}
.cbtn.kan{background:radial-gradient(circle at 35% 30%,#d9a8ff,#9b5cff 55%,#6d34d6)}
.cbtn.chi{background:radial-gradient(circle at 35% 30%,#9effd8,#22c99b 55%,#0d9673)}
.cbtn.pass{background:radial-gradient(circle at 35% 30%,#a9b8bd,#62757b 60%,#475559);font-size:22px}
.cbtn.wide{width:auto;border-radius:22px;padding:6px 12px;flex-direction:row;gap:4px;height:66px;font-size:22px}
.cbtn small{font-size:11px;font-weight:700;opacity:.9}
.ting{left:160px;top:404px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 12px;border-radius:14px;font-size:13px;font-weight:700}
.ting .w{display:inline-flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800;color:var(--mint)}
.ting .w .t{margin-bottom:3px}
.tbtn{top:10px;width:40px;height:40px}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:76px;font-weight:900;letter-spacing:4px;pointer-events:none;z-index:40;white-space:nowrap;
  -webkit-text-stroke:3px #fff;paint-order:stroke fill;animation:popin 1.15s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.pop span{background:var(--pg);-webkit-background-clip:text;background-clip:text;color:transparent}
.pop.k-hu{--pg:linear-gradient(180deg,#ffd36b,#ff4d5e)}.pop.k-pon{--pg:linear-gradient(180deg,#bcd6ff,#3c6dff)}
.pop.k-kan{--pg:linear-gradient(180deg,#e6c4ff,#8a4dff)}.pop.k-chi{--pg:linear-gradient(180deg,#b6ffe6,#13b788)}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}
  45%{transform:translate(-50%,-50%) scale(.96)}60%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(2,10,12,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.on{opacity:1;pointer-events:auto}
.modal .panel{width:660px;max-height:500px;overflow:auto;padding:22px 26px;transform:translateY(16px) scale(.96);transition:transform .35s cubic-bezier(.2,1.4,.5,1)}
.modal.on .panel{transform:none}
.panel{background:linear-gradient(160deg,rgba(28,58,62,.92),rgba(10,28,32,.94))!important}
.panel h2{margin:0 0 4px;font-size:30px;font-weight:900}
.panel h2.grad{background:linear-gradient(180deg,#f4e2ac,#c9a45a 60%,#9c7633);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h4{margin:14px 0 6px;font-size:14px;opacity:.7;font-weight:700;letter-spacing:1px}
.panel .sub{opacity:.8;font-size:15px}
.panel .foot{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.panel .foot .btn{padding:10px 22px;font-size:17px}
.taigrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.taigrid div{display:flex;justify-content:space-between;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:15px}
.taigrid b{color:var(--gold)}
.total{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.total .big{font-size:40px;font-weight:900;background:linear-gradient(180deg,#f4e2ac,#c9a45a 60%,#9c7633);-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scores div{padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);text-align:center;font-size:13px}
.scores div b{display:block;font-size:19px;margin-top:2px}
.scores .d{font-size:12px;font-weight:800}
.pos{color:var(--mint)}.neg{color:#ff9b8a}
.winrow{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;margin-top:8px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);margin-bottom:8px;font-size:16px;font-weight:700}
.setrow .r{margin-left:auto;display:flex;gap:8px}
.toggle{width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.6,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle.on{background:linear-gradient(180deg,#e6cf8e,#b48c40)}.toggle.on::after{transform:translateX(24px)}
.rules{font-size:14.5px;line-height:1.7;padding-left:20px;margin:6px 0}
.rules b{color:var(--mint)}
.inp{width:100%;font-size:20px;padding:12px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-family:var(--ui);outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--mint)}
.rank{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06);margin-bottom:8px}
.rank.me{background:linear-gradient(135deg,rgba(201,164,90,.22),rgba(14,155,120,.12));border:1px solid rgba(201,164,90,.5)}
.rank .no{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;background:rgba(255,255,255,.12)}
.rank .no.n1{background:linear-gradient(135deg,#ffe08a,#ffb22e);color:#5a3a00}.rank .no.n2{background:linear-gradient(135deg,#eef2f6,#aab6c2);color:#333}.rank .no.n3{background:linear-gradient(135deg,#ffc79a,#d9844a);color:#4a2200}
.rank .nm{font-size:17px;font-weight:800}.rank .sc{margin-left:auto;font-size:22px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);text-align:center;font-size:13px;opacity:.95}
.stat b{display:block;font-size:28px;margin-top:4px}
#rotate{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#0a2a30,#050f14);font-size:20px;font-weight:800;text-align:center}
#rotate svg{width:90px;height:90px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}50%,70%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
#rotate small{font-weight:500;opacity:.7;font-size:14px}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}

.modal .panel.wide{width:880px;max-height:520px;padding:20px 26px}
.rcols{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.taigrid.one{grid-template-columns:1fr}
.scores{grid-template-columns:repeat(2,1fr)}

/* ================= v3 ================= */
.status{left:calc(50% - 180px);top:314px;width:360px;text-align:center;font-size:13px;opacity:1;padding:8px 12px;border-radius:14px;z-index:5}
.btn.sm{padding:7px 14px;font-size:14px;letter-spacing:0}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.line{background:linear-gradient(135deg,#3ee07a,#06c755);color:#fff;box-shadow:0 8px 20px rgba(6,199,85,.35)}
.btn.coral{background:linear-gradient(135deg,#ff9a7a,#ff5e62);color:#fff}
.sub{opacity:.75}
.empty{padding:24px;text-align:center;opacity:.6;font-size:14px}
.mt{margin-top:12px}

/* avatar */
.av{display:inline-flex;flex:none;border-radius:50%;padding:2px;vertical-align:middle}

/* club */
.clw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clinfo{display:flex;align-items:center;gap:14px;padding:14px 16px;grid-column:1/3}.clinfo>div:nth-child(2){flex:1}.clinfo h2{margin:0;font-size:22px}.clinfo small{opacity:.65}
.clb{width:56px;height:56px;border-radius:18px;background:linear-gradient(180deg,#7c2a26,#4e1714);display:flex;align-items:center;justify-content:center;font-size:30px}
.pool{padding:14px 16px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(135deg,rgba(255,200,87,.28),rgba(255,122,89,.18))!important}
.pool small{opacity:.8}.pool b{font-size:38px;color:var(--gold)}.pool span{font-size:12px;opacity:.75}
.clnote{padding:12px 16px}.clnote h4{margin-top:0}.clnote p{margin:0;font-size:14px;line-height:1.6}
.clgo{grid-column:1/3;display:flex;align-items:center;gap:14px}.clgo small{opacity:.7;flex:1}
/* modals */
.modal .panel.tall{max-height:510px}
.modal .panel.emop{width:520px}
.signg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.sd{position:relative;border-radius:16px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:120px}
.sd small{font-size:12px;opacity:.75}.sd .rw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}.sd .rw svg{width:30px;height:30px}.sd .rw span{display:flex;align-items:center;gap:2px}.sd .rw span svg{width:18px;height:18px}
.sd.now{border-color:var(--gold);background:rgba(255,200,87,.15);box-shadow:0 0 18px rgba(255,200,87,.35);animation:pulse 1.8s infinite}
.sd.got{opacity:.55}.sd.got i{position:absolute;inset:auto 0 6px;text-align:center;color:var(--mint);font-style:normal;font-weight:900;font-size:18px}
.sd.d7{background:linear-gradient(160deg,rgba(255,122,89,.25),rgba(255,77,109,.15))}
.mlist{max-height:350px;overflow:auto;padding-right:4px}
.mi{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:6px}
.mn{flex:1;font-size:14px;font-weight:700}.mn small{font-size:11px;opacity:.6;font-weight:500}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);margin:5px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8c6a2e,#e6cf8e)}
.mr{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;min-width:90px}.mr svg{width:18px;height:18px}
.mailw{display:grid;grid-template-columns:230px 1fr;gap:12px;margin-top:10px;height:330px}
.ml{overflow:auto;display:flex;flex-direction:column;gap:6px}.ml button{position:relative;text-align:left;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--cream)}
.ml button.on{background:rgba(201,164,90,.18)}.ml b{display:block;font-size:13px}.ml small{font-size:11px;opacity:.6}.ml em{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:#ff4d5e}
.md{padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);overflow:auto}.md h3{margin:0 0 4px}.md small{opacity:.6;font-size:12px}.md p{line-height:1.7;font-size:14px}
.att{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,200,87,.12);font-weight:800}.att svg{width:22px;height:22px}.att .btn{margin-left:auto}
.news>div{padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.06);margin-top:8px}.news b{display:block}.news small{opacity:.55;font-size:11px}.news p{margin:4px 0 0;font-size:13.5px;line-height:1.6;opacity:.9}
.giftbox{display:flex;justify-content:center;gap:24px;margin:18px 0}.giftbox div{width:150px;padding:16px;border-radius:20px;background:rgba(255,200,87,.12);display:flex;flex-direction:column;align-items:center;gap:4px}
.giftbox svg{width:56px;height:56px}.giftbox b{font-size:26px;color:var(--gold)}.giftbox span{font-size:13px;opacity:.75}
.tut{height:110px;display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0}.tut .cbtn{animation:none}
.tai-demo{font-size:16px;line-height:1.8;padding:8px 18px;border-radius:14px;background:rgba(255,255,255,.07)}.tai-demo b{color:var(--gold)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.on{background:var(--mint);width:22px;border-radius:99px}
.charw{display:grid;grid-template-columns:260px 1fr;gap:16px;max-width:880px;margin:0 auto}
.cpv{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}.cpv h4,.cpick h4{margin:0 0 8px;align-self:flex-start}
.cpick{padding:16px 20px}
.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.avb{background:none;border-radius:50%;padding:3px;border:2.5px solid transparent}.avb.on{border-color:var(--mint);box-shadow:0 0 14px rgba(201,164,90,.6)}
.avb .av{width:100%!important;height:auto!important;aspect-ratio:1}
.upl{cursor:pointer}
.err{color:#ff9b8a;font-size:13px;min-height:18px;margin-top:6px}
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.menu button{padding:16px 6px;border-radius:18px;background:rgba(255,255,255,.08);color:var(--cream);font-size:30px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.12)}
.menu b{font-size:14px}
.emog{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.emog button{font-size:30px;padding:8px;border-radius:14px;background:rgba(255,255,255,.07)}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:6px}.phr button{padding:9px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--cream);font-size:14px}
.pinfo{display:flex;align-items:center;gap:16px}.pinfo h2{margin:0}
.besth{padding:12px 14px;border-radius:14px;background:rgba(255,200,87,.12);display:flex;flex-direction:column;gap:2px}.besth b{font-size:28px;color:var(--gold)}.besth small{opacity:.75}
.jp{margin-top:8px;font-weight:800;color:var(--gold)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:90;padding:10px 20px;border-radius:999px!important;font-size:15px;font-weight:700;white-space:nowrap;animation:tin .3s cubic-bezier(.2,1.5,.5,1);transition:opacity .4s,transform .4s;background:linear-gradient(160deg,rgba(20,50,54,.95),rgba(10,28,32,.95))!important}
.toast.out{opacity:0;transform:translate(-50%,-12px)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}}
/* table v3 */
.seatchip{cursor:pointer;z-index:4}
.seatchip .rl{opacity:.55;font-size:11px}
.tgt{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:7px;background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;font-weight:900;font-size:11px}.tgt.au{background:linear-gradient(135deg,#a9b4ff,#6c7bff);color:#fff}
.bubble{position:absolute;z-index:30;padding:6px 12px;border-radius:16px;background:#fff;color:#123;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:cin .35s cubic-bezier(.2,1.6,.5,1)}
.bubble.b0{left:20px;bottom:56px}.bubble.b2{left:110%;top:4px}.bubble.b3{left:20px;top:52px}.bubble.b1{right:20px;top:52px}
.pillnote{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px!important;font-size:14px}
.claimbar .btn{padding:10px 20px;font-size:16px}.claimbar .btn.sm{padding:8px 14px;font-size:14px}
.cbtn.ting2{background:radial-gradient(circle at 35% 30%,#fff3a8,#ffcf3d 55%,#e8a000);color:#5a3a00;text-shadow:none;font-size:22px}
.cbtn.ting2.on{background:radial-gradient(circle at 35% 30%,#d0d8dc,#8899a0 60%,#5d6d73);color:#fff;font-size:20px}
.hand .t.dim{filter:brightness(.55) saturate(.6)}
.wall{display:flex;gap:1px;z-index:1;pointer-events:none}
.w-b,.w-t{left:calc(50% - 160px);width:320px}
.w-t{top:46px}.w-b{top:436px}
.w-l,.w-r{flex-direction:column;top:96px;height:300px}
.w-l{left:138px}.w-r{right:138px}
.ws{display:block;flex:none;border-radius:3px;background:linear-gradient(160deg,var(--bk1),var(--bk3))}
.w-b .ws,.w-t .ws{width:16.6px;height:10px}
.w-l .ws,.w-r .ws{width:11px;height:15.6px}
.ws.c2{box-shadow:0 2px 0 #f4ecd2,0 3px 0 var(--bk4),0 5px 0 #e3d7b4,0 6px 3px rgba(0,0,0,.35);transform:translateY(-3px)}
.ws.c1{box-shadow:0 2px 0 #f4ecd2,0 3px 2px rgba(0,0,0,.3)}
.ws.c0{background:none;box-shadow:none}
.ws.rsv{filter:brightness(.55) saturate(.7)}
#game.two .r0,#game.two .r2{left:calc(50% - 260px);width:520px}
#game.two .r0{top:310px}
#game[data-kind=replay] .backs-top,#game[data-kind=replay] .backs-side{z-index:2}
.ti{width:58px;white-space:nowrap}
.card.sm2 .emo{font-size:24px;top:12px}
.card.mid p,.card.sm2 p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{white-space:nowrap}
.w-l,.w-r{top:92px;height:270px}.w-l .ws,.w-r .ws{height:14px}
/* ================= v4「鬧熱牌局」風格：經典牌館（墨綠絨布・深色木紋・象牙白字・低彩度金） ================= */
:root{--ink:#f1e6cf;--paper:#2a1b11;--gold:#c9a45a;--gold2:#e8d39a;--gold3:#8c6a2e;--wood1:#4b2f1c;--wood2:#33200f;--wood3:#1e130a;
  --cream:#f1e6cf;--mint:#8fc9a0;--coral:#d4625a;--line:rgba(201,164,90,.55);--line2:rgba(201,164,90,.28);
  --serif:'Noto Serif TC','Noto Serif CJK TC','Songti TC','STSong','PMingLiU',serif;
  --ui:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',system-ui,sans-serif;
  --woodbg:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px,rgba(0,0,0,.05) 9px 11px,transparent 11px 23px),linear-gradient(180deg,#45291a,#2c1a0e)}
html,body{background:#1a110a;color:var(--cream)}
#bg{background:
  radial-gradient(ellipse 70% 60% at 50% 40%,rgba(255,220,160,.07),transparent 70%),
  repeating-linear-gradient(91deg,rgba(255,255,255,.018) 0 2px,transparent 2px 11px,rgba(0,0,0,.06) 11px 13px,transparent 13px 29px),
  linear-gradient(180deg,#3a2315 0%,#24160c 60%,#170e07 100%)}
#bg::after{background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55));background-size:auto;mask-image:none}
h1,h2,.hdr h1,.panel h2{font-family:var(--serif);letter-spacing:2px}
.glass{background:linear-gradient(180deg,rgba(64,40,24,.94),rgba(36,22,12,.96));backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,230,180,.08)}
.btn{border-radius:10px;letter-spacing:1px;text-shadow:none;border:1px solid transparent}
.btn:active,.chip:active,.icon:active{transform:translateY(1px);filter:brightness(.92)}
.btn.primary{background:linear-gradient(180deg,#efd99c 0%,#d2ad5f 48%,#b38b3f 52%,#9c7633 100%);color:#2a1a0b;border-color:#7a5a24;
  box-shadow:0 3px 0 #5e4219,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,250,225,.75);text-shadow:0 1px 0 rgba(255,240,200,.5)}
.btn.ghost{background:linear-gradient(180deg,#4a2f1d,#2e1c10);border:1px solid var(--line);color:var(--cream);backdrop-filter:none;box-shadow:0 3px 0 #170d06,0 5px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,230,180,.1)}
.btn.mint{background:linear-gradient(180deg,#3f8a5e 0%,#2b6c47 50%,#1f5537 100%);color:#f4ecd8;border:1px solid #6fa883;box-shadow:0 3px 0 #0f2e1c,0 6px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.line{background:linear-gradient(180deg,#3e9a55,#2a7a3f)!important;color:#fff!important;border:1px solid #6fbf83!important;box-shadow:0 3px 0 #164a24!important}
.btn[disabled]{opacity:.45;filter:grayscale(.5)}
.icon{border:1px solid var(--line);background:linear-gradient(180deg,#4a2f1d,#24160c);color:var(--gold2);box-shadow:0 3px 8px rgba(0,0,0,.4);border-radius:50%}
.chip{background:rgba(20,12,6,.55);border:1px solid var(--line2);color:var(--cream);border-radius:8px}
.chip.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;border-color:#7a5a24;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sub{opacity:.78}
.pos,.num.pos,.sc.pos,.dl.pos,b.pos,.seatchip .sc.pos{color:#9fd39a!important}.neg,.num.neg,.sc.neg,.dl.neg,b.neg,.seatchip .sc.neg{color:#ec8a7c!important}
.modal{background:rgba(8,5,2,.66)}
.panel{background:var(--woodbg)!important;border:1px solid var(--gold)!important;box-shadow:0 0 0 4px rgba(30,19,10,.95),0 0 0 5px var(--line),0 18px 40px rgba(0,0,0,.6)!important;border-radius:12px!important;color:var(--cream)}
.panel h2.grad,h2.grad{background:linear-gradient(180deg,#f4e2ac,#c9a45a 60%,#9c7633);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding:0 2px}
.panel h4{opacity:.9;color:var(--gold2)}
.toast{background:linear-gradient(180deg,#3a2414,#1f130a)!important;color:var(--cream);border:1px solid var(--gold)!important;box-shadow:0 8px 20px rgba(0,0,0,.5)!important}
.tabs{background:rgba(16,10,5,.6);border:1px solid var(--line2);border-radius:10px}
.tabs button{color:var(--cream);opacity:.8;border-radius:8px}.tabs button.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;opacity:1}
.inp{background:rgba(12,8,4,.7)!important;border:1px solid var(--line)!important;color:var(--cream)!important;border-radius:8px!important}
.inp::placeholder{color:rgba(241,230,207,.4)}
.ttl{color:var(--gold2)}
/* 頂欄／底欄 */
.profile,.coins{color:var(--cream);border-radius:999px}
.coins .plus{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b}
.coins.rcard{padding-right:14px}
.ti{color:var(--cream);font-weight:600}
.ti svg{background:linear-gradient(180deg,#4a2f1d,#24160c);border:1px solid var(--line);color:var(--gold2);border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.ti em{background:#c8372d;box-shadow:0 0 0 2px #24160c}
.bnav{background:linear-gradient(180deg,rgba(58,36,20,.97),rgba(26,16,8,.98))!important;border:1px solid var(--line)!important;border-radius:12px!important}
.bnav button{color:var(--cream);opacity:.78;border-radius:8px}.bnav button.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;opacity:1}
.hdr h1{color:var(--gold2)}
.av{padding:2px}
.av.ring{background:linear-gradient(160deg,#f1dc9c,#b48c40 50%,#7a5a24);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.avb.on{border-color:var(--gold);box-shadow:0 0 10px rgba(201,164,90,.6)}
/* 標誌 */
.logo .wm{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--gold);filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));display:block;line-height:0}
.logo .wm .lsvg{display:block}
.logo .tag{font-family:var(--serif);font-weight:600;letter-spacing:4px;font-size:15px;color:var(--gold2);opacity:.9;margin-top:14px;padding-top:10px;border-top:1px solid var(--line2);display:inline-block}
.logo.sm .tag{font-size:13px}
#login .logo{position:absolute;left:44px;top:80px}
#login .fan{left:60px;top:300px}
#login .fan .t,#login .fan .pc,#login .fan .aqp{animation:float 4s ease-in-out infinite}
.loginp{color:var(--cream)}
.agree a{color:var(--gold2)!important}
/* 首頁大廳 */
.hhead{position:absolute;left:24px;top:74px;right:24px;display:flex;align-items:center;gap:14px}
.hwm{line-height:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.hpill{font-family:var(--serif);font-weight:600;font-size:14px;padding:4px 14px;color:var(--gold2);border-left:1px solid var(--line);letter-spacing:2px}
.hpill.gift{margin-left:auto;border:1px solid var(--gold);border-radius:999px;background:linear-gradient(180deg,#7c2a22,#541a14);color:#f6e3b0;font-family:var(--ui)}
.games{position:absolute;left:24px;right:24px;top:124px;height:228px;display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1fr;gap:14px}
.gcard{position:relative;border:1px solid var(--gold);border-radius:12px;text-align:left;padding:14px;overflow:hidden;color:var(--cream);transition:transform .14s,box-shadow .14s;
  box-shadow:0 0 0 3px #1e130a,0 0 0 4px var(--line2),0 10px 22px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.35)}
.gcard:active{transform:translateY(2px)}
@media (hover:hover){.gcard:hover{transform:translateY(-3px);box-shadow:0 0 0 3px #1e130a,0 0 0 4px var(--gold),0 14px 26px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.35)}}
.c-mint{background:radial-gradient(ellipse at 50% 30%,#2f7d55,#1a5236 70%,#103a25)}
.c-lemon{background:radial-gradient(ellipse at 50% 30%,#7a2f36,#561e25 70%,#3a1218)}
.c-lilac{background:radial-gradient(ellipse at 50% 30%,#2c5470,#1c3a52 70%,#112638)}
.c-coral{background:radial-gradient(ellipse at 50% 30%,#2f6a62,#1d4a44 70%,#11302b)}
.c-sky{background:radial-gradient(ellipse at 50% 30%,#6a5236,#4a3822 70%,#302312)}
.gcard::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.18) .7px,transparent .8px) 0 0/4px 4px;pointer-events:none}
.gcard::after{content:"";position:absolute;left:10px;right:10px;bottom:46px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.gart{position:absolute;left:14px;top:14px;width:120px;height:80px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.gart .t,.gart .pc,.gart .aqp{position:absolute}
.gglyph{position:absolute;right:-6px;top:70px;font-family:var(--serif);font-size:80px;font-weight:900;color:var(--gold);opacity:.12;line-height:1;letter-spacing:-6px}
.gcard h2{position:absolute;left:14px;bottom:54px;margin:0;font-family:var(--serif);font-size:27px;font-weight:900;letter-spacing:2px;color:#f6e7bf;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.gcard p{position:absolute;left:14px;right:12px;bottom:28px;margin:0;font-size:12px;font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gn{position:absolute;left:14px;bottom:8px;font-size:11px;font-weight:700;color:var(--gold2);border:1px solid var(--line);border-radius:4px;padding:0 7px;background:rgba(0,0,0,.3)}
.gcard .gplay{position:absolute;right:12px;bottom:10px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#efd99c,#b38b3f);color:#2a1a0b;border:1px solid #7a5a24;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,250,225,.7)}
.hrow2{position:absolute;left:24px;right:24px;top:370px;display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr 1fr;gap:12px}
.hbtn{height:62px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#4a2f1d,#2a190d);color:var(--cream);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px;
  box-shadow:0 4px 0 #150c05,0 8px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,230,180,.1)}
.hbtn b{font-size:17px;font-family:var(--serif);color:#f6e7bf}.hbtn small{font-size:11px;opacity:.7}
.hbtn:active{transform:translateY(2px)}
/* 遊戲入口 */
.hubw{display:grid;grid-template-columns:330px 1fr;gap:20px;height:100%}
.hubart{position:relative;border:1px solid var(--gold);border-radius:12px;box-shadow:0 0 0 3px #1e130a,0 0 0 4px var(--line2),0 12px 26px rgba(0,0,0,.55),inset 0 0 50px rgba(0,0,0,.4);overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:400px}
.hubart .gart.big{transform:scale(1.6);transform-origin:left top;left:24px;top:24px}

/* ================= v4.3 台灣麻將 App 風格牌桌：寶藍平面桌布・小牌・圓形頭像・圓形亮面按鈕 =================
   全部為原創 CSS／SVG 繪製；版面依台灣麻將 App 常見配置（底部一排 16 張、四家牌河圍繞小羅盤、左上圈風、右上選單） */
#game{--cy:240px;--rin:72px}
#game .felt{inset:0;border:0;border-radius:0;box-shadow:none;
  background:
    radial-gradient(circle at 0 0,rgba(255,255,255,.07) 0 60px,transparent 61px),
    radial-gradient(circle at 100% 100%,rgba(255,255,255,.06) 0 70px,transparent 71px),
    radial-gradient(rgba(255,255,255,.035) .7px,transparent .8px) 0 0/4px 4px,
    radial-gradient(ellipse 75% 70% at 50% 45%,var(--f1) 0%,var(--f2) 55%,var(--f3) 85%,var(--f4) 100%)}
#game .felt::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:none;width:auto;height:auto;transform:none;left:10px;top:10px}
#game .felt::after{display:none}
/* --- 牌：薄邊、象牙白牌面、藍色牌背 --- */
#game .t{box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(160,145,110,.35),0 1px 0 #cdd2da,0 2px 0 var(--bk2),0 3px 0 var(--bk4),0 4px 4px rgba(0,0,0,.35);
  margin-bottom:4px;border-radius:calc(var(--w)*.1)}
#game .t.back{background:linear-gradient(180deg,var(--bk1),var(--bk2) 70%,var(--bk3));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 var(--bk4),0 2px 0 #e9e1c8,0 3px 3px rgba(0,0,0,.35)}
#game .t::before{bottom:-2px!important}
/* --- 左上圈風、右上選單 --- */
#game .rinfo{left:12px;top:6px;z-index:3;display:flex;flex-direction:column;gap:1px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#game .rinfo b{font-family:var(--serif);font-size:19px;color:#ffe48a;letter-spacing:2px;line-height:1.1}
#game .rinfo .rd{font-size:11px;opacity:.9}
#game .rinfo .tags{display:flex;gap:3px;margin-top:2px}
#game .rinfo .tags span{font-size:10px;padding:0 5px;border-radius:5px;background:rgba(0,20,60,.35);border:1px solid rgba(255,255,255,.2);white-space:nowrap}
#game .rinfo .tags .lz{background:#c0392b;border-color:#ffd27a}
#game .tbtn{top:8px;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.85);color:#fff;
  background:radial-gradient(circle at 40% 30%,#8f8cf0,#4b49c4 60%,#2c2a86);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4)}
#game #gMenu{left:auto!important;right:12px}
#game #gEmo{right:60px!important;background:radial-gradient(circle at 40% 30%,#6fc5e8,#2a8fc0 60%,#1a5f86)}
/* --- 座位：圓形頭像＋名字＋分數 --- */
.mjseat{position:absolute;z-index:4;width:84px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mjseat .ava{position:relative;width:54px;height:54px}
.mjseat .av{width:54px!important;height:54px!important;padding:2px;background:linear-gradient(160deg,#fff2b8,#e0b04a 50%,#9c6d1c);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.mjseat.active .av{box-shadow:0 0 0 3px #ffe27a,0 0 16px 4px rgba(255,226,122,.85)}
.mjseat .wd{position:absolute;left:-6px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d2f62;border:1.5px solid #ffe08a;color:#ffe08a;font:700 11px/17px var(--serif);text-align:center}
.mjseat .zb,.mjseat .tb,.mjseat .ab,.mjseat .lb{position:absolute;right:-8px;width:20px;height:20px;border-radius:5px;font:900 12px/18px var(--serif);text-align:center;color:#fff;border:1px solid #ffe08a}
.mjseat .zb{top:-2px;background:linear-gradient(180deg,#e04a3a,#a8231a)}
.mjseat .tb{top:20px;background:linear-gradient(180deg,#26b3a2,#11796c)}
.mjseat .ab{top:20px;right:auto;left:-8px;bottom:auto;background:linear-gradient(180deg,#7f8cff,#4b55c8)}
.mjseat .lb{top:-2px;right:auto;left:-10px;width:auto;padding:0 3px;font-size:10px;background:#a8231a}
.mjseat .nm{margin-top:3px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.mjseat .nm small{font-size:10px;opacity:.75;margin-left:3px}
.mjseat .scp{margin-top:1px;min-width:64px;text-align:center;font-size:12px;font-weight:800;color:#ffe48a;background:rgba(5,20,50,.6);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 8px;line-height:18px}
.mjseat .scp.pos{color:#9cf0a8!important}.mjseat .scp.neg{color:#ffb0a0!important}
.mjseat .sflw{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin-top:3px;width:84px}
.mjseat .sflw .t{margin-bottom:3px}
.mjseat .bubble.b0{left:70px;bottom:auto;top:0}.mjseat .bubble.b3{left:74px;top:4px}.mjseat .bubble.b1{right:74px;left:auto;top:4px}.mjseat .bubble.b2{left:auto;right:90px;top:6px}
/* --- 對手：上家／下家直立牌（藍背）＋橫放明牌；對家一排牌背 --- */
#game .backs-top{left:50%;top:6px;transform:translateX(-50%);gap:1px;z-index:2}
#game .backs-top .t.back{margin-bottom:3px}
#game .backs-side{top:66px;width:28px;z-index:2}
#game .b-l{left:126px}#game .b-r{right:126px}

#game .b-l .sideb{background:linear-gradient(90deg,#fffdf4,#e9e1c8 22%,var(--bk4) 22%,var(--bk4) 27%,var(--bk1) 30%,var(--bk2) 100%)}
#game .b-r .sideb{background:linear-gradient(270deg,#fffdf4,#e9e1c8 22%,var(--bk4) 22%,var(--bk4) 27%,var(--bk1) 30%,var(--bk2) 100%)}
#game .backs-side.reveal{grid-template-columns:repeat(2,17px);width:36px}
#game .melds{gap:4px}
#game .m-top{left:auto;right:calc(50% + 172px);top:6px;width:auto;max-width:calc(50% - 300px);justify-content:flex-end;flex-direction:row-reverse}
#game .m-l,#game .m-r{top:62px;width:30px;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:3px}
#game .m-l{left:90px}#game .m-r{right:90px;left:auto}
#game .m-l .meld,#game .m-r .meld{display:flex;flex-direction:column;align-items:center;padding:0;gap:0}
#game .m-l .meld .t,#game .m-r .meld .t{margin:-3px 0 -3px;transform:rotate(90deg)}
#game .m-r .meld .t{transform:rotate(-90deg)}
#game .meld{background:none;box-shadow:none;padding:0;gap:0}
/* --- 中央羅盤（綠松色）＋短牌牆 --- */
#game .plate{left:calc(50% - 37px);top:calc(var(--cy) - 37px);width:74px;height:74px;border-radius:12px;padding:0;
  background:radial-gradient(circle at 40% 30%,#3fd0b6,#13998a 60%,#0b6f66);border:2px solid #b8fff0;box-shadow:0 0 0 2px #0a4f49,0 4px 10px rgba(0,0,0,.4)}
#game .plate .core{width:38px;height:38px;border-radius:7px;background:#0b2a2c;border:1px solid #66e0cc;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#game .plate .left{font:800 17px/1 Georgia,var(--ui);background:none;-webkit-text-fill-color:#ffe48a;color:#ffe48a}
#game .plate .core small{font-size:8px;color:#bff;opacity:.85;margin-top:1px}
#game .plate .w{width:auto;height:auto;background:none;border:0;border-radius:0;color:rgba(230,255,250,.75);font:800 12px/1 var(--serif);box-shadow:none}
#game .plate .w.on{background:none;color:#ffe27a;text-shadow:0 0 6px #fff38a;box-shadow:none}
#game .plate .w0{bottom:3px;left:50%;top:auto;transform:translateX(-50%)}#game .plate .w2{top:3px;left:50%;transform:translateX(-50%) rotate(180deg)}
#game .plate .w3{left:3px;top:50%;transform:translateY(-50%) rotate(90deg)}#game .plate .w1{right:3px;left:auto;top:50%;transform:translateY(-50%) rotate(-90deg)}
#game .wall{gap:1px}
#game .w-t,#game .w-b{left:calc(50% - 64px);width:128px;height:11px}
#game .w-t{top:calc(var(--cy) - 64px)}#game .w-b{top:calc(var(--cy) + 53px)}
#game .w-l,#game .w-r{top:calc(var(--cy) - 52px);height:104px;width:11px}
#game .w-l{left:calc(50% - 64px)}#game .w-r{right:auto;left:calc(50% + 53px)}
#game .ws{flex:1 1 0;width:auto!important;height:auto!important;border-radius:1.5px;transform:none;background:linear-gradient(180deg,#5d95e0,var(--bk1) 50%,var(--bk2))}
#game .ws.c2{box-shadow:inset 0 0 0 .5px rgba(0,0,30,.5),0 1.5px 0 #f2ebd6,0 2px 1px rgba(0,0,0,.4)}
#game .ws.c1{opacity:.6;box-shadow:inset 0 0 0 .5px rgba(0,0,30,.5)}
#game .ws.c0{background:none;box-shadow:none}
#game .ws.rsv{filter:brightness(.6) saturate(.6)}
/* --- 牌河：四家各自朝向自己，整齊排列在羅盤四周 --- */
#game .river{gap:1px;align-content:flex-start;z-index:1}
#game .r0,#game .r2{left:calc(50% - 116px);width:232px;height:128px}
#game .r0{top:calc(var(--cy) + var(--rin))}
#game .r2{top:calc(var(--cy) - var(--rin) - 128px);flex-wrap:wrap-reverse}
#game .r3,#game .r1{width:145px;height:170px;top:calc(var(--cy) - 85px)}
#game .r3{left:calc(50% - var(--rin) - 85px - 72.5px);transform:rotate(90deg)}
#game .r1{left:calc(50% + var(--rin) + 85px - 72.5px);right:auto;transform:rotate(-90deg)}
#game.two .r0,#game.two .r2{left:calc(50% - 174px);width:348px}
#game.two .r0{top:calc(var(--cy) + var(--rin))}
#game .river .t.last{box-shadow:inset 0 1px 0 #fff,0 1px 0 #cdd2da,0 2px 0 var(--bk2),0 3px 0 var(--bk4),0 4px 4px rgba(0,0,0,.35)}
#game .river .t.last::before{left:-2px;right:-2px;top:-2px;bottom:-5px!important;border-radius:4px;box-shadow:0 0 0 2px #ff5a3c,0 0 10px rgba(255,90,60,.85)}
/* --- 自己的手牌：一排，牌頂露出藍色牌背 --- */
#game .hand{left:96px;right:8px;top:430px;height:104px;gap:2px;align-items:flex-end}
#game .hand .t.h,#game .hand .meld .t{box-shadow:inset 0 2px 0 #fff,inset 0 -1px 0 rgba(160,145,110,.4),0 calc(var(--w)*-.11) 0 var(--bk1),0 calc(var(--w)*-.13) 0 var(--bk3),0 1px 0 #c9ced6,0 3px 5px rgba(0,0,0,.4);margin-bottom:6px}
#game .hand .meld{margin-right:2px}
#game .hand .meld .t{margin-bottom:6px}
#game .hand .t.sel,#game .hand .t.sel:hover{transform:translateY(-14px)}
#game .hand .t.sel::before,#game .hand .t.win::before{content:"";position:absolute;left:-2px;right:-2px;top:calc(var(--w)*-.13 - 2px);bottom:-2px!important;border-radius:5px;box-shadow:0 0 0 2.5px #ffe27a,0 0 14px rgba(255,226,122,.9);pointer-events:none}
#game .hand .gap{width:12px}
#game .hand .t .tp{top:calc(var(--w)*-.13 - 17px);width:16px;height:13px;padding:0;background:none;border:0;box-shadow:none;animation:tpb 1s ease-in-out infinite}
#game .hand .t .tp svg{width:16px;height:13px;display:block;fill:#ffd23a;stroke:#9a5a00;stroke-width:1.2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
#game .hand .t.sel .tp{top:calc(var(--w)*-.13 - 17px)}
@keyframes tpb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}
#game .ting{left:100px;top:auto;bottom:118px;z-index:5;background:rgba(5,22,55,.8)!important;border:1px solid rgba(255,255,255,.25)!important;border-radius:10px!important;color:#fff;padding:3px 8px;font-size:12px}
#game .ting .w{color:#ffe48a}
#game .autotog{right:10px;top:404px;z-index:6;height:24px;padding:0 12px;border-radius:999px;font:700 12px/22px var(--ui);color:#fff;border:1.5px solid #c8fff4;
  background:linear-gradient(180deg,#38c9b4,#14897b);box-shadow:0 2px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
#game .autotog.on{background:linear-gradient(180deg,#8d97ff,#4b55c8);border-color:#dfe2ff}
/* --- 動作：圓形亮面按鈕 --- */
#game .claimbar{right:132px;top:auto;bottom:118px;gap:12px;z-index:6;align-items:flex-end}
#game .cbtn{width:62px;height:62px;border-radius:50%;font:900 30px/1 var(--serif);color:#fff;border:2px solid rgba(255,255,255,.9);position:relative;overflow:hidden;
  text-shadow:-1.5px -1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px 1.5px 0 var(--ol),0 3px 4px rgba(0,0,0,.4);
  box-shadow:0 0 0 2px rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.45),inset 0 -6px 10px rgba(0,0,0,.18)!important;animation:cbp 1.4s ease-in-out infinite}
#game .cbtn::after{content:"";position:absolute;left:14%;right:14%;top:5%;height:38%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
#game .cbtn>*{position:relative;z-index:1}
#game .cbtn.hu,#game .cbtn.zm{--ol:#8a3a00;background:radial-gradient(circle at 50% 35%,#ffe680,#ffb21f 55%,#e07800)!important}
#game .cbtn.zm{font-size:23px}
#game .cbtn.ting2{--ol:#7a3300;background:radial-gradient(circle at 50% 35%,#ffd59a,#f59a3c 55%,#c9610f)!important;color:#fff}
#game .cbtn.ting2.on,#game .cbtn.pass{--ol:#05463f;background:radial-gradient(circle at 50% 35%,#7fe8d6,#1fae9b 55%,#0b766a)!important;font-size:26px}

#game .cbtn.chi{--ol:#174d0d;background:radial-gradient(circle at 50% 35%,#b6f08a,#55b62c 55%,#2e7c14)!important}
#game .cbtn.pon{--ol:#7a0f1c;background:radial-gradient(circle at 50% 35%,#ffa4a0,#e64a4a 55%,#a81f2a)!important}
#game .cbtn.kan{--ol:#3c1670;background:radial-gradient(circle at 50% 35%,#d8b4ff,#9b5ce6 55%,#6630b0)!important}
#game .cbtn.wide{width:auto;height:58px;border-radius:30px;padding:4px 12px 4px 10px;gap:4px;font-size:22px}
#game .cbtn.wide .t{margin-bottom:3px}
@keyframes cbp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#game .claimbar .pillnote{font-size:12px;padding:5px 12px;background:rgba(5,22,55,.78)!important;border:1px solid rgba(255,255,255,.25)!important;color:#fff;border-radius:999px!important}

#game .status{top:calc(var(--cy) + 50px)}

.hver{margin-left:8px;font-size:11px;padding:1px 7px;border-radius:6px;background:rgba(0,0,0,.3);border:1px solid var(--line2);color:var(--gold2);align-self:center}

/* ================= v5.1「鬥雀感」全站改版（原創 CSS 重繪，無任何外部素材）
   深炭灰金屬面板＋金邊、紅金緞帶標題、苔綠絨布牌桌、槍鐵色中控台、方形金屬框頭像 ================= */
:root{--gold:#e2b44a;--gold2:#f6d77e;--gold3:#9a6c1c;--cream:#f3ead6;--line:rgba(226,180,74,.6);--line2:rgba(226,180,74,.28);
  --dqred1:#d8352a;--dqred2:#9e1a14;--dqred3:#5e0c09;--metal1:#3a3f47;--metal2:#23272d;--metal3:#121418;
  --woodbg:linear-gradient(180deg,#2b2f36 0%,#1c1f24 60%,#141619 100%)}
html,body{background:#0e0f12}
#bg{background:
  radial-gradient(ellipse 60% 50% at 50% 38%,rgba(255,190,90,.10),transparent 70%),
  radial-gradient(ellipse 120% 80% at 50% 120%,rgba(160,20,14,.35),transparent 60%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),
  linear-gradient(180deg,#24272d 0%,#17191d 55%,#0d0e11 100%)!important}
/* 面板：深炭金屬＋雙層金邊 */
.glass{background:linear-gradient(180deg,rgba(48,52,60,.97),rgba(24,26,31,.98))!important;border:1px solid var(--line)!important;
  box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.4)!important}
.panel{background:linear-gradient(180deg,#2c3037,#1a1c21)!important;border:2px solid var(--gold)!important;
  box-shadow:0 0 0 3px #0c0d10,0 0 0 4px rgba(226,180,74,.45),0 20px 44px rgba(0,0,0,.7)!important;border-radius:10px!important}
.panel h2{background:linear-gradient(180deg,var(--dqred1),var(--dqred2));color:#fff3cf!important;margin:-4px -4px 10px!important;padding:6px 14px;border-radius:6px;
  border:1px solid #f0c45c;box-shadow:inset 0 1px 0 rgba(255,220,160,.5),0 3px 0 var(--dqred3);text-shadow:0 2px 0 rgba(80,0,0,.7);font-weight:900}
.modal{background:rgba(4,4,6,.72)}
.modal .panel .foot{background:linear-gradient(180deg,rgba(26,28,33,0),rgba(26,28,33,.97) 30%)}
.toast{background:linear-gradient(180deg,#34383f,#1b1d22)!important;border:1px solid var(--gold)!important}
/* 按鈕：紅金主按鈕、金屬次按鈕、翠綠確認 */
.btn{border-radius:8px;font-weight:900}
.btn.primary{background:linear-gradient(180deg,#ff6a4d 0%,var(--dqred1) 45%,var(--dqred2) 100%)!important;color:#fff6dc!important;border:1px solid #f3c55a!important;
  box-shadow:0 3px 0 var(--dqred3),0 6px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,220,180,.6)!important;text-shadow:0 1px 0 rgba(90,0,0,.8)!important}
.btn.ghost{background:linear-gradient(180deg,var(--metal1),var(--metal2))!important;border:1px solid rgba(226,180,74,.45)!important;color:var(--cream)!important;
  box-shadow:0 3px 0 #08090b,0 5px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)!important}
.btn.mint{background:linear-gradient(180deg,#6cc04a 0%,#3f8f2a 50%,#2a6a1a 100%)!important;border:1px solid #b9ec8a!important;color:#fff!important;
  box-shadow:0 3px 0 #173f0e,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)!important;text-shadow:0 1px 0 rgba(0,50,0,.6)}
.icon,.ti svg{background:linear-gradient(180deg,#454b55,#1d2025)!important;border:1px solid rgba(226,180,74,.55)!important;color:var(--gold2)!important}
.ti em{box-shadow:0 0 0 2px #1d2025}
.chip{background:rgba(10,11,14,.6)!important;border-color:rgba(226,180,74,.3)!important}
.chip.on{background:linear-gradient(180deg,#ffdc7a,#d39a2a)!important;color:#3a1a00!important;border-color:#8a5a10!important}
.tabs{background:rgba(10,11,14,.6)!important}
.inp{background:rgba(8,9,12,.75)!important}
.pillnote,.seatchip,.cmsg,.sszp{background:linear-gradient(180deg,rgba(46,50,58,.95),rgba(22,24,29,.96))!important}
/* 頂欄：頭像方框＋金幣/鑽石膠囊 */
.topbar .coins,.topbar .glass{border-radius:6px!important;background:linear-gradient(180deg,rgba(14,15,18,.9),rgba(34,37,43,.9))!important;border:1px solid rgba(226,180,74,.5)!important;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.6)!important}
.profile .av,.topbar .av{border-radius:8px!important;box-shadow:0 0 0 2px #0c0d10,0 0 0 3px var(--gold)!important}
.hdr h1{color:#fff0c2!important;text-shadow:0 2px 0 #6a0e08,0 0 12px rgba(255,140,60,.45)}
/* 首頁模式卡：金框立牌＋底部紅緞帶 */
.gcard{border:2px solid #e8b94e!important;border-radius:10px!important;
  box-shadow:0 0 0 2px #0b0c0f,0 0 0 3px rgba(226,180,74,.5),0 10px 22px rgba(0,0,0,.65),inset 0 0 40px rgba(0,0,0,.45)!important}
.gcard .gglyph{z-index:0}
.gcard[data-arg="mj"]{background:radial-gradient(ellipse at 50% 30%,#6f8a43,#4b6530 60%,#2b3c1b)!important}
.gcard[data-arg="mj2"]{background:radial-gradient(ellipse at 50% 30%,#8a6a3a,#5e4524 60%,#33240f)!important}
.gcard[data-arg="lf"]{background:radial-gradient(ellipse at 50% 30%,#a8342a,#6e1a14 60%,#360806)!important}
.gcard[data-arg="he"]{background:radial-gradient(ellipse at 50% 30%,#2f7a46,#1d5530 60%,#0e2c18)!important}
.gcard[data-arg="sl"]{background:radial-gradient(ellipse at 50% 30%,#4a4d55,#2a2c32 60%,#111216)!important}
.gcard[data-arg="ssz"]{background:radial-gradient(ellipse at 50% 30%,#5a6e3a,#3c4c24 60%,#1e2610)!important}
.gcard[data-arg="b2"]{background:radial-gradient(ellipse at 50% 30%,#7a3a8a,#4c2058 60%,#240c2c)!important}
.gcard[data-arg="ddz"]{background:radial-gradient(ellipse at 50% 30%,#c0582a,#82341a 60%,#3e1408)!important}
.gcard[data-arg="aq"]{background:radial-gradient(ellipse at 50% 30%,#8a7448,#5a4a2a 60%,#2a2212)!important}
.gcard .gn{background:linear-gradient(180deg,#e8b94e,#a8761e)!important;color:#2a1400!important;border-color:#6a4410!important}
.gcard h3,.gcard b{text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.5)}
/* 首頁功能列與底部導覽：金屬方鈕 */
.hbtn,.hubb{background:linear-gradient(180deg,#3c4149,#1f2227)!important;border:1px solid rgba(226,180,74,.55)!important;border-radius:8px!important;
  box-shadow:0 3px 0 #08090b,0 8px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)!important}
.hrow2 .hbtn[data-go="ranked"]{background:linear-gradient(180deg,#d8352a,#8e1712)!important;border-color:#f3c55a!important}
.hrow2 .hbtn[data-go="events"]{background:linear-gradient(180deg,#e8902a,#a4520e)!important;border-color:#ffd77a!important}
.bnav{background:linear-gradient(180deg,#2e3239,#15171b)!important;border:1px solid var(--gold)!important;border-radius:8px!important;box-shadow:0 -2px 0 rgba(255,255,255,.05) inset,0 8px 20px rgba(0,0,0,.6)}
.bnav button.on{background:linear-gradient(180deg,#ff6a4d,var(--dqred2))!important;color:#fff6dc!important;box-shadow:inset 0 1px 0 rgba(255,220,180,.5)}
/* 牌桌：苔綠絨布、深色金屬桌框、槍鐵色中控台＋彩色方位燈 */
.felt,.ctable{border-color:#1b1d21!important;box-shadow:0 0 0 3px #4a4f58,0 0 0 5px #0b0c0e,inset 0 0 60px rgba(0,0,0,.55)!important}
#game .felt::before{border:1px solid rgba(0,0,0,.25)!important}
#game .plate{background:linear-gradient(145deg,#5a606a,#2a2e34 45%,#15171a)!important;border:2px solid #7c838e!important;border-radius:10px!important;
  box-shadow:0 0 0 2px #0b0c0e,0 6px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)!important}
#game .plate .core{background:radial-gradient(circle at 50% 40%,#2b3a3c,#0b1112)!important;border:1px solid #4fd2ff!important;box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 0 8px rgba(79,210,255,.45)!important}
#game .plate .left{color:#7fe6ff!important;-webkit-text-fill-color:#7fe6ff!important;text-shadow:0 0 6px rgba(79,210,255,.8)}
#game .plate .w{color:rgba(220,225,232,.55)!important}
#game .plate .w0.on{color:#ffd23a!important;text-shadow:0 0 8px #ffb000!important}#game .plate .w1.on{color:#ff5a5a!important;text-shadow:0 0 8px #ff2020!important}
#game .plate .w2.on{color:#5aff8a!important;text-shadow:0 0 8px #20ff60!important}#game .plate .w3.on{color:#b07aff!important;text-shadow:0 0 8px #8a40ff!important}
.mjseat .av{border-radius:8px!important;padding:3px!important;background:linear-gradient(160deg,#9aa1ab,#454a52 45%,#1a1c20)!important;box-shadow:0 0 0 1px #0b0c0e,0 4px 10px rgba(0,0,0,.6)!important}
.mjseat .av img,.mjseat .av svg,.mjseat .av>*{border-radius:5px}
.mjseat.active .av{box-shadow:0 0 0 2px #ffd23a,0 0 16px 4px rgba(255,190,40,.8)!important}
.mjseat .wd{background:#16181c!important;border-color:#ffd23a!important}
.mjseat .scp{background:rgba(10,11,13,.75)!important;border-color:rgba(226,180,74,.45)!important;border-radius:5px!important}
#game .rinfo b{color:#fff0c2!important;text-shadow:0 2px 0 #5a0a06}
#game .rinfo .tags span{background:rgba(10,11,13,.55)!important}
#cgame[data-game=he] .ctable{--f1:#3d7a3a;--f2:#2f6530;--f3:#224c23;--f4:#143016;border-color:#5a1410!important}
#cgame[data-game=sl] .ctable{--f1:#2c2e33;--f2:#212328;--f3:#17191c;--f4:#0c0d0f}
#cgame[data-game=ssz] .ctable{--f1:#5a6e3a;--f2:#4b5d30;--f3:#3a4a24;--f4:#252f16}
/* 結算：紅金橫幅 */
.result h2,.final h2,.panel .rhead{color:#fff3cf!important}
/* ================= v5.1 中國風（朱漆＋金、玉綠點綴、祥雲、窗櫺、匾額、印章、燈籠）疊加於鬥雀感之上 ================= */
:root{--kai:'Kaiti TC','BiauKai','DFKai-SB','STKaiti','KaiTi','AR PL UKai TW','Noto Serif TC','Songti TC',serif;--lac1:#8e1a12;--lac2:#5c0d08;--lac3:#2a0604;--jade:#2f9a6e;--jade2:#1b6b4a;--ink:#1c1410;
  --woodbg:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28226%2C180%2C74%2C0.09%29%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%2020h10v-10h20v10h10M20%200v10M20%2030v10M0%2020v20M40%2020v20M10%2020v10h20v-10%22/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 40px,linear-gradient(180deg,#3a0f0b 0%,#240806 60%,#160403 100%)}
#bg{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28226%2C180%2C74%2C0.09%29%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%2020h10v-10h20v10h10M20%200v10M20%2030v10M0%2020v20M40%2020v20M10%2020v10h20v-10%22/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 40px,
  radial-gradient(ellipse 60% 50% at 50% 34%,rgba(255,170,70,.20),transparent 70%),
  radial-gradient(ellipse 120% 70% at 50% 120%,rgba(20,90,60,.35),transparent 60%),
  linear-gradient(180deg,#4a110b 0%,#2a0806 55%,#140302 100%)!important}
h1,h2,h3,.hdr h1,.panel h2,.gcard h3,.bigfx span{font-family:var(--kai)!important}
/* 面板＝漆盒：朱漆底、金框、四角雲紋 */
.glass{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28226%2C180%2C74%2C0.09%29%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%2020h10v-10h20v10h10M20%200v10M20%2030v10M0%2020v20M40%2020v20M10%2020v10h20v-10%22/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 40px,linear-gradient(180deg,rgba(88,20,14,.96),rgba(42,8,5,.97))!important;border:1px solid rgba(240,196,92,.7)!important}
.panel{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28226%2C180%2C74%2C0.09%29%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%2020h10v-10h20v10h10M20%200v10M20%2030v10M0%2020v20M40%2020v20M10%2020v10h20v-10%22/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 40px,linear-gradient(180deg,#5a130d,#2c0705)!important;border:2px solid #e9bd56!important;
  box-shadow:0 0 0 3px #1a0302,0 0 0 5px #b8862a,0 0 0 6px #1a0302,0 22px 46px rgba(0,0,0,.7)!important}
.panel::before,.panel::after{content:"";position:absolute;width:26px;height:26px;border:3px solid #f0c45c;pointer-events:none;opacity:.85}
.panel::before{left:5px;top:5px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}.panel::after{right:5px;bottom:5px;border-left:0;border-top:0;border-radius:0 0 8px 0}
/* 匾額標題 */
.panel h2{background:linear-gradient(180deg,#2b1a10,#140b06)!important;color:#f6d77e!important;border:2px solid #e9bd56!important;border-radius:4px!important;
  box-shadow:0 0 0 2px #140b06,0 0 0 3px rgba(233,189,86,.5),inset 0 0 12px rgba(233,189,86,.25)!important;text-shadow:0 2px 0 #000,0 0 10px rgba(255,180,60,.4)!important;text-align:center;letter-spacing:6px!important}
.hdr h1{font-size:28px!important;color:#ffe6a0!important;text-shadow:0 2px 0 #4a0602,0 0 14px rgba(255,150,50,.55)!important}
/* 印章徽章：版本、人數、牌桌標籤 */
.hver{background:#c8261b!important;color:#fff3d6!important;border-radius:4px!important;font-family:var(--kai);font-weight:900;padding:1px 6px!important;transform:rotate(-6deg);
  box-shadow:inset 0 0 0 1.5px rgba(255,240,200,.8),0 2px 4px rgba(0,0,0,.5)}
.gcard .gn{background:#c8261b!important;color:#fff3d6!important;border:0!important;box-shadow:inset 0 0 0 1.5px rgba(255,240,200,.8);font-family:var(--kai);transform:rotate(-4deg)}
/* 按鈕：朱漆主鈕、玉石確認鈕、烏木次鈕 */
.btn.primary{background:linear-gradient(180deg,#ff7a4a 0%,#d8301e 40%,#8e1a12 100%)!important;border:1.5px solid #f6cf6a!important}
.btn.mint{background:linear-gradient(180deg,#6fd6a4 0%,#2f9a6e 45%,#1b6b4a 100%)!important;border:1.5px solid #c8f5dc!important;box-shadow:0 3px 0 #0c3a26,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4)!important}
.btn.ghost,.hbtn,.hubb{background:linear-gradient(180deg,#3a2418,#1c100a)!important;border:1px solid rgba(233,189,86,.6)!important}
.btn.primary{position:relative;overflow:hidden}
.gcard .gplay{background:radial-gradient(circle at 40% 35%,#ff7a4a,#c8261b 60%,#7a0c06)!important;color:#fff3d6!important;border:1.5px solid #f6cf6a!important;animation:playpulse 2.2s ease-in-out infinite}
@keyframes playpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,190,80,.6)}50%{box-shadow:0 0 0 7px rgba(255,190,80,0)}}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.bnav{background:linear-gradient(180deg,#3a0f0b,#1a0503)!important;border:2px solid #e9bd56!important}
.bnav button.on{background:linear-gradient(180deg,#ff7a4a,#8e1a12)!important}
.topbar .coins,.topbar .glass{background:linear-gradient(180deg,rgba(26,6,4,.92),rgba(60,14,10,.92))!important}
/* 首頁模式卡：卷軸／牌匾 */
.gcard{border:2px solid #f0c45c!important;box-shadow:0 0 0 2px #1a0302,0 0 0 4px #9a6c1c,0 12px 24px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.45)!important;animation:cardglow 4s ease-in-out infinite}
.gcard:nth-child(2n){animation-delay:-2s}
@keyframes cardglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08) drop-shadow(0 0 8px rgba(255,190,80,.35))}}
.gcard::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(180deg,#f6d77e,#9a6c1c);z-index:2;box-shadow:0 2px 0 #1a0302}
.gcard[data-arg="mj"]{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%28226%2C180%2C74%2C0.09%29%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%2020h10v-10h20v10h10M20%200v10M20%2030v10M0%2020v20M40%2020v20M10%2020v10h20v-10%22/%3E%3C/g%3E%3C/svg%3E") 0 0/40px 40px,radial-gradient(ellipse at 50% 30%,#2f9a6e,#1b6b4a 60%,#0c3a26)!important}
.gcard[data-arg="lf"]{background:radial-gradient(ellipse at 50% 30%,#d8301e,#8e1a12 60%,#3a0604)!important}
/* 大廳動態：祥雲飄動、燈籠擺動 */
.gfdeco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gfdeco .cl{position:absolute;width:180px;opacity:.9;animation:drift 38s linear infinite}

<script>
// ==ENGINE START==
const MJ = (() => {
  const RESERVE = 16;            // 留 16 張海底（牌尾）不摸
  const BASE = 100, PER_TAI = 20; // 底 100、每台 20
  const NUMS = '一二三四五六七八九';
  const SUITN = ['萬', '筒', '條'];
  const HON = '東南西北中發白';
  const FLW = '春夏秋冬梅蘭竹菊';
  const WINDS = '東南西北';
  const DRAGON_NAME = { 31: '紅中', 32: '青發', 33: '白板' };

  const isFlower = t => t >= 34;
  const isHonor = t => t >= 27 && t < 34;
  function tileName(t) {
    if (t < 27) return NUMS[t % 9] + SUITN[(t / 9) | 0];
    if (t < 34) return HON[t - 27];
    return FLW[t - 34];
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function buildWall(rng, flowers = true) {
    const w = [];
    for (let t = 0; t < 34; t++) for (let k = 0; k < 4; k++) w.push(t);
    if (flowers) for (let f = 34; f < 42; f++) w.push(f);
    for (let i = w.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [w[i], w[j]] = [w[j], w[i]]; }
    return w;
  }
  function counts(tiles) { const c = new Array(34).fill(0); for (const t of tiles) if (t < 34) c[t]++; return c; }
  const sortTiles = a => a.sort((x, y) => x - y);

  // ---------- 胡牌判定 ----------
  function setsOnly(c) {
    let i = 0; while (i < 34 && c[i] === 0) i++;
    if (i === 34) return true;
    if (c[i] >= 3) { c[i] -= 3; const ok = setsOnly(c); c[i] += 3; if (ok) return true; }
    if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--; const ok = setsOnly(c); c[i]++; c[i + 1]++; c[i + 2]++;
      if (ok) return true;
    }
    return false;
  }
  function isWinHand(tiles, meldCount) {
    if (tiles.length !== (5 - meldCount) * 3 + 2) return false;
    if (tiles.some(isFlower)) return false;
    const c = counts(tiles);
    for (let i = 0; i < 34; i++) if (c[i] >= 2) {
      c[i] -= 2; const ok = setsOnly(c); c[i] += 2; if (ok) return true;
    }
    return false;
  }
  function seqOnly(c) {
    let i = 0; while (i < 34 && c[i] === 0) i++;
    if (i === 34) return true;
    if (i >= 27 || i % 9 > 6 || !c[i + 1] || !c[i + 2]) return false;
    c[i]--; c[i + 1]--; c[i + 2]--; const ok = seqOnly(c); c[i]++; c[i + 1]++; c[i + 2]++;
    return ok;
  }
  function allSequencesHand(tiles) {
    const c = counts(tiles);
    for (let i = 0; i < 27; i++) if (c[i] >= 2) { c[i] -= 2; const ok = seqOnly(c); c[i] += 2; if (ok) return true; }
    return false;
  }
  function allTripletsHand(tiles) {
    const c = counts(tiles); let pairs = 0;
    for (let i = 0; i < 34; i++) { if (c[i] === 0 || c[i] === 3) continue; if (c[i] === 2) pairs++; else return false; }
    return pairs === 1;
  }

  // 嚦咕嚦咕：門清 17 張＝7 對＋1 刻（4 張同牌可當 2 對）
  function isLigu(tiles, meldCount) {

const CHORDS = [[220, 277.2, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6], [196, 246.9, 329.6]];
function bgmUpdate() {
  if (!CFG.bgm || !CFG.bgmVol) { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } if (bgmGain) bgmGain.gain.value = 0; return; }
  try {
    const A = ac();
    if (!bgmGain) { bgmGain = A.createGain(); bgmGain.connect(A.destination); }
    bgmGain.gain.value = CFG.bgmVol / 10 * .05;
    if (bgmTimer) return;
    let i = 0;
    const play = () => {
      const now = A.currentTime;
      CHORDS[i++ % CHORDS.length].forEach((f, k) => {
        const o = A.createOscillator(), g = A.createGain(); o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.5, now + 1.2); g.gain.linearRampToValueAtTime(0, now + 3.9);
        o.connect(g).connect(bgmGain); o.start(now + k * .05); o.stop(now + 4);
        if (k === 2) { const o2 = A.createOscillator(), g2 = A.createGain(); o2.type = 'triangle'; o2.frequency.value = f * 2;
          g2.gain.setValueAtTime(0, now + 1.6); g2.gain.linearRampToValueAtTime(.18, now + 1.7); g2.gain.exponentialRampToValueAtTime(.001, now + 3);
          o2.connect(g2).connect(bgmGain); o2.start(now + 1.6); o2.stop(now + 3.1); }
      });
    };
    play(); bgmTimer = setInterval(play, 4000);
  } catch (e) {}
}

// 音效：Web Audio 即時合成（無音檔）；語音：內嵌 zh-TW TTS 片段，缺少時改用瀏覽器 speechSynthesis；動畫：CSS／WAAPI／canvas 粒子，全部不阻塞遊戲流程
const RM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const ANIM = () => CFG.anim !== false && !RM;
const TILE_SAY = (() => { const N = '一二三四五六七八九'; return [...[...N].map(n => n + '萬'), ...[...N].map(n => n + '筒'), ...[...N].map(n => n + '條'), '東風', '南風', '西風', '北風', '紅中', '發財', '白板', '春', '夏', '秋', '冬', '梅', '蘭', '竹', '菊']; })();
let NOISE = null;
function noiseBuf(A) { if (NOISE) return NOISE; const b = A.createBuffer(1, A.sampleRate * .5, A.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return NOISE = b; }
function sfx(kind) {
  if (!CFG.sound || !CFG.sfxVol) return;
  try {
    const A = ac(), now = A.currentTime, V = CFG.sfxVol / 10;
    const tone = (f, t0, dur, type = 'triangle', vol = .18, f2) => {
      const o = A.createOscillator(), g = A.createGain(); o.type = type; o.frequency.setValueAtTime(f, now + t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + t0 + dur);
      g.gain.setValueAtTime(0, now + t0); g.gain.linearRampToValueAtTime(vol * V, now + t0 + .006); g.gain.exponentialRampToValueAtTime(.0005, now + t0 + dur);
      o.connect(g).connect(A.destination); o.start(now + t0); o.stop(now + t0 + dur + .03);
    };
    const noise = (t0, dur, vol = .2, fq = 2000, q = 1, type = 'bandpass') => {
      const s = A.createBufferSource(), f = A.createBiquadFilter(), g = A.createGain(); s.buffer = noiseBuf(A); f.type = type; f.frequency.value = fq; f.Q.value = q;
      g.gain.setValueAtTime(vol * V, now + t0); g.gain.exponentialRampToValueAtTime(.0005, now + t0 + dur);
      s.connect(f).connect(g).connect(A.destination); s.start(now + t0, Math.random() * .3); s.stop(now + t0 + dur + .02);
    };
    const knock = (t0, vol = 1, pitch = 1) => { noise(t0, .05, .5 * vol, 2600 * pitch, 2.5); tone(180 * pitch, t0, .09, 'sine', .35 * vol, 90 * pitch); };
    switch (kind) {
      case 'tap': tone(1500, 0, .05, 'sine', .08); break;
      case 'draw': noise(0, .035, .22, 3800, 3); tone(900, 0, .03, 'sine', .05); break;               // 摸牌：輕點
      case 'discard': knock(0, 1); noise(.012, .06, .18, 1200, 1.5); break;                           // 打牌：啪
      case 'claim': [0, .07, .14].forEach((t, i) => knock(t, .8, 1 + i * .08)); break;                 // 吃碰槓：喀喀喀
      case 'ting': [1318, 1760, 2637].forEach((f, i) => tone(f, i * .07, .6, 'sine', .12)); break;     // 聽：鈴聲
      case 'win':                                                                                      // 胡：鑼＋號角
        tone(110, 0, 1.6, 'sine', .35, 92); tone(220, 0, 1.2, 'triangle', .12, 180); noise(0, .6, .15, 500, .7);
        [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .25 + i * .09, .5, 'triangle', .14)); sfx('coins'); break;
      case 'coins': for (let i = 0; i < 9; i++) { const t = .35 + i * .07 + Math.random() * .03; tone(2400 + Math.random() * 1600, t, .09, 'sine', .07); noise(t, .03, .08, 6000, 4); } break;
      case 'coin': [1200, 1600, 2000].forEach((f, i) => tone(f, i * .06, .12, 'sine', .1)); break;
      case 'shuffle': for (let i = 0; i < 22; i++) knock(i * .035 + Math.random() * .02, .25 + Math.random() * .25, .8 + Math.random() * .6); break; // 洗牌：嘩啦
      case 'tick': tone(1000, 0, .04, 'square', .05); break;
      case 'flick': noise(0, .07, .28, 3200, .9, 'highpass'); break;                                   // 出牌：唰
      case 'riffle': for (let i = 0; i < 16; i++) noise(i * .028, .03, .16, 4200, 1.2); break;          // 發牌
      case 'lose': [392, 349, 311, 262].forEach((f, i) => tone(f, i * .14, .3, 'triangle', .12)); break;
      case 'boom': tone(80, 0, .9, 'sine', .55, 35); noise(0, .8, .5, 300, .5, 'lowpass'); noise(0, .2, .35, 1800, .6); break;
      case 'join': tone(660, 0, .1, 'sine', .1); tone(990, .08, .14, 'sine', .1); break;
    }

}

const VCACHE = {}; let VSRC = null;
function b64buf(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
function speakTTS(text) { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = 1.15; u.volume = Math.min(1, (CFG.sfxVol || 8) / 10); speechSynthesis.speak(u); } catch (e) {} }
// key：'pon'|'chi'|'kan'|'ting'|'hu'|'tsumo'|'fang'|'draw'|'flower' 或 't'+牌號；seat 決定男女聲
function say(key, seat = 0, fallback) {
  if (CFG.voice === false || !CFG.sound) return;
  const v = seat % 2 ? 'm' : 'f', b = (VOICE[v] && VOICE[v][key]) || (VOICE.f[key]) || (VOICE.m[key]);
  if (!b) { if (fallback) speakTTS(fallback); return; }
  try {
    const A = ac(), id = v + key;
    const play = buf => { try { if (VSRC) try { VSRC.stop(); } catch (e) {} const s = A.createBufferSource(), g = A.createGain(); g.gain.value = Math.min(1.4, (CFG.sfxVol || 8) / 10 * 1.4); s.buffer = buf; s.connect(g).connect(A.destination); s.start(); VSRC = s; } catch (e) {} };
    if (VCACHE[id]) return play(VCACHE[id]);
    const p = A.decodeAudioData(b64buf(b), buf => { VCACHE[id] = buf; play(buf); }, () => fallback && speakTTS(fallback));
    if (p && p.catch) p.catch(() => {});
  } catch (e) { if (fallback) speakTTS(fallback); }
}
const sayTile = (t, seat) => say('t' + t, seat, TILE_SAY[t]);

(() => { const un = () => { try { const A = ac(); const b = A.createBuffer(1, 1, 22050), s = A.createBufferSource(); s.buffer = b; s.connect(A.destination); s.start(0); if (A.resume) A.resume(); } catch (e) {} removeEventListener('pointerdown', un, true); removeEventListener('touchend', un, true); };

// 光芒／粒子：canvas 全螢幕，自動移除
function particles(opts = {}) {
  if (!ANIM()) return;
  try {
    const cv = document.createElement('canvas'), W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
    cv.className = 'fxcv'; cv.width = W * dpr; cv.height = H * dpr; document.body.appendChild(cv);
    const c = cv.getContext('2d'); if (!c) { cv.remove(); return; } c.scale(dpr, dpr);
    const P = [], cols = opts.colors || ['#ffd54a', '#ff8a3d', '#ff4d4d', '#fff3b0', '#7fe0ff'];
    const burst = (x, y, n, sp) => { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (.4 + Math.random()); P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, c: cols[i % cols.length], r: 1.5 + Math.random() * 2.5 }); } };

    fire();

      const el = now - t0;

const SIGN_REW = [[500, 0], [800, 0], [1000, 0], [1200, 2], [1500, 0], [2000, 3], [3000, 10]];
OPEN.signin = () => {
  const gap = SIGN.last ? daysBetween(SIGN.last, today()) : 99;
  const can = SIGN.last !== today();
  let streak = SIGN.streak;
  if (can && gap > 1) streak = 0;
  if (streak >= 7 && can) streak = 0;
  const shown = can ? streak : SIGN.streak;
  modal(`<h2>每日簽到</h2><div class="sub">天天登入・好禮相送　已連續簽到 <b>${shown}</b> / 7 天</div>
    <div class="signg">${SIGN_REW.map(([c, j], i) => `<div class="sd ${i < shown ? 'got' : ''} ${i === streak && can ? 'now' : ''} ${i === 6 ? 'd7' : ''}"><small>第 ${i + 1} 天</small><div class="rw">${c ? coinSVG + '<b>' + fmt(c) + '</b>' : ''}${j ? '<span>' + jadeSVG + '<b>' + j + '</b></span>' : ''}</div>${i < shown ? '<i>✓</i>' : ''}</div>`).join('')}</div>
    <div class="foot"><button class="btn ghost" data-close>關閉</button><button class="btn primary" id="sg" ${can ? '' : 'disabled'}>${can ? '簽到領取' : '今日已簽到'}</button></div>`, pn => {
      if (!can) return;
      pn.querySelector('#sg').onclick = () => { const [c, j] = SIGN_REW[streak]; SIGN.streak = streak + 1; SIGN.last = today(); addCoins(c, j); beep('coin'); save(); toast(`簽到成功！獲得 ${fmt(c)} 金幣${j ? `、${j} 玉幣` : ''}`); closeModal(); renderHome(); };

};

function trendSVG(list, w = 520, h = 150) {
  const pts = list.slice(0, 20).reverse(); if (pts.length < 2) return '<div class="empty">至少完成兩場後會顯示趨勢圖</div>';
  let acc = 0; const ys = pts.map(p => acc += p.delta); const mn = Math.min(0, ...ys), mx = Math.max(0, ...ys), sp = mx - mn || 1;
  const X = i => 30 + i * (w - 50) / (pts.length - 1), Y = v => 12 + (mx - v) / sp * (h - 34);
  const path = ys.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  return `<svg class="trend" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43e0b0" stop-opacity=".5"/><stop offset="1" stop-color="#43e0b0" stop-opacity="0"/></linearGradient></defs>
    <line x1="30" x2="${w - 20}" y1="${Y(0)}" y2="${Y(0)}" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
    <path d="${path}L${X(ys.length - 1)} ${h - 22}L30 ${h - 22}Z" fill="url(#tg)"/><path d="${path}" fill="none" stroke="#43e0b0" stroke-width="3" stroke-linejoin="round"/>
    ${ys.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${pts[i].delta >= 0 ? '#ffd36b' : '#ff7a7a'}"/>`).join('')}
    <text x="30" y="${h - 6}" fill="#cfe" font-size="11">較早</text><text x="${w - 20}" y="${h - 6}" fill="#cfe" font-size="11" text-anchor="end">最近</text>
    <text x="4" y="${Y(mx) + 4}" fill="#cfe" font-size="10">${fmt(mx)}</text><text x="4" y="${Y(mn) + 4}" fill="#cfe" font-size="10">${fmt(mn)}</text></svg>`;
}

    rules: { n: 4, hands: 4, base: [100, 300][Math.floor(r() * 2)], perTai: 20, chi: true }, notice: '歡迎加入！每週日晚上固定開桌，打牌開心最重要。', records: [], created: today(), viewAs: 'member' };

}

// ================= 牌桌 =================
const G = { game: null, token: 0, pending: null, sel: -1, disp: [], reveal: false, result: null, newRiver: -1, kind: 'play', view: 0, n: 4, auto: false, ting: false, tingPick: false, paused: false, rspeed: 1, emo: {}, status: '' };
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPD = () => 600 * CFG.speed;
const roundWind = () => G.kind === 'replay' ? G.rp.roundWind : Math.floor(G.dealerMoves / G.n) % 4;
const vpos = p => { const v = (p - G.view + G.n) % G.n; return G.n === 2 ? (v ? 2 : 0) : v; };
const ROLE = ['你', '下家', '對家', '上家'];
const nameOf = p => G.players[p].name;
const roleOf = p => G.kind === 'play' ? (p === 0 ? '你' : ROLE[vpos(p)]) : '';

function startMatch(cfg) {
  closeModal();
  Object.assign(G, { kind: 'play', cfg, n: cfg.n, hands: cfg.hands, base: cfg.base, perTai: cfg.perTai, rules: Object.assign({}, cfg.rules, cfg.cap != null ? { cap: cfg.cap } : {}), preset: cfg.preset || 'std', players: cfg.players,
    scores: Array(cfg.n).fill(0), dealer: rnd(cfg.n), dealerMoves: 0, lian: 0, handNo: 0, over: false, view: 0, auto: false, log: [], best: null, matchId: 'h' + Date.now(), jackpots: [] });
  show('game'); startHand();
