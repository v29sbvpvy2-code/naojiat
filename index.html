<head>

<title>鬧熱牌局｜台灣麻將・十三支・大老二・鬥地主・暗棋</title>
<style>
/* 台灣麻將牌：大而厚的方正牌身，象牙白牌面＋厚實的有色牌背（雙層），圓角較小 */
.t{--w:46px;width:var(--w);height:calc(var(--w)*1.34);position:relative;flex:none;display:inline-block;
  border-radius:calc(var(--w)*.085);
  background:linear-gradient(172deg,#fffef8 0%,#fbf6e6 45%,#f0e7cd 100%);
  box-shadow:
    inset 0 calc(var(--w)*.02) 0 rgba(255,255,255,.95),
    inset calc(var(--w)*.018) 0 0 rgba(255,255,255,.6),
    inset 0 calc(var(--w)*-.03) calc(var(--w)*.045) rgba(110,85,40,.2),
    inset calc(var(--w)*-.018) 0 calc(var(--w)*.03) rgba(110,85,40,.12),
    0 calc(var(--w)*.035) 0 #e6dbbb,
    0 calc(var(--w)*.065) 0 #d6c9a3,
    0 calc(var(--w)*.075) 0 var(--bk1,#3f8a5e),
    0 calc(var(--w)*.15) 0 var(--bk2,#2a6b48),
    0 calc(var(--w)*.2) 0 var(--bk4,#123a25),
    0 calc(var(--w)*.23) calc(var(--w)*.16) rgba(0,0,0,.5);
  margin-bottom:calc(var(--w)*.2);
  transition:transform .16s ease, box-shadow .16s;
}
.t svg{position:absolute;left:4.5%;top:4%;width:91%;height:92%;overflow:visible}
.t.back{background:linear-gradient(170deg,var(--bk1,#3f8a5e) 0%,var(--bk2,#2a6b48) 55%,var(--bk3,#1d5236) 100%);
  box-shadow:inset 0 calc(var(--w)*.025) 0 rgba(255,255,255,.25),inset 0 calc(var(--w)*-.03) calc(var(--w)*.05) rgba(0,0,0,.3),0 calc(var(--w)*.06) 0 var(--bk4,#123a25),0 calc(var(--w)*.075) 0 #d6c9a3,0 calc(var(--w)*.15) 0 #efe6cb,0 calc(var(--w)*.17) 0 #cdbf98,0 calc(var(--w)*.2) calc(var(--w)*.16) rgba(0,0,0,.45)}
.t.back::after{content:"";position:absolute;inset:14%;border-radius:10%;border:1px solid rgba(255,240,200,.16)}
:root{--k:1;--mint:#c9a45a;--coral:#ff7a59;--gold:#ffc857;--cream:#f6f1e7;--ink:#0b1f22;
  --ui:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06161a;color:var(--cream);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#bg{position:fixed;inset:0;background:
  radial-gradient(60% 70% at 18% 20%,rgba(201,164,90,.22),transparent 60%),
  radial-gradient(50% 60% at 85% 80%,rgba(255,122,89,.20),transparent 60%),
  radial-gradient(40% 50% at 80% 10%,rgba(120,110,255,.18),transparent 60%),
  linear-gradient(160deg,#0a2a30 0%,#071b20 55%,#050f14 100%)}
#bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 85%)}
#stage{position:fixed;left:50%;top:50%;width:var(--W,960px);height:540px;transform:translate(-50%,-50%) scale(var(--k));transform-origin:center}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:scale(.985)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
button{font-family:var(--ui);cursor:pointer;border:0;color:inherit}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.btn{border-radius:999px;padding:12px 26px;font-size:18px;font-weight:800;letter-spacing:1px;transition:transform .12s ease,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active,.chip:active,.cbtn:active,.icon:active,.card:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(135deg,#ffd36b 0%,#ff9a52 45%,#ff6b6b 100%);color:#fff;box-shadow:0 8px 22px rgba(255,110,90,.45),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(150,40,20,.45)}
.btn.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.28);color:var(--cream);backdrop-filter:blur(10px)}
.btn.mint{background:linear-gradient(135deg,#6dffd0,#1fc99a);color:#053b2d;box-shadow:0 8px 20px rgba(31,201,154,.4)}
.icon{width:40px;height:40px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.icon svg{width:22px;height:22px}
.chip{padding:10px 18px;border-radius:999px;font-size:16px;font-weight:700;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);transition:all .18s;color:var(--cream);min-width:74px}
.chip.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;border-color:transparent;box-shadow:0 6px 16px rgba(34,201,155,.4)}
.num{font-variant-numeric:tabular-nums;font-weight:800}

/* ---------- table ---------- */
.felt{position:absolute;inset:6px;border-radius:38px;
  background:radial-gradient(ellipse 60% 55% at 50% 47%,var(--f1,#1f9a76) 0%,var(--f2,#137a5f) 38%,var(--f3,#0d5a49) 70%,var(--f4,#093f36) 100%);
  box-shadow:inset 0 0 0 2px rgba(201,164,90,.25),inset 0 0 60px rgba(0,0,0,.45),0 0 0 7px #0a2125,0 0 0 8px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.6)}
.felt::before{content:"";position:absolute;left:50%;top:47%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(rgba(130,255,210,.16),transparent 62%)}
.felt::after{content:"";position:absolute;inset:0;border-radius:38px;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.25) .6px,transparent .7px);background-size:4px 4px}
.g-abs{position:absolute}
.seatchip{position:absolute;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;min-width:132px;transition:box-shadow .25s,border-color .25s}
.seatchip .avatar{width:36px;height:36px;font-size:15px}
.seatchip .nm{font-size:14px;font-weight:800;line-height:1.1;white-space:nowrap}
.seatchip .row2{display:flex;gap:5px;align-items:center;font-size:12px;margin-top:2px}
.seatchip .sc{font-weight:800}
.seatchip .sc.pos{color:var(--mint)}.seatchip .sc.neg{color:#ff9b8a}
.wtag{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:rgba(255,255,255,.16);font-weight:900;font-size:12px}
.dtag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:7px;background:linear-gradient(135deg,#ff8a5c,#ff4d6d);font-weight:900;font-size:12px;color:#fff}
.seatchip.active{border-color:rgba(201,164,90,.9);box-shadow:0 0 0 3px rgba(201,164,90,.25),0 0 26px rgba(201,164,90,.45)}
.backs-top{left:50%;top:16px;transform:translateX(-50%);display:flex;gap:1px}
.sideb{width:26px;height:13px;border-radius:4px;background:linear-gradient(90deg,#3fcb8a,#1c9560);box-shadow:inset 0 -3px 0 #f4ecd2,0 2px 3px rgba(0,0,0,.35);margin-bottom:-1px}
.backs-side{top:112px;display:flex;flex-direction:column;align-items:center;width:44px}
.backs-side.reveal{display:grid;grid-template-columns:repeat(2,20px);gap:1px 2px}
.b-l{left:14px}.b-r{right:14px}
.melds{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;align-items:flex-end}
.meld{display:inline-flex;gap:1px;padding:2px;border-radius:7px;background:rgba(0,0,0,.18)}
.m-top{left:calc(50% + 168px);top:12px;width:calc(50% - 230px);max-width:300px}
.m-l{left:62px;top:110px;width:74px}
.m-r{right:62px;top:110px;width:74px;justify-content:flex-end}
.river{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.r2{left:calc(50% - 144px);top:64px;width:290px}
.r0{left:calc(50% - 144px);top:312px;width:290px}
.r3{left:160px;top:112px;width:116px}
.r1{right:158px;top:112px;width:116px}
.river .t.last{box-shadow:0 0 0 2px #ff7a59,0 0 14px rgba(255,122,89,.8),0 calc(var(--w)*.10) 0 #27a36a}
.river .t.new{animation:drop .38s cubic-bezier(.2,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(var(--dy,40px)) scale(1.6);opacity:0}100%{transform:none;opacity:1}}
.plate{left:calc(50% - 100px);top:186px;width:200px;height:120px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(5,30,28,.75),rgba(5,25,24,.55));border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.plate .w{position:absolute;font-weight:900;font-size:15px;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);transition:all .25s}
.plate .w.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;box-shadow:0 0 16px rgba(201,164,90,.7)}
.plate .w0{bottom:-13px;left:87px}.plate .w2{top:-13px;left:87px}.plate .w3{left:-13px;top:47px}.plate .w1{right:-13px;top:47px}
.plate .rd{font-size:13px;opacity:.8;letter-spacing:1px}
.plate .left{font-size:38px;line-height:1.05;font-weight:900;background:linear-gradient(180deg,#fff,#a8ffe4);-webkit-background-clip:text;background-clip:text;color:transparent}
.plate .left small{font-size:13px;-webkit-text-fill-color:rgba(255,255,255,.7);margin-left:3px;font-weight:700}
.plate .tags{display:flex;gap:5px;margin-top:3px;font-size:11px}
.plate .tags span{padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.1)}
.plate .tags .lz{background:linear-gradient(135deg,#ff8a5c,#ff4d6d);font-weight:800}
.status{left:calc(50% - 144px);top:290px;width:290px;text-align:center;font-size:12px;opacity:0}
.myflw{left:14px;top:428px;display:flex;gap:2px;width:140px;flex-wrap:wrap}
.me-chip{left:12px;top:462px}
.hand{left:160px;right:10px;top:452px;height:80px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.hand .t.h{cursor:pointer}
@media (hover:hover){.hand .t.h:hover{transform:translateY(-6px)}}
.hand .t.sel,.hand .t.sel:hover{transform:translateY(-16px);box-shadow:0 0 0 2.5px var(--mint),0 0 22px rgba(201,164,90,.6),0 calc(var(--w)*.10) 0 #27a36a,0 calc(var(--w)*.13) 0 #11663f}
.hand .gap{width:14px;flex:none}
.hand .t .tp{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;padding:1px 5px;border-radius:6px;background:var(--mint);color:#2a1a0b;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.hand .t.win{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(255,200,87,.8)}
.claimbar{right:12px;top:372px;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.cbtn{width:66px;height:66px;border-radius:50%;font-size:28px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;
  box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .12s;animation:cin .35s cubic-bezier(.2,1.6,.5,1) both;text-shadow:0 2px 3px rgba(0,0,0,.3)}
@keyframes cin{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.cbtn.hu{background:radial-gradient(circle at 35% 30%,#ff9a8a,#ff4d5e 55%,#d11f3c);box-shadow:0 0 0 4px rgba(255,77,94,.3),0 8px 22px rgba(255,77,94,.55),inset 0 2px 0 rgba(255,255,255,.45)}
.cbtn.zm{background:radial-gradient(circle at 35% 30%,#ffe9a3,#ffb547 55%,#f08a1c);color:#5a2a00;text-shadow:none;box-shadow:0 0 0 4px rgba(255,181,71,.3),0 8px 22px rgba(255,160,60,.55),inset 0 2px 0 rgba(255,255,255,.6)}
.cbtn.pon{background:radial-gradient(circle at 35% 30%,#9ec5ff,#4a7dff 55%,#2b54d9)}
.cbtn.kan{background:radial-gradient(circle at 35% 30%,#d9a8ff,#9b5cff 55%,#6d34d6)}
.cbtn.chi{background:radial-gradient(circle at 35% 30%,#9effd8,#22c99b 55%,#0d9673)}
.cbtn.pass{background:radial-gradient(circle at 35% 30%,#a9b8bd,#62757b 60%,#475559);font-size:22px}
.cbtn.wide{width:auto;border-radius:22px;padding:6px 12px;flex-direction:row;gap:4px;height:66px;font-size:22px}
.cbtn small{font-size:11px;font-weight:700;opacity:.9}
.ting{left:160px;top:404px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 12px;border-radius:14px;font-size:13px;font-weight:700}
.ting .w{display:inline-flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800;color:var(--mint)}
.ting .w .t{margin-bottom:3px}
.tbtn{top:10px;width:40px;height:40px}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:76px;font-weight:900;letter-spacing:4px;pointer-events:none;z-index:40;white-space:nowrap;
  -webkit-text-stroke:3px #fff;paint-order:stroke fill;animation:popin 1.15s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.pop span{background:var(--pg);-webkit-background-clip:text;background-clip:text;color:transparent}
.pop.k-hu{--pg:linear-gradient(180deg,#ffd36b,#ff4d5e)}.pop.k-pon{--pg:linear-gradient(180deg,#bcd6ff,#3c6dff)}
.pop.k-kan{--pg:linear-gradient(180deg,#e6c4ff,#8a4dff)}.pop.k-chi{--pg:linear-gradient(180deg,#b6ffe6,#13b788)}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}
  45%{transform:translate(-50%,-50%) scale(.96)}60%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(2,10,12,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.on{opacity:1;pointer-events:auto}
.modal .panel{width:660px;max-height:500px;overflow:auto;padding:22px 26px;transform:translateY(16px) scale(.96);transition:transform .35s cubic-bezier(.2,1.4,.5,1)}
.modal.on .panel{transform:none}
.panel{background:linear-gradient(160deg,rgba(28,58,62,.92),rgba(10,28,32,.94))!important}
.panel h2{margin:0 0 4px;font-size:30px;font-weight:900}
.panel h2.grad{background:linear-gradient(180deg,#f4e2ac,#c9a45a 60%,#9c7633);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h4{margin:14px 0 6px;font-size:14px;opacity:.7;font-weight:700;letter-spacing:1px}
.panel .sub{opacity:.8;font-size:15px}
.panel .foot{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.panel .foot .btn{padding:10px 22px;font-size:17px}
.taigrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.taigrid div{display:flex;justify-content:space-between;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:15px}
.taigrid b{color:var(--gold)}
.total{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.total .big{font-size:40px;font-weight:900;background:linear-gradient(180deg,#f4e2ac,#c9a45a 60%,#9c7633);-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scores div{padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);text-align:center;font-size:13px}
.scores div b{display:block;font-size:19px;margin-top:2px}
.scores .d{font-size:12px;font-weight:800}
.pos{color:var(--mint)}.neg{color:#ff9b8a}
.winrow{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;margin-top:8px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);margin-bottom:8px;font-size:16px;font-weight:700}
.setrow .r{margin-left:auto;display:flex;gap:8px}
.toggle{width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.6,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle.on{background:linear-gradient(180deg,#e6cf8e,#b48c40)}.toggle.on::after{transform:translateX(24px)}
.rules{font-size:14.5px;line-height:1.7;padding-left:20px;margin:6px 0}
.rules b{color:var(--mint)}
.inp{width:100%;font-size:20px;padding:12px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-family:var(--ui);outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--mint)}
.rank{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06);margin-bottom:8px}
.rank.me{background:linear-gradient(135deg,rgba(201,164,90,.22),rgba(14,155,120,.12));border:1px solid rgba(201,164,90,.5)}
.rank .no{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;background:rgba(255,255,255,.12)}
.rank .no.n1{background:linear-gradient(135deg,#ffe08a,#ffb22e);color:#5a3a00}.rank .no.n2{background:linear-gradient(135deg,#eef2f6,#aab6c2);color:#333}.rank .no.n3{background:linear-gradient(135deg,#ffc79a,#d9844a);color:#4a2200}
.rank .nm{font-size:17px;font-weight:800}.rank .sc{margin-left:auto;font-size:22px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.stat b{display:block;font-size:28px;margin-top:4px}
#rotate{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#0a2a30,#050f14);font-size:20px;font-weight:800;text-align:center}

.modal .panel.wide{width:880px;max-height:520px;padding:20px 26px}
.rcols{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.taigrid.one{grid-template-columns:1fr}
.scores{grid-template-columns:repeat(2,1fr)}

/* login */
#login .logo{position:absolute;left:56px;top:96px}
.logo .wm{font-size:74px;font-weight:900;letter-spacing:4px;line-height:1;background:linear-gradient(180deg,#ffffff 20%,#b9ffe9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(201,164,90,.25))}
.logo .badge{display:inline-flex;align-items:center;justify-content:center;vertical-align:top;margin-left:8px;margin-top:6px;height:34px;padding:0 12px;border-radius:12px;background:linear-gradient(135deg,#ff8a5c,#ff4d6d);color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 16px rgba(255,77,109,.45);-webkit-text-fill-color:#fff}
.logo .tag{margin-top:12px;font-size:17px;opacity:.8;letter-spacing:2px}
.fan{position:absolute;left:84px;top:290px;width:330px;height:200px}
.fan .t{position:absolute;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.loginp{position:absolute;right:56px;top:50%;transform:translateY(-50%);width:380px;padding:24px 28px;display:flex;flex-direction:column;gap:11px}
.loginp h2{margin:0;font-size:26px}.loginp .sub{font-size:13px;margin-top:-6px}
.loginp .btn{width:100%;padding:11px;font-size:17px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;opacity:.85;line-height:1.5}
.agree input{width:18px;height:18px;accent-color:#b48c40;flex:none;margin:0}
.agree a{color:var(--mint);text-decoration:underline;cursor:pointer}
.loginp .ver{position:static;text-align:center;font-size:11px;opacity:.45}
/* home */
.topbar{position:absolute;left:18px;right:18px;top:12px;display:flex;align-items:center;gap:10px;z-index:3}
.topbar.right{left:auto}
.profile{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:999px;color:var(--cream)}
.profile .nm{font-weight:800;font-size:16px}.profile .sub{font-size:12px}.ttl{color:var(--gold)}
.coins{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 7px;border-radius:999px;font-size:17px;color:var(--cream)}
.topbar .coins:first-of-type{margin-left:auto}
.topbar.right .coins:first-of-type{margin-left:0}
.coins svg{width:26px;height:26px}.coins .num{min-width:54px;text-align:left}
.coins .plus{width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#7c2a26,#4e1714);display:flex;align-items:center;justify-content:center}
.coins .plus svg{width:13px;height:13px}
.coins.jade{padding-right:14px}
.ticons{display:flex;gap:4px}
.ti{position:relative;width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;font-size:11px;color:var(--cream)}
.ti svg{width:34px;height:34px;padding:7px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.ti em{position:absolute;right:8px;top:-2px;width:10px;height:10px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px #0a2a30}
.logo.sm{position:absolute;left:40px;top:92px}.logo.sm .wm{font-size:58px}.logo.sm .tag{font-size:15px;margin-top:8px}
.fan.sm{left:58px;top:228px;width:260px;height:120px}
.newbie{position:absolute;left:40px;top:372px;width:300px;height:70px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:linear-gradient(180deg,#7c2a26,#4e1714);box-shadow:0 10px 26px rgba(255,77,109,.4);color:#fff;text-align:left;animation:pulse 2.4s ease-in-out infinite}
.newbie b{display:block;font-size:20px}.newbie span{font-size:12px;opacity:.9}.newbie .gbox{font-size:38px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.hgrid{position:absolute;right:24px;top:76px;width:560px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:200px 108px;gap:12px}
.card{border-radius:24px;padding:16px;position:relative;overflow:hidden;text-align:left;transition:transform .15s;color:var(--cream)}
.card:active{transform:scale(.96)}
.card.big{grid-column:span 3;background:linear-gradient(135deg,#1fd19b 0%,#0e9b78 45%,#0a6a5e 100%);box-shadow:0 18px 40px rgba(14,155,120,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.card.big.coral{background:linear-gradient(135deg,#ffb36b 0%,#ff7a59 45%,#e0466a 100%);box-shadow:0 18px 40px rgba(255,100,90,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.card.big::before{content:"";position:absolute;width:300px;height:300px;right:-120px;top:-140px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.3),transparent 65%)}
.card.big h2{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;position:absolute;left:20px;bottom:44px;text-shadow:0 3px 12px rgba(0,60,40,.35)}
.card.big p{margin:0;position:absolute;left:21px;bottom:20px;font-size:14px;opacity:.92}
.card.big .play{position:absolute;right:16px;bottom:16px;width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.card.big .art{position:absolute;right:20px;top:16px;width:150px;height:90px}
.card.big .art .t{position:absolute}
.card.big .art.avs{display:flex;gap:0;width:auto}.card.big .art.avs .av{margin-left:-12px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.card.mid,.card.sm2{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;justify-content:flex-end;backdrop-filter:blur(14px)}
.card.mid{grid-column:span 3;background:linear-gradient(135deg,rgba(120,110,255,.5),rgba(60,70,200,.35))}
.card.sm2{grid-column:span 1}
.card.mid h3,.card.sm2 h3{margin:0;font-size:18px;font-weight:800}
.card.mid p,.card.sm2 p{margin:2px 0 0;font-size:11px;opacity:.7}
.card .emo{position:absolute;right:14px;top:10px;font-size:34px}
.card.sm2 .emo{left:14px;right:auto;font-size:28px}
.hgrid .card.mid{grid-column:span 3}
.hgrid .card.sm2:nth-of-type(4){grid-column:4/5}
.bnav{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;z-index:3}
.bnav button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:none;color:rgba(255,255,255,.75);font-size:14px;font-weight:700}
.bnav button svg{width:20px;height:20px}
.bnav button.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b}
/* page shell */
.hdr{position:absolute;left:18px;top:12px;display:flex;align-items:center;gap:14px;z-index:3;max-width:calc(100% - 380px)}
.hdr h1{margin:0;font-size:26px;font-weight:900;letter-spacing:2px;white-space:nowrap}
.hdr .sub{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{position:absolute;left:24px;right:24px;top:72px;bottom:14px;overflow:auto;scrollbar-width:thin}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.tabs button{padding:7px 18px;border-radius:999px;background:none;color:rgba(255,255,255,.75);font-weight:700;font-size:14px;position:relative}
.tabs button.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b}
.tabs em{font-style:normal;background:#ff4d5e;color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.inp{width:100%;font-size:17px;padding:10px 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font-family:var(--ui);outline:none;-webkit-user-select:text;user-select:text}
.inp.big{font-size:28px;letter-spacing:8px;text-align:center;margin-top:12px}
.form{display:flex;flex-direction:column;gap:6px;margin-top:10px}.form label{font-size:13px;opacity:.75;margin-top:4px}
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:16px;text-align:left;color:var(--cream);width:100%}
.hrow>div:first-child{flex:1;min-width:0}.hrow b{display:block;font-size:15px}.hrow small{font-size:12px;opacity:.65}
.rk{font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px}.rk.r1{background:linear-gradient(135deg,#ffe08a,#ffb22e);color:#5a3a00}
.dl{font-weight:900;font-size:18px;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis.row{grid-template-columns:repeat(4,1fr);margin-bottom:6px}
.kpi{padding:10px 12px;border-radius:16px;text-align:center}.kpi small{font-size:12px;opacity:.7}.kpi b{display:block;font-size:24px;font-weight:900;margin-top:2px}
.prof{display:grid;grid-template-columns:280px 1fr;gap:16px}
.pcard{padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.pcard h2{margin:4px 0 0}
.pcard a{color:var(--mint);cursor:pointer;margin-left:6px}
.xpbar{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8c6a2e,#e6cf8e)}
.statw{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.chartc{padding:12px 14px}
.trend{width:100%;height:auto;display:block}
.mdw{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mdw>div{padding:14px 16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;opacity:.6;font-weight:600;padding:4px}.tbl td{padding:5px 4px;border-top:1px solid rgba(255,255,255,.08)}
.meRow{background:rgba(201,164,90,.14)}
.hands{display:flex;flex-direction:column;gap:6px;font-size:13px}.hand{display:flex;align-items:center;gap:10px}.hands .hand span:first-child{opacity:.6;width:52px;flex:none}.hands .hand span:nth-child(2){flex:1}
.rankw{display:grid;grid-template-columns:380px 1fr;gap:16px;padding-bottom:56px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding-top:10px}
.pd{display:flex;flex-direction:column;align-items:center;gap:3px;width:110px;font-size:14px}.pd small{opacity:.75}
.pd .ped{width:100%;border-radius:14px 14px 4px 4px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;margin-top:6px;background:rgba(255,255,255,.1)}
.pd.p1 .ped{height:110px;background:linear-gradient(180deg,#ffe08a,#e09a1e);color:#5a3a00}.pd.p2 .ped{height:80px;background:linear-gradient(180deg,#eef2f6,#97a5b3);color:#333}.pd.p3 .ped{height:60px;background:linear-gradient(180deg,#ffc79a,#c4743a);color:#4a2200}
.rlist{padding:6px 10px;max-height:330px;overflow:auto}
.rr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;font-size:14px}.rr .n{width:26px;text-align:center;opacity:.6;font-weight:800}.rr b{flex:1}.rr span:last-child{font-variant-numeric:tabular-nums;font-weight:800}
.myrank{position:absolute;left:24px;right:24px;bottom:0;display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:999px;font-size:15px;background:linear-gradient(135deg,rgba(201,164,90,.3),rgba(14,155,120,.25))!important}
.myrank b{flex:1}
.pbody .myrank{position:sticky;bottom:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sitem{padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.sitem b{font-size:18px}.sitem small{opacity:.7;font-size:12px;min-height:16px}
.sitem .btn{margin-top:6px}.sitem .btn svg{width:18px;height:18px}
.sic svg{width:54px;height:54px}
.fprev{width:120px;height:66px;border-radius:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),inset 0 0 20px rgba(0,0,0,.4)}
.bprev{height:66px;display:flex;align-items:center}
.setw{display:grid;grid-template-columns:150px 1fr;gap:14px}
.vtabs{display:flex;flex-direction:column;gap:6px}.vtabs button{padding:12px;border-radius:14px;background:rgba(255,255,255,.07);color:var(--cream);font-weight:700;font-size:15px}
.vtabs button.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b}
.sbody{padding:6px 18px}
.srow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}.srow:last-child{border-bottom:0}
.srow>div:first-child{flex:1}.srow b{font-size:15px}.srow small{display:block;font-size:12px;opacity:.65;margin-top:2px}
.srow input[type=range]{width:200px;accent-color:#b48c40}.srow .num{width:22px;text-align:right}
.srow .inp{width:300px;font-size:14px;padding:7px 10px}
.sw{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.6,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:linear-gradient(180deg,#e6cf8e,#b48c40)}.sw.on i{transform:translateX(22px)}
/* quick start */
.qsw{max-width:880px;margin:0 auto}
.modes{display:flex;gap:14px;margin-bottom:10px}
.modes .m{flex:1;border-radius:18px;padding:10px 16px;display:flex;align-items:center;gap:6px;color:var(--cream);text-align:left;border:1.5px solid rgba(255,255,255,.12)}
.modes .m>div:last-child{margin-left:10px}
.modes .m.on{background:linear-gradient(135deg,rgba(201,164,90,.28),rgba(14,155,120,.2));border-color:var(--mint)}
.modes .m b{font-size:18px}.modes .m span{font-size:12px;opacity:.75;display:block}
.qs2{padding:6px 22px}
.opt{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}.opt:first-child{border-top:0}
.opt .lb{width:86px;font-size:15px;font-weight:800;flex:none}
.opt .chip{padding:7px 16px;font-size:14px;min-width:62px}
.qs2 .ds{font-size:12px;opacity:.65;padding:8px 0 4px;border-top:1px solid rgba(255,255,255,.08)}
.qs2.inmodal{padding:4px 0}
.qsfoot{display:flex;justify-content:center;gap:14px;margin-top:12px}
.qsfoot .btn{min-width:150px}.qsfoot .btn.primary{min-width:240px}
/* matching */
.mseats{display:flex;justify-content:center;gap:16px;margin:16px 0 6px}
.ms{width:118px;height:136px;border-radius:18px;background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ms.in{border-style:solid;border-color:rgba(201,164,90,.6);background:rgba(201,164,90,.1);animation:cin .4s cubic-bezier(.2,1.6,.5,1)}
.ms b{font-size:14px}.ms small{font-size:11px;opacity:.7}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--mint);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ell::after{content:"";animation:ell 1.4s steps(4) infinite}
@keyframes ell{0%{content:""}25%{content:"．"}50%{content:"．．"}75%{content:"．．．"}}
/* friend room / club landing */
.frw{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frcards{display:grid;grid-template-columns:1fr;gap:12px}
.frc{height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px}
.frc h3{margin:0;font-size:24px}.frc p{margin:4px 0 0;font-size:13px;opacity:.75}.frc .emo{font-size:40px;left:18px;top:14px;right:auto}
.frlist{padding:10px 16px}.frlist .hrow{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0}
/* room */
.roomw{display:grid;grid-template-columns:1fr 380px;gap:16px;height:100%}
.rseats{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.rseats.n2{grid-template-columns:1fr 1fr}
.rs{height:176px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;border-style:dashed}
.rs.in{border-style:solid;border-color:rgba(201,164,90,.45)}
.rs b{font-size:16px}.rs small{font-size:12px;opacity:.7}
.rs .plus{width:56px;height:56px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;opacity:.6}.rs .plus svg{width:22px}
.kick{position:absolute;right:10px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);font-size:12px}
.rside{display:flex;flex-direction:column;gap:10px;min-height:0}
.rbtns{display:flex;flex-wrap:wrap;gap:6px}
.rchat{flex:1;display:flex;flex-direction:column;padding:10px;min-height:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px;min-height:80px}
.cm{align-self:flex-start;max-width:82%;padding:7px 12px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.1);font-size:14px}
.cm b{display:block;font-size:11px;opacity:.65;margin-bottom:1px}
.cm.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b}
.cm.sys{align-self:center;background:none;font-size:12px;opacity:.6;padding:2px}
.cin{display:flex;gap:8px;margin-top:8px}.cin .inp{font-size:14px;padding:8px 12px}
.rgo{display:flex;gap:10px}.rgo .btn{flex:1;padding:11px 10px;font-size:16px}
/* friends */
.flist{display:flex;flex-direction:column;gap:8px}
.flist.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr{display:flex;align-items:center;gap:12px;padding:10px 14px}
.fr>div:nth-child(2){flex:1;min-width:0}.fr b{display:block;font-size:15px}.fr small{font-size:12px;opacity:.6}.fr small.on,.ch small.on,span.on{color:var(--mint);opacity:1}
.fa{display:flex;gap:6px}
.srch{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 14px;border-radius:999px}
.srch svg{width:18px;height:18px;opacity:.7}.srch input{background:none;border:0;outline:none;color:#fff;font-size:14px;font-family:var(--ui);width:180px;-webkit-user-select:text;user-select:text}
.srch.wide{margin-bottom:12px}.srch.wide input{flex:1}
/* lobby */
.lbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.lbar .tabs{margin:0}.lbar .srch{margin-left:auto}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lt{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.lth{display:flex;align-items:center;gap:6px}.lth b{font-size:15px}.lth small{opacity:.5;font-size:11px}
.st{margin-left:auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}.st.p{background:rgba(255,122,89,.25);color:#ffb39f}.st.w{background:rgba(201,164,90,.2);color:var(--mint)}
.ltp{display:flex;gap:6px}.ltp .em{width:30px;height:30px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.3)}
.ltf{display:flex;align-items:center;justify-content:space-between;gap:6px}.ltf small{font-size:11px;opacity:.7}
/* chat */
.chatw{display:grid;grid-template-columns:260px 1fr;gap:14px;height:100%}
.cl{overflow:auto;padding:6px}.cl button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:14px;background:none;color:var(--cream);text-align:left}
.cl button.on{background:rgba(201,164,90,.18)}.cl button div{min-width:0;flex:1}.cl b{display:block;font-size:14px}
.cl small{display:block;font-size:11px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clubic{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#7c2a26,#4e1714);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.cr{display:flex;flex-direction:column;padding:10px 14px;min-height:0}.ch{display:flex;gap:10px;align-items:baseline;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}.ch small{font-size:12px}
.qk{display:flex;gap:6px;overflow-x:auto;padding-top:6px;scrollbar-width:none}.qk button{flex:none;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--cream);font-size:12px;border:1px solid rgba(255,255,255,.14)}
/* club */
.clw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clinfo{display:flex;align-items:center;gap:14px;padding:14px 16px;grid-column:1/3}.clinfo>div:nth-child(2){flex:1}.clinfo h2{margin:0;font-size:22px}.clinfo small{opacity:.65}

/* ================= v4「鬧熱牌局」風格：經典牌館（墨綠絨布・深色木紋・象牙白字・低彩度金） ================= */
:root{--ink:#f1e6cf;--paper:#2a1b11;--gold:#c9a45a;--gold2:#e8d39a;--gold3:#8c6a2e;--wood1:#4b2f1c;--wood2:#33200f;--wood3:#1e130a;
  --cream:#f1e6cf;--mint:#8fc9a0;--coral:#d4625a;--line:rgba(201,164,90,.55);--line2:rgba(201,164,90,.28);
  --serif:'Noto Serif TC','Noto Serif CJK TC','Songti TC','STSong','PMingLiU',serif;
  --ui:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',system-ui,sans-serif;
  --woodbg:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px,rgba(0,0,0,.05) 9px 11px,transparent 11px 23px),linear-gradient(180deg,#45291a,#2c1a0e)}
html,body{background:#1a110a;color:var(--cream)}
#bg{background:
  radial-gradient(ellipse 70% 60% at 50% 40%,rgba(255,220,160,.07),transparent 70%),
  repeating-linear-gradient(91deg,rgba(255,255,255,.018) 0 2px,transparent 2px 11px,rgba(0,0,0,.06) 11px 13px,transparent 13px 29px),
  linear-gradient(180deg,#3a2315 0%,#24160c 60%,#170e07 100%)}
#bg::after{background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55));background-size:auto;mask-image:none}
h1,h2,.hdr h1,.panel h2{font-family:var(--serif);letter-spacing:2px}
.glass{background:linear-gradient(180deg,rgba(64,40,24,.94),rgba(36,22,12,.96));backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,230,180,.08)}
.btn{border-radius:10px;letter-spacing:1px;text-shadow:none;border:1px solid transparent}
.btn:active,.chip:active,.icon:active{transform:translateY(1px);filter:brightness(.92)}
.btn.primary{background:linear-gradient(180deg,#efd99c 0%,#d2ad5f 48%,#b38b3f 52%,#9c7633 100%);color:#2a1a0b;border-color:#7a5a24;
  box-shadow:0 3px 0 #5e4219,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,250,225,.75);text-shadow:0 1px 0 rgba(255,240,200,.5)}
.btn.ghost{background:linear-gradient(180deg,#4a2f1d,#2e1c10);border:1px solid var(--line);color:var(--cream);backdrop-filter:none;box-shadow:0 3px 0 #170d06,0 5px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,230,180,.1)}
.btn.mint{background:linear-gradient(180deg,#3f8a5e 0%,#2b6c47 50%,#1f5537 100%);color:#f4ecd8;border:1px solid #6fa883;box-shadow:0 3px 0 #0f2e1c,0 6px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.line{background:linear-gradient(180deg,#3e9a55,#2a7a3f)!important;color:#fff!important;border:1px solid #6fbf83!important;box-shadow:0 3px 0 #164a24!important}
.btn[disabled]{opacity:.45;filter:grayscale(.5)}
.icon{border:1px solid var(--line);background:linear-gradient(180deg,#4a2f1d,#24160c);color:var(--gold2);box-shadow:0 3px 8px rgba(0,0,0,.4);border-radius:50%}
.chip{background:rgba(20,12,6,.55);border:1px solid var(--line2);color:var(--cream);border-radius:8px}
.chip.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;border-color:#7a5a24;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sub{opacity:.78}
.pos,.num.pos,.sc.pos,.dl.pos,b.pos,.seatchip .sc.pos{color:#9fd39a!important}.neg,.num.neg,.sc.neg,.dl.neg,b.neg,.seatchip .sc.neg{color:#ec8a7c!important}
.modal{background:rgba(8,5,2,.66)}
.panel{background:var(--woodbg)!important;border:1px solid var(--gold)!important;box-shadow:0 0 0 4px rgba(30,19,10,.95),0 0 0 5px var(--line),0 18px 40px rgba(0,0,0,.6)!important;border-radius:12px!important;color:var(--cream)}
.panel h2.grad,h2.grad{background:linear-gradient(180deg,#f4e2ac,#c9a45a 60%,#9c7633);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding:0 2px}

.toast{background:linear-gradient(180deg,#3a2414,#1f130a)!important;color:var(--cream);border:1px solid var(--gold)!important;box-shadow:0 8px 20px rgba(0,0,0,.5)!important}
.tabs{background:rgba(16,10,5,.6);border:1px solid var(--line2);border-radius:10px}
.tabs button{color:var(--cream);opacity:.8;border-radius:8px}.tabs button.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;opacity:1}
.inp{background:rgba(12,8,4,.7)!important;border:1px solid var(--line)!important;color:var(--cream)!important;border-radius:8px!important}

.ttl{color:var(--gold2)}

.bnav button{color:var(--cream);opacity:.78;border-radius:8px}.bnav button.on{background:linear-gradient(180deg,#e6cf8e,#b48c40);color:#2a1a0b;opacity:1}

.av{padding:2px}

.c-mint{background:radial-gradient(ellipse at 50% 30%,#2f7d55,#1a5236 70%,#103a25)}
.c-lemon{background:radial-gradient(ellipse at 50% 30%,#7a2f36,#561e25 70%,#3a1218)}
.c-lilac{background:radial-gradient(ellipse at 50% 30%,#2c5470,#1c3a52 70%,#112638)}
.c-coral{background:radial-gradient(ellipse at 50% 30%,#2f6a62,#1d4a44 70%,#11302b)}

.meld{background:rgba(0,0,0,.22);border-radius:4px}
/* 結算面板：按鈕固定在底部，844×390 也不會被切掉 */
.modal .panel .foot{position:sticky;bottom:-22px;margin:14px -26px -22px;padding:10px 26px 14px;background:linear-gradient(180deg,rgba(44,26,14,.0),rgba(44,26,14,.96) 30%);z-index:3}
#game .hand{top:438px}#game .w-b{top:426px}
/* ================= v4.3 全站輕度改為寶藍色系（配合台灣麻將牌桌），保留低彩度金色點綴 ================= */
:root{--woodbg:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(120,170,255,.10),transparent 70%),linear-gradient(180deg,#1b3766,#11264a);
  --line:rgba(214,186,112,.55);--line2:rgba(214,186,112,.26)}
html,body{background:#0b1a33}
#bg{background:
  radial-gradient(ellipse 70% 60% at 50% 35%,rgba(110,170,255,.16),transparent 70%),
  radial-gradient(rgba(255,255,255,.03) .7px,transparent .8px) 0 0/4px 4px,
  linear-gradient(180deg,#1f4785 0%,#16335f 55%,#0d2040 100%)}
.glass{background:linear-gradient(180deg,rgba(30,62,112,.95),rgba(16,36,70,.96))}
.btn.ghost{background:linear-gradient(180deg,#244a85,#16305a);box-shadow:0 3px 0 #0a1a33,0 5px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.icon,.ti svg{background:linear-gradient(180deg,#26508f,#132d58)}
.ti em{box-shadow:0 0 0 2px #132d58}
.bnav{background:linear-gradient(180deg,rgba(28,58,106,.97),rgba(13,30,60,.98))!important}
.modal{background:rgba(3,10,24,.62)}
.panel{box-shadow:0 0 0 4px rgba(10,24,50,.95),0 0 0 5px var(--line),0 18px 40px rgba(0,0,0,.6)!important}
.toast{background:linear-gradient(180deg,#22487f,#122a52)!important}
.tabs,.chip{background:rgba(6,18,40,.55)}
.inp{background:rgba(5,14,32,.7)!important}
.pillnote{background:linear-gradient(180deg,rgba(28,58,106,.94),rgba(13,30,60,.95))!important}
.seatchip{background:linear-gradient(180deg,rgba(28,58,106,.92),rgba(13,30,60,.94))!important}
.hbtn,.hubb{background:linear-gradient(180deg,#24508f,#163463);box-shadow:0 4px 0 #0a1a33,0 10px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.modal .panel .foot{background:linear-gradient(180deg,rgba(17,38,74,0),rgba(17,38,74,.97) 30%)}
.cmsg,.sszp{background:linear-gradient(180deg,rgba(28,58,106,.94),rgba(13,30,60,.96))}
.gcard[data-arg="mj"]{background:radial-gradient(ellipse at 50% 30%,#3a7fd0,#2560ad 65%,#163f78)!important}
/* ================= v4.3 台灣麻將 App 風格牌桌：寶藍平面桌布・小牌・圓形頭像・圓形亮面按鈕 =================
   全部為原創 CSS／SVG 繪製；版面依台灣麻將 App 常見配置（底部一排 16 張、四家牌河圍繞小羅盤、左上圈風、右上選單） */
#game{--cy:240px;--rin:72px}
#game .felt{inset:0;border:0;border-radius:0;box-shadow:none;
  background:
    radial-gradient(circle at 0 0,rgba(255,255,255,.07) 0 60px,transparent 61px),
    radial-gradient(circle at 100% 100%,rgba(255,255,255,.06) 0 70px,transparent 71px),
    radial-gradient(rgba(255,255,255,.035) .7px,transparent .8px) 0 0/4px 4px,
    radial-gradient(ellipse 75% 70% at 50% 45%,var(--f1) 0%,var(--f2) 55%,var(--f3) 85%,var(--f4) 100%)}
#game .felt::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:none;width:auto;height:auto;transform:none;left:10px;top:10px}
#game .felt::after{display:none}
/* --- 牌：薄邊、象牙白牌面、藍色牌背 --- */
#game .t{box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(160,145,110,.35),0 1px 0 #d9d0b3,0 2px 0 var(--bk2),0 3px 0 var(--bk4),0 4px 4px rgba(0,0,0,.35);
  margin-bottom:4px;border-radius:calc(var(--w)*.1)}
#game .t.back{background:linear-gradient(180deg,var(--bk1),var(--bk2) 70%,var(--bk3));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 var(--bk4),0 2px 0 #e9e1c8,0 3px 3px rgba(0,0,0,.35)}
#game .t::before{bottom:-2px!important}
/* --- 左上圈風、右上選單 --- */
#game .rinfo{left:12px;top:6px;z-index:3;display:flex;flex-direction:column;gap:1px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#game .rinfo b{font-family:var(--serif);font-size:19px;color:#ffe48a;letter-spacing:2px;line-height:1.1}
#game .rinfo .rd{font-size:11px;opacity:.9}
#game .rinfo .tags{display:flex;gap:3px;margin-top:2px}
#game .rinfo .tags span{font-size:10px;padding:0 5px;border-radius:5px;background:rgba(0,20,60,.35);border:1px solid rgba(255,255,255,.2);white-space:nowrap}
#game .rinfo .tags .lz{background:#c0392b;border-color:#ffd27a}
#game .tbtn{top:8px;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.85);color:#fff;
  background:radial-gradient(circle at 40% 30%,#8f8cf0,#4b49c4 60%,#2c2a86);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4)}
#game #gMenu{left:auto!important;right:12px}
#game #gEmo{right:60px!important;background:radial-gradient(circle at 40% 30%,#6fc5e8,#2a8fc0 60%,#1a5f86)}
/* --- 座位：圓形頭像＋名字＋分數 --- */
.mjseat{position:absolute;z-index:4;width:84px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mjseat .ava{position:relative;width:54px;height:54px}
.mjseat .av{width:54px!important;height:54px!important;padding:2px;background:linear-gradient(160deg,#fff2b8,#e0b04a 50%,#9c6d1c);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.mjseat.active .av{box-shadow:0 0 0 3px #ffe27a,0 0 16px 4px rgba(255,226,122,.85)}
.mjseat .wd{position:absolute;left:-6px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d2f62;border:1.5px solid #ffe08a;color:#ffe08a;font:700 11px/17px var(--serif);text-align:center}
.mjseat .zb,.mjseat .tb,.mjseat .ab,.mjseat .lb{position:absolute;right:-8px;width:20px;height:20px;border-radius:5px;font:900 12px/18px var(--serif);text-align:center;color:#fff;border:1px solid #ffe08a}
.mjseat .zb{top:-2px;background:linear-gradient(180deg,#e04a3a,#a8231a)}
.mjseat .tb{top:20px;background:linear-gradient(180deg,#26b3a2,#11796c)}
.mjseat .ab{top:20px;right:auto;left:-8px;bottom:auto;background:linear-gradient(180deg,#7f8cff,#4b55c8)}
.mjseat .lb{top:-2px;right:auto;left:-10px;width:auto;padding:0 3px;font-size:10px;background:#a8231a}
.mjseat .nm{margin-top:3px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.mjseat .nm small{font-size:10px;opacity:.75;margin-left:3px}
.mjseat .scp{margin-top:1px;min-width:64px;text-align:center;font-size:12px;font-weight:800;color:#ffe48a;background:rgba(5,20,50,.6);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 8px;line-height:18px}
.mjseat .scp.pos{color:#9cf0a8!important}.mjseat .scp.neg{color:#ffb0a0!important}
.mjseat .sflw{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin-top:3px;width:84px}
.mjseat .sflw .t{margin-bottom:3px}
.mjseat .bubble.b0{left:70px;bottom:auto;top:0}.mjseat .bubble.b3{left:74px;top:4px}.mjseat .bubble.b1{right:74px;left:auto;top:4px}.mjseat .bubble.b2{left:auto;right:90px;top:6px}
/* --- 對手：上家／下家直立牌（藍背）＋橫放明牌；對家一排牌背 --- */
#game .backs-top{left:50%;top:6px;transform:translateX(-50%);gap:1px;z-index:2}
#game .backs-top .t.back{margin-bottom:3px}
#game .backs-side{top:66px;width:28px;z-index:2}
#game .b-l{left:126px}#game .b-r{right:126px}
#game .sideb{width:26px;height:14px;margin-bottom:0;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
#game .b-l .sideb{background:linear-gradient(90deg,#fffdf4,#e9e1c8 22%,var(--bk4) 22%,var(--bk4) 27%,var(--bk1) 30%,var(--bk2) 100%)}
#game .b-r .sideb{background:linear-gradient(270deg,#fffdf4,#e9e1c8 22%,var(--bk4) 22%,var(--bk4) 27%,var(--bk1) 30%,var(--bk2) 100%)}
#game .backs-side.reveal{grid-template-columns:repeat(2,17px);width:36px}
#game .melds{gap:4px}
#game .m-top{left:auto;right:calc(50% + 172px);top:6px;width:auto;max-width:calc(50% - 300px);justify-content:flex-end;flex-direction:row-reverse}
#game .m-l,#game .m-r{top:62px;width:30px;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:3px}
#game .m-l{left:90px}#game .m-r{right:90px;left:auto}
#game .m-l .meld,#game .m-r .meld{display:flex;flex-direction:column;align-items:center;padding:0;gap:0}
#game .m-l .meld .t,#game .m-r .meld .t{margin:-3px 0 -3px;transform:rotate(90deg)}
#game .m-r .meld .t{transform:rotate(-90deg)}
#game .meld{background:none;box-shadow:none;padding:0;gap:0}
/* --- 中央羅盤（綠松色）＋短牌牆 --- */
#game .plate{left:calc(50% - 37px);top:calc(var(--cy) - 37px);width:74px;height:74px;border-radius:12px;padding:0;
  background:radial-gradient(circle at 40% 30%,#3fd0b6,#13998a 60%,#0b6f66);border:2px solid #b8fff0;box-shadow:0 0 0 2px #0a4f49,0 4px 10px rgba(0,0,0,.4)}
#game .plate .core{width:38px;height:38px;border-radius:7px;background:#0b2a2c;border:1px solid #66e0cc;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#game .plate .left{font:800 17px/1 Georgia,var(--ui);background:none;-webkit-text-fill-color:#ffe48a;color:#ffe48a}
#game .plate .core small{font-size:8px;color:#bff;opacity:.85;margin-top:1px}
#game .plate .w{width:auto;height:auto;background:none;border:0;border-radius:0;color:rgba(230,255,250,.75);font:800 12px/1 var(--serif);box-shadow:none}
#game .plate .w.on{background:none;color:#ffe27a;text-shadow:0 0 6px #fff38a;box-shadow:none}
#game .plate .w0{bottom:3px;left:50%;top:auto;transform:translateX(-50%)}#game .plate .w2{top:3px;left:50%;transform:translateX(-50%) rotate(180deg)}
#game .plate .w3{left:3px;top:50%;transform:translateY(-50%) rotate(90deg)}#game .plate .w1{right:3px;left:auto;top:50%;transform:translateY(-50%) rotate(-90deg)}
#game .wall{gap:1px}
#game .w-t,#game .w-b{left:calc(50% - 64px);width:128px;height:11px}
#game .w-t{top:calc(var(--cy) - 64px)}#game .w-b{top:calc(var(--cy) + 53px)}
#game .w-l,#game .w-r{top:calc(var(--cy) - 52px);height:104px;width:11px}
#game .w-l{left:calc(50% - 64px)}#game .w-r{right:auto;left:calc(50% + 53px)}
#game .ws{flex:1 1 0;width:auto!important;height:auto!important;border-radius:1.5px;transform:none;background:linear-gradient(180deg,#5d95e0,var(--bk1) 50%,var(--bk2))}
#game .ws.c2{box-shadow:inset 0 0 0 .5px rgba(0,0,30,.5),0 1.5px 0 #f2ebd6,0 2px 1px rgba(0,0,0,.4)}
#game .ws.c1{opacity:.6;box-shadow:inset 0 0 0 .5px rgba(0,0,30,.5)}
#game .ws.c0{background:none;box-shadow:none}
#game .ws.rsv{filter:brightness(.6) saturate(.6)}
/* --- 牌河：四家各自朝向自己，整齊排列在羅盤四周 --- */
#game .river{gap:1px;align-content:flex-start;z-index:1}
#game .r0,#game .r2{left:calc(50% - 116px);width:232px;height:128px}
#game .r0{top:calc(var(--cy) + var(--rin))}
#game .r2{top:calc(var(--cy) - var(--rin) - 128px);flex-wrap:wrap-reverse}
#game .r3,#game .r1{width:145px;height:170px;top:calc(var(--cy) - 85px)}
#game .r3{left:calc(50% - var(--rin) - 85px - 72.5px);transform:rotate(90deg)}
#game .r1{left:calc(50% + var(--rin) + 85px - 72.5px);right:auto;transform:rotate(-90deg)}
#game.two .r0,#game.two .r2{left:calc(50% - 174px);width:348px}
#game.two .r0{top:calc(var(--cy) + var(--rin))}
#game .river .t.last{box-shadow:inset 0 1px 0 #fff,0 1px 0 #d9d0b3,0 2px 0 var(--bk2),0 3px 0 var(--bk4),0 4px 4px rgba(0,0,0,.35)}
#game .river .t.last::before{left:-2px;right:-2px;top:-2px;bottom:-5px!important;border-radius:4px;box-shadow:0 0 0 2px #ff5a3c,0 0 10px rgba(255,90,60,.85)}
/* --- 自己的手牌：一排，牌頂露出藍色牌背 --- */
#game .hand{left:96px;right:8px;top:430px;height:104px;gap:2px;align-items:flex-end}
#game .hand .t.h,#game .hand .meld .t{box-shadow:inset 0 2px 0 #fff,inset 0 -1px 0 rgba(160,145,110,.4),0 calc(var(--w)*-.11) 0 var(--bk1),0 calc(var(--w)*-.13) 0 var(--bk3),0 1px 0 #d6cba9,0 3px 5px rgba(0,0,0,.4);margin-bottom:6px}
#game .hand .meld{margin-right:2px}
#game .hand .meld .t{margin-bottom:6px}
#game .hand .t.sel,#game .hand .t.sel:hover{transform:translateY(-14px)}
#game .hand .t.sel::before,#game .hand .t.win::before{content:"";position:absolute;left:-2px;right:-2px;top:calc(var(--w)*-.13 - 2px);bottom:-2px!important;border-radius:5px;box-shadow:0 0 0 2.5px #ffe27a,0 0 14px rgba(255,226,122,.9);pointer-events:none}
#game .hand .gap{width:12px}
#game .hand .t .tp{top:calc(var(--w)*-.13 - 17px);width:16px;height:13px;padding:0;background:none;border:0;box-shadow:none;animation:tpb 1s ease-in-out infinite}
#game .hand .t .tp svg{width:16px;height:13px;display:block;fill:#ffd23a;stroke:#9a5a00;stroke-width:1.2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
#game .hand .t.sel .tp{top:calc(var(--w)*-.13 - 17px)}
@keyframes tpb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}
#game .ting{left:100px;top:auto;bottom:118px;z-index:5;background:rgba(5,22,55,.8)!important;border:1px solid rgba(255,255,255,.25)!important;border-radius:10px!important;color:#fff;padding:3px 8px;font-size:12px}
#game .ting .w{color:#ffe48a}
#game .autotog{right:10px;top:404px;z-index:6;height:24px;padding:0 12px;border-radius:999px;font:700 12px/22px var(--ui);color:#fff;border:1.5px solid #c8fff4;
  background:linear-gradient(180deg,#38c9b4,#14897b);box-shadow:0 2px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
#game .autotog.on{background:linear-gradient(180deg,#8d97ff,#4b55c8);border-color:#dfe2ff}
/* --- 動作：圓形亮面按鈕 --- */
#game .claimbar{right:132px;top:auto;bottom:118px;gap:12px;z-index:6;align-items:flex-end}
#game .cbtn{width:62px;height:62px;border-radius:50%;font:900 30px/1 var(--serif);color:#fff;border:2px solid rgba(255,255,255,.9);position:relative;overflow:hidden;
  text-shadow:-1.5px -1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px 1.5px 0 var(--ol),0 3px 4px rgba(0,0,0,.4);
  box-shadow:0 0 0 2px rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.45),inset 0 -6px 10px rgba(0,0,0,.18)!important;animation:cbp 1.4s ease-in-out infinite}
#game .cbtn::after{content:"";position:absolute;left:14%;right:14%;top:5%;height:38%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
#game .cbtn>*{position:relative;z-index:1}
#game .cbtn.hu,#game .cbtn.zm{--ol:#8a3a00;background:radial-gradient(circle at 50% 35%,#ffe680,#ffb21f 55%,#e07800)!important}
#game .cbtn.zm{font-size:23px}
#game .cbtn.ting2{--ol:#7a3300;background:radial-gradient(circle at 50% 35%,#ffd59a,#f59a3c 55%,#c9610f)!important;color:#fff}
#game .cbtn.ting2.on,#game .cbtn.pass{--ol:#05463f;background:radial-gradient(circle at 50% 35%,#7fe8d6,#1fae9b 55%,#0b766a)!important;font-size:26px}
#game .cbtn.ting2.on{font-size:21px}
#game .cbtn.chi{--ol:#174d0d;background:radial-gradient(circle at 50% 35%,#b6f08a,#55b62c 55%,#2e7c14)!important}
#game .cbtn.pon{--ol:#7a0f1c;background:radial-gradient(circle at 50% 35%,#ffa4a0,#e64a4a 55%,#a81f2a)!important}
#game .cbtn.kan{--ol:#3c1670;background:radial-gradient(circle at 50% 35%,#d8b4ff,#9b5ce6 55%,#6630b0)!important}
#game .cbtn.wide{width:auto;height:58px;border-radius:30px;padding:4px 12px 4px 10px;gap:4px;font-size:22px}
#game .cbtn.wide .t{margin-bottom:3px}
@keyframes cbp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#game .claimbar .pillnote{font-size:12px;padding:5px 12px;background:rgba(5,22,55,.78)!important;border:1px solid rgba(255,255,255,.25)!important;color:#fff;border-radius:999px!important}
#game .claimbar .btn{padding:8px 18px;font-size:15px}
#game .status{top:calc(var(--cy) + 50px)}
/* 彈出字：胡／碰／槓 亮面金字 */
#game .pop span{background:radial-gradient(circle at 50% 35%,#ffe680,#ffb21f 55%,#e07800)!important;border:3px solid #fff!important;border-radius:60px!important;
  min-width:120px;height:120px;padding:0 26px;box-sizing:border-box;-webkit-background-clip:border-box!important;background-clip:border-box!important;display:flex;align-items:center;justify-content:center;font-size:62px;-webkit-text-fill-color:#fff;color:#fff!important;
  text-shadow:-2px -2px 0 #8a3a00,2px -2px 0 #8a3a00,-2px 2px 0 #8a3a00,2px 2px 0 #8a3a00,0 4px 6px rgba(0,0,0,.4)!important;box-shadow:0 8px 20px rgba(0,0,0,.45)!important;letter-spacing:0}
#game .pop.k-pon span{background:radial-gradient(circle at 50% 35%,#ffa4a0,#e64a4a 55%,#a81f2a)!important}
#game .pop.k-chi span{background:radial-gradient(circle at 50% 35%,#b6f08a,#55b62c 55%,#2e7c14)!important}
#game .pop.k-kan span{background:radial-gradient(circle at 50% 35%,#d8b4ff,#9b5ce6 55%,#6630b0)!important}

</style>
</head>
<body>
<div id="bg"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe48a"/><stop offset="1" stop-color="#f0a020"/></linearGradient>
  <linearGradient id="jg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9dffd8"/><stop offset="1" stop-color="#139c74"/></linearGradient>
</defs></svg>
<div id="stage">
  <section class="screen" id="login"></section>
  <section class="screen" id="home"></section>
  <section class="screen" id="page"></section>
  <section class="screen" id="game">
    <div class="felt"></div>
    <div id="tbl"></div>
    <button class="icon glass g-abs tbtn" style="left:14px" id="gMenu" aria-label="選單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="icon glass g-abs tbtn" style="right:14px" id="gEmo" aria-label="表情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14.5c2 2 6 2 8 0"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/></svg></button>
    <div id="pops"></div>
  </section>
  <section class="screen" id="cgame">
    <div class="ctable"></div>
    <div id="ctbl"></div>
    <button class="icon glass g-abs tbtn" style="left:14px" id="cMenu" aria-label="選單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div id="cpops"></div>
  </section>

<script>

      if (flags.robKan) add('搶槓', 1);
      if (flags.haitei && selfDraw) add('海底撈月', 1);
      if (flags.houtei && !selfDraw) add('河底撈魚', 1);
      if (flags.kanFlower && selfDraw) add('槓上開花', 1);
      if (!selfDraw && pl.melds.length === 5 && pl.melds.every(m => m.type !== 'akan')) add('全求人', 2);

    }

let AC = null, bgmTimer = null, bgmGain = null;
function ac() { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function beep(kind) {
  if (!CFG.sound || !CFG.sfxVol) return;
  try {
    const A = ac(), now = A.currentTime, V = CFG.sfxVol / 10;
    const tone = (f, t0, dur, type = 'triangle', vol = .18) => {
      const o = A.createOscillator(), g = A.createGain(); o.type = type; o.frequency.setValueAtTime(f, now + t0);
      g.gain.setValueAtTime(0, now + t0); g.gain.linearRampToValueAtTime(vol * V, now + t0 + .008); g.gain.exponentialRampToValueAtTime(.0005, now + t0 + dur);
      o.connect(g).connect(A.destination); o.start(now + t0); o.stop(now + t0 + dur + .02);
    };
    if (kind === 'tap') tone(1500, 0, .05, 'sine', .08);
    else if (kind === 'discard') { tone(320, 0, .09, 'square', .07); tone(1800, 0, .03, 'sine', .06); }
    else if (kind === 'claim') { tone(520, 0, .12); tone(780, .08, .16); }
    else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .35, 'triangle', .16));
    else if (kind === 'draw') tone(260, 0, .25, 'sine', .1);
    else if (kind === 'coin') [1200, 1600, 2000].forEach((f, i) => tone(f, i * .06, .12, 'sine', .1));
    else if (kind === 'join') { tone(660, 0, .1, 'sine', .1); tone(990, .08, .14, 'sine', .1); }
  } catch (e) {}
}
function vib(ms) { if (CFG.vibrate && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }
const CHORDS = [[220, 277.2, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6], [196, 246.9, 329.6]];
function bgmUpdate() {
  if (!CFG.bgm || !CFG.bgmVol) { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } if (bgmGain) bgmGain.gain.value = 0; return; }
  try {
    const A = ac();
    if (!bgmGain) { bgmGain = A.createGain(); bgmGain.connect(A.destination); }
    bgmGain.gain.value = CFG.bgmVol / 10 * .05;
    if (bgmTimer) return;
    let i = 0;
    const play = () => {
      const now = A.currentTime;
      CHORDS[i++ % CHORDS.length].forEach((f, k) => {
        const o = A.createOscillator(), g = A.createGain(); o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.5, now + 1.2); g.gain.linearRampToValueAtTime(0, now + 3.9);
        o.connect(g).connect(bgmGain); o.start(now + k * .05); o.stop(now + 4);
        if (k === 2) { const o2 = A.createOscillator(), g2 = A.createGain(); o2.type = 'triangle'; o2.frequency.value = f * 2;
          g2.gain.setValueAtTime(0, now + 1.6); g2.gain.linearRampToValueAtTime(.18, now + 1.7); g2.gain.exponentialRampToValueAtTime(.001, now + 3);
          o2.connect(g2).connect(bgmGain); o2.start(now + 1.6); o2.stop(now + 3.1); }
      });
    };
    play(); bgmTimer = setInterval(play, 4000);
  } catch (e) {}
}

OPEN.signin = () => {
  const gap = SIGN.last ? daysBetween(SIGN.last, today()) : 99;
  const can = SIGN.last !== today();

  if (can && gap > 1) streak = 0;
  if (streak >= 7 && can) streak = 0;
  const shown = can ? streak : SIGN.streak;
  modal(`<h2>每日簽到</h2><div class="sub">天天登入・好禮相送　已連續簽到 <b>${shown}</b> / 7 天</div>
    <div class="signg">${SIGN_REW.map(([c, j], i) => `<div class="sd ${i < shown ? 'got' : ''} ${i === streak && can ? 'now' : ''} ${i === 6 ? 'd7' : ''}"><small>第 ${i + 1} 天</small><div class="rw">${c ? coinSVG + '<b>' + fmt(c) + '</b>' : ''}${j ? '<span>' + jadeSVG + '<b>' + j + '</b></span>' : ''}</div>${i < shown ? '<i>✓</i>' : ''}</div>`).join('')}</div>

function trendSVG(list, w = 520, h = 150) {
  const pts = list.slice(0, 20).reverse(); if (pts.length < 2) return '<div class="empty">至少完成兩場後會顯示趨勢圖</div>';
  let acc = 0; const ys = pts.map(p => acc += p.delta); const mn = Math.min(0, ...ys), mx = Math.max(0, ...ys), sp = mx - mn || 1;
  const X = i => 30 + i * (w - 50) / (pts.length - 1), Y = v => 12 + (mx - v) / sp * (h - 34);
  const path = ys.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  return `<svg class="trend" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43e0b0" stop-opacity=".5"/><stop offset="1" stop-color="#43e0b0" stop-opacity="0"/></linearGradient></defs>
    <line x1="30" x2="${w - 20}" y1="${Y(0)}" y2="${Y(0)}" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
    <path d="${path}L${X(ys.length - 1)} ${h - 22}L30 ${h - 22}Z" fill="url(#tg)"/><path d="${path}" fill="none" stroke="#43e0b0" stroke-width="3" stroke-linejoin="round"/>
    ${ys.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${pts[i].delta >= 0 ? '#ffd36b' : '#ff7a7a'}"/>`).join('')}
    <text x="30" y="${h - 6}" fill="#cfe" font-size="11">較早</text><text x="${w - 20}" y="${h - 6}" fill="#cfe" font-size="11" text-anchor="end">最近</text>
    <text x="4" y="${Y(mx) + 4}" fill="#cfe" font-size="10">${fmt(mx)}</text><text x="4" y="${Y(mn) + 4}" fill="#cfe" font-size="10">${fmt(mn)}</text></svg>`;
}

// 人類玩家（含報聽、託管），每個決定都記錄下來供牌譜回放

}

const POPXY = () => [[STW / 2, 372], [STW - 220, 262], [STW / 2, 136], [230, 262]];

const BOT_EMO = { win: ['😆', '胡啦！', '運氣好而已～', '🎉'], lose: ['😭', '唉唷…', '下把換我', '🤯'], claim: ['嘿嘿', '😏', '謝啦'] };

async function startHand() {
  const token = ++G.token;
  Object.assign(G, { pending: null, sel: -1, reveal: G.kind === 'replay', result: null, ting: false, tingPick: false, rec: [], emo: {}, status: '' });
  G.handNo++;
  const seed = G.kind === 'replay' ? G.rp.seed : (Math.random() * 2147483647) | 0;
  G.handStart = { seed, dealer: G.dealer, roundWind: roundWind(), scores: G.scores.slice(), lian: G.lian };
  const g = new MJ.Game({ dealer: G.dealer, roundWind: roundWind(), scores: G.scores, lian: G.lian, base: G.base, perTai: G.perTai, players: G.n, rules: G.rules, preset: G.preset || 'std', rng: MJ.mulberry32(seed) });
  G.game = g; G.wallBreak = (seed >>> 3) % (g.tileTotal / 2);

  else { let i = 0; const acts = G.rp.acts; const next = async () => { await wait(650 / G.rspeed); await gate(); return acts[i++] || { type: 'pass' }; };
    agents = [{ human: true, turn: next, claim: next }].concat(Array(G.n - 1).fill(aiAgent('replay'))); }
  const delay = () => G.kind === 'replay' ? 650 / G.rspeed : SPD();
  if (G.kind === 'play' && G.handNo === 1) notify('start', `${WINDS[roundWind()]}風圈開始・${nameOf(G.dealer)} 坐莊`);
  try {
    const res = await MJ.playHand(g, agents, { delay, onEvent, isAborted: () => token !== G.token });
    if (token !== G.token) return;
    handOver(res);
  } catch (e) { if (e.message !== 'ABORT') { console.error(e); G.status = '錯誤：' + e.message; renderGame(); } }
}
const handLabel = () => G.kind === 'replay' ? G.rp.label : `${WINDS[roundWind()]}風圈・第 ${Math.min(G.dealerMoves + 1, G.hands)} / ${G.hands} 局`;
function handText(res) { if (res.type === 'win' && res.special) return `${nameOf(res.winner)} ${res.special} ${res.total} 台`; return res.type === 'win' ? `${nameOf(res.winner)} ${res.selfDraw ? '自摸' : '胡'} ${res.total} 台${res.selfDraw ? '' : '（' + nameOf(res.from) + ' 放槍）'}` : '流局'; }

function handOver(res) {
  const g = G.game; G.result = res; G.reveal = true; G.pending = null;
  res.handLabel = handLabel(); res.lianBefore = G.lian;
  if (res.type === 'win') { popup(res.winner, res.special || (res.selfDraw ? '自摸' : '胡'), 'hu'); beep('win'); vib([60, 40, 120]); } else beep('draw');
  if (G.kind === 'replay') { renderGame(); setTimeout(() => { if (G.result === res) showResult(); }, 1300); return; }
  if (G.kind === 'spectate') {
    if (res.type === 'win' && res.winner !== G.dealer) { G.dealer = (G.dealer + 1) % G.n; G.dealerMoves++; G.lian = 0; } else G.lian++;
    G.status = '本局：' + handText(res) + '・3 秒後下一局'; renderGame();
    const tk = G.token; setTimeout(() => { if (tk === G.token && G.kind === 'spectate') startHand(); }, 3200); return;
  }
  let delta = 0;
  if (res.type === 'win') {
    if (res.winner === 0) delta = Object.values(res.payments).reduce((a, b) => a + b, 0);
    else if (res.payments[0]) delta = -res.payments[0];
    const others = G.players.map((_, i) => i).filter(i => i !== 0);
    setTimeout(() => { if (res.winner !== 0) emote(res.winner, pick(BOT_EMO.win)); else if (Math.random() < .6) emote(pick(others), pick(BOT_EMO.lose)); }, 900);
  }
  res.delta = delta; WAL.coins += delta;
  ST.hands++; ST.todayHands++;
  if (res.type === 'win' && res.winner === 0) { ST.wins++; ST.todayWins++; if (res.selfDraw) ST.tsumo++; ST.best = Math.max(ST.best, res.total); }
  if (res.type !== 'win') ST.draws++;

  if (res.type === 'win' && (!G.best || res.total > G.best.total)) G.best = { no: G.handNo, who: nameOf(res.winner), total: res.total, names: res.tai.map(x => x[0]).join('、') || '無台' };
  // 俱樂部彩金
  if (G.cfg.club && CLUB && res.type === 'win' && res.total >= 10 && CLUB.pool > 0) {
    const prize = Math.floor(CLUB.pool / 2); CLUB.pool -= prize; res.jackpot = prize;
    G.jackpots.push(`${nameOf(res.winner)} ${res.total} 台獨得彩金 ${fmt(prize)}`);
    if (res.winner === 0) { WAL.coins += prize; res.delta += prize; }
  }
  // 牌譜
  const rid = 'r' + Date.now().toString(36) + rnd(1000);
  REPLAYS.unshift({ id: rid, date: today(), n: G.n, base: G.base, perTai: G.perTai, rules: G.rules, preset: G.preset, names: G.players.map(p => p.name), avs: G.players.map(p => p.av),
    text: `${G.cfg.mode}・${res.handLabel}・${handText(res)}`, label: res.handLabel, ...G.handStart, acts: G.rec.slice() });
  REPLAYS = REPLAYS.slice(0, 15);
  G.log.push({ text: handText(res), rid });
  // 莊家輪替

const CHIPXY = { 1: 'right:8px;top:150px', 2: 'left:calc(50% + 186px);top:2px', 3: 'left:8px;top:62px', 0: 'left:8px;top:372px' };

const meldHTML = (m, w, reveal) => `<span class="meld">${m.tiles.map((t, i) => tile(m.type === 'akan' && !reveal && (i === 0 || i === 3) ? -1 : t, w)).join('')}</span>`;
function riverHTML(p, g, w) {

  }).join('');

}
function wallHTML(g) {
  const TT = g.tileTotal || 144, ST2 = TT / 2, PS = ST2 / 4; // 有花 18 墩／無花 17 墩
  const R = g.wall.length, back = g.backN || 0, front = TT - R - back, endIdx = TT - back, rsvFrom = Math.max(front, endIdx - MJ.RESERVE);
  const sides = [[], [], [], []];
  for (let s = 0; s < ST2; s++) {

function waitsOf(hand, meldCount, g, p) {

    h.push(`<div class="g-abs melds ${['', 'm-r', 'm-top', 'm-l'][pos]}">${pl.melds.map(m => meldHTML(m, 21, G.reveal)).join('')}</div>`);

  for (let p = 0; p < G.n; p++) h.push(riverHTML(p, g, 28));
  G.newRiver = -1;
  // 中央
  const left = Math.max(0, g.wall.length - MJ.RESERVE);
  const wcls = p => (g.turn === p && !g.result ? 'on' : '');
  const wseat = pos => { const p = g.players.findIndex((_, i) => vpos(i) === pos); return p < 0 ? '' : `<div class="w w${pos} ${wcls(p)}">${WINDS[g.players[p].seatWind]}</div>`; };
  h.push(`<div class="g-abs plate"><div class="core"><div class="left num">${left}</div><small>剩餘</small></div>${[0, 1, 2, 3].map(wseat).join('')}</div>`);
  h.push(`<div class="g-abs rinfo"><b>${WINDS[roundWind() || 0]}風圈</b><span class="rd">${handLabel().replace(/^.風圈・/, '')}</span>
    <div class="tags">${G.lian ? `<span class="lz">連莊 ${G.lian}</span>` : ''}<span>${MJ.PRESETS[G.preset || 'std'].name.replace('規則', '').replace('牌', '')}</span><span>底${G.base}/台${G.perTai}</span>${g.rules.cap ? `<span>${g.rules.cap}台滿</span>` : ''}</div></div>`);
  // 自己（或觀戰視角）
  h.push(seatChip(V, g));
  let tiles = me.hand.slice(), drawn = null;
  if (g.drawnBy === V && !g.result) drawn = tiles.pop();
  tiles.sort((a, b) => a - b);
  const disp = drawn != null ? [...tiles, drawn] : tiles; G.disp = disp;
  const meldTiles = me.melds.reduce((s, m) => s + m.tiles.length, 0);
  const meldW = meldTiles * 33 + me.melds.length * 8;
  const tw = Math.min(52, Math.floor((STW - 124 - meldW) / (disp.length + .4)) - 2);
  const myTurn = G.pending && G.pending.kind === 'turn';
  let tingSet = new Set();
  if (myTurn && (CFG.ting || G.tingPick || !G.ting)) {
    for (const t of new Set(disp)) { const rest = me.hand.slice(); rest.splice(rest.indexOf(t), 1); if (waitsOf(rest, me.melds.length, g, V).length) tingSet.add(t); }
  }
  G.tingSet = tingSet;
  const winT = g.result && g.result.type === 'win' && g.result.winner === V ? g.result.winTile : null;
  let winMarked = false;
  const handHtml = me.melds.map(m => meldHTML(m, 32, true)).join('') + (me.melds.length ? '<span class="gap"></span>' : '') +
    disp.map((t, i) => {
      let cls = 'h' + (i === G.sel ? ' sel' : '') + (G.tingPick && !tingSet.has(t) ? ' dim' : '');
      if (winT != null && t === winT && !winMarked && i === disp.length - 1) { cls += ' win'; winMarked = true; }
      const badge = (CFG.ting || G.tingPick) && tingSet.has(t) ? '<span class="tp"><svg viewBox="0 0 14 11"><path d="M1.5 1.5h11L7 9.5z"/></svg></span>' : '';
      return (drawn != null && i === disp.length - 1 ? '<span class="gap"></span>' : '') + tile(t, tw, cls, `data-i="${i}"`).replace('</div>', badge + '</div>');
    }).join('');
  h.push(`<div class="g-abs hand" id="myhand">${handHtml}</div>`);
  if (CFG.ting && !g.result && G.kind !== 'replay') {
    let waits = [], label = '';
    if (myTurn && G.sel >= 0) { const rest = me.hand.slice(); rest.splice(rest.indexOf(disp[G.sel]), 1); waits = waitsOf(rest, me.melds.length, g, V); label = '打這張聽'; }
    else if (!myTurn) { waits = waitsOf(me.hand, me.melds.length, g, V); label = G.ting ? '已報聽' : '聽牌'; }
    if (waits.length) h.push(`<div class="g-abs ting glass">${label}<span style="display:flex;gap:4px">${waits.map(([t, n]) => `<span class="w">${tile(t, 20)}剩${n}</span>`).join('')}</span></div>`);
  }
  // 動作列
  let cb = '';
  const pd = G.pending;
  if (G.kind === 'spectate') cb = `<span class="glass pillnote">👁 觀戰中・${esc(G.specName)}</span><button class="btn ghost" data-act="leave">離開觀戰</button>`;
  else if (G.kind === 'replay') cb = `<span class="glass pillnote">▶ 牌譜回放</span><button class="btn ghost sm" data-act="rpause">${G.paused ? '▶ 播放' : '⏸ 暫停'}</button><button class="btn ghost sm" data-act="rspeed">${G.rspeed}×</button><button class="btn ghost sm" data-act="rrestart">↺ 重播</button><button class="btn ghost sm" data-act="leave">離開</button>`;
  else if (g.result) cb = `<button class="btn ghost" data-act="result">查看結果</button><button class="btn primary" data-act="next">${G.over ? '最終結算' : '下一局'}</button>`;
  else if (G.auto) cb = `<span class="glass pillnote">🤖 託管中，電腦代打</span><button class="btn primary" data-act="unauto">取消託管</button>`;
  else if (pd && pd.kind === 'turn') {
    if (pd.o.tsumo) cb += `<button class="cbtn zm" data-act="tsumo">自摸</button>`;
    pd.o.akan.forEach(t => cb += `<button class="cbtn kan wide" data-act="akan" data-t="${t}">${tile(t, 24)}<span>暗槓</span></button>`);
    pd.o.kakan.forEach(t => cb += `<button class="cbtn kan wide" data-act="kakan" data-t="${t}">${tile(t, 24)}<span>加槓</span></button>`);
    if (!G.ting && tingSet.size && g.canDraw()) cb += `<button class="cbtn ting2 ${G.tingPick ? 'on' : ''}" data-act="baoting">${G.tingPick ? '取消' : '聽'}</button>`;
    if (G.sel >= 0) cb += `<button class="btn primary" data-act="discard">${G.tingPick ? '報聽打出' : '打出'}</button>`;
    else if (!cb || G.tingPick) cb += `<span class="glass pillnote">${G.tingPick ? '選一張標「聽」的牌打出並報聽' : '輪到你：點一張牌，再點一次打出'}</span>`;
  } else if (pd && pd.kind === 'claim') {
    const o = pd.o;
    cb += `<span class="glass pillnote">${roleOf(pd.from)}${o.rob ? '加槓（可搶槓胡）' : '打出'}${tile(pd.t, 26)}</span>`;
    o.chi.forEach((pr, i) => cb += `<button class="cbtn chi wide" data-act="chi" data-k="${i}"><span>吃</span>${[...pr, pd.t].sort((a, b) => a - b).map(x => tile(x, 20)).join('')}</button>`);
    if (o.pon) cb += `<button class="cbtn pon" data-act="pon">碰</button>`;
    if (o.kan) cb += `<button class="cbtn kan" data-act="kan">槓</button>`;
    if (o.hu) cb += `<button class="cbtn hu" data-act="hu">胡</button>`;
    cb += `<button class="cbtn pass" data-act="pass">過</button>`;
  }
  h.push(`<div class="g-abs claimbar">${cb}</div>`);
  if (G.kind === 'play' && !g.result) h.push(`<button class="g-abs autotog ${G.auto ? 'on' : ''}" data-act="autotog">${G.auto ? '取消託管' : '託管'}</button>`);
  if (G.status) h.push(`<div class="g-abs status glass">${G.status}</div>`);
  $('#tbl').innerHTML = h.join('');
}

// ---------- 操作 ----------
$('#tbl').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) {
    const a = b.dataset.act, pd = G.pending; beep('tap');
    if (a === 'next') { if (G.over) showFinal(); else nextHand(); return; }
    if (a === 'result') { showResult(); return; }
    if (a === 'leave') { leaveGame(); return; }
    if (a === 'autotog') { toggleAuto(); return; }
    if (a === 'unauto') { G.auto = false; toast('已取消託管'); renderGame(); return; }
    if (a === 'rpause') { G.paused = !G.paused; renderGame(); return; }
    if (a === 'rspeed') { G.rspeed = G.rspeed >= 4 ? 1 : G.rspeed * 2; renderGame(); return; }
    if (a === 'rrestart') { G.paused = false; replayStart(); return; }
    if (!pd) return;
    if (a === 'baoting') { G.tingPick = !G.tingPick; if (G.tingPick && G.sel >= 0 && !G.tingSet.has(G.disp[G.sel])) G.sel = -1; renderGame(); return; }
    if (a === 'discard' && G.sel >= 0) humanDiscard(G.disp[G.sel]);
    else if (a === 'tsumo') resolvePending({ type: 'tsumo' });
    else if (a === 'akan' || a === 'kakan') resolvePending({ type: a, tile: +b.dataset.t });
    else if (['hu', 'pon', 'kan', 'pass'].includes(a)) resolvePending({ type: a });
    else if (a === 'chi') resolvePending({ type: 'chi', tiles: pd.o.chi[+b.dataset.k] });
    return;
  }
  const pi = e.target.closest('[data-pinfo]');
  if (pi) { playerInfo(+pi.dataset.pinfo); return; }
  const t = e.target.closest('#myhand .t.h');
  if (t && G.pending && G.pending.kind === 'turn') {
    const i = +t.dataset.i;
    if (G.tingPick && !G.tingSet.has(G.disp[i])) { toast('報聽時只能打出標「聽」的牌'); return; }
    if (G.sel === i) { humanDiscard(G.disp[i]); return; }
    G.sel = i; beep('tap'); renderGame();
  }
});
function humanDiscard(t) {
  if (G.tingPick) { G.ting = true; G.tingPick = false; popup(0, '聽', 'chi'); toast('已報聽：之後自動摸打，可胡時自動胡牌'); }
  resolvePending({ type: 'discard', tile: t });
}
function nextHand() { closeModal(); startHand(); }
function leaveGame(force) {
  const go2 = () => { G.token++; G.game = null; G.pending = null; G.paused = false; closeModal(); refreshWallet();
    if (pageStack.length) { rerender(); show('page'); } else { renderHome(); show('home'); } };
  if (force || G.kind !== 'play' || G.over) return go2();
  confirmBox('離開牌局？', '本場會結束（不列入戰績），已結算的金幣會保留。', '離開', go2);
}
