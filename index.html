function showResult() {
  const r = G.result, g = G.game; if (!r) return;
  let h = '';
  if (r.type === 'win') {
    const pl = g.players[r.winner];
    h += `<h2 class="grad">${youOr(r.winner)} ${r.special ? r.special + '！' : r.selfDraw ? '自摸！' : '胡牌！'}</h2>`;
    if (r.special) h += `<div class="sub">${r.handLabel}・${r.special === '七搶一' ? `搶走 ${youOr(r.from)} 的花牌，由 ${youOr(r.from)} 一家支付` : '集滿八張花牌，三家都付'}</div>`;
    else h += `<div class="sub">${r.handLabel}・${r.selfDraw ? '自摸' : `${youOr(r.from)}${roleOf(r.from) && r.from ? '（' + roleOf(r.from) + '）' : ''}放槍`} ${r.winTile != null ? tileName(r.winTile) : ''}</div>`;
    let wi = -1; pl.hand.forEach((t, i) => { if (t === r.winTile) wi = i; });
    h += `<div class="winrow">${pl.flowers.map(t => tile(t, 22)).join('')}${pl.melds.map(m => meldHTML(m, 28, true)).join('')}<span style="width:6px"></span>${pl.hand.map((t, i) => tile(t, 32, '', '', i === wi ? 'box-shadow:0 0 0 2.5px #ffc857,0 0 16px rgba(255,200,87,.8);transform:translateY(-6px)' : '')).join('')}</div>`;
    h += `<div class="rcols"><div><h4>台數明細</h4><div class="taigrid">${r.tai.length ? r.tai.map(([n, v]) => `<div><span>${n}</span><b>${v} 台</b></div>`).join('') : '<div><span>無台（只算底）</span><b>0 台</b></div>'}</div>`;
    if (r.dealerTai && r.dealerTai.length) h += `<h4>莊家另付（莊家支付時加計）</h4><div class="taigrid">${r.dealerTai.map(([n, v]) => `<div><span>${n}</span><b>+${v} 台</b></div>`).join('')}</div>`;
    h += `<div class="total"><span class="big num">${r.total} 台</span><span style="opacity:.75">底 ${G.base} ＋ 台數 × ${G.perTai}</span></div>${r.jackpot ? `<div class="jp">🎉 俱樂部彩金 ${fmt(r.jackpot)}</div>` : ''}</div><div>`;
    h += `<h4>付款</h4><div class="taigrid one">${Object.entries(r.payments).map(([p, a]) => `<div><span>${youOr(+p)}（${r.paymentTai[p]} 台）</span><b class="neg">−${fmt(a)}</b></div>`).join('')}</div>`;
  } else h += `<h2>流局</h2><div class="sub">${r.handLabel}・牌牆只剩海底 ${MJ.RESERVE} 張，無人胡牌。莊家連莊。</div><div class="rcols"><div></div><div>`;
  h += `<h4>${G.kind === 'replay' ? '本局後分數' : '目前分數'}</h4><div class="scores">${G.players.map((P, p) => `<div>${esc(youOr(p))}<b class="num ${G.scores[p] > 0 ? 'pos' : G.scores[p] < 0 ? 'neg' : ''}">${fmt(G.scores[p])}</b></div>`).join('')}</div>`;
  if (G.kind === 'play' && r.delta) h += `<div class="sub" style="margin-top:10px">金幣 <b class="num ${r.delta > 0 ? 'pos' : 'neg'}">${r.delta > 0 ? '+' : ''}${fmt(r.delta)}</b>・餘額 <b class="num">${fmt(WAL.coins)}</b></div>`;
  h += `</div></div>`;
  if (G.kind === 'replay') h += `<div class="foot"><button class="btn ghost" id="mView">看牌桌</button><button class="btn ghost" id="mRe">↺ 重播</button><button class="btn primary" id="mOut">離開回放</button></div>`;
  else h += `<div class="foot"><button class="btn ghost" id="mView">看牌桌</button><button class="btn primary" id="mNext">${G.over ? '最終結算' : '下一局'}</button></div>`;
  modal(h, pn => {
    pn.querySelector('#mView').onclick = closeModal;
    const q = s => pn.querySelector(s);

    if (q('#mRe')) q('#mRe').onclick = () => { closeModal(); replayStart(); };
    if (q('#mOut')) q('#mOut').onclick = () => leaveGame(true);
  }, { cls: 'wide' });
}

    }, { cls: 'wide', closable: false });
}

async function runSSZ(tk) {
  const SSZ = CG.SSZ, hands = SSZ.deal(CS.rng);
  CS.st = { hands, rows: [[], [], []], left: hands[0].slice(), done: [false, false, false, false], plays: [], phase: 'arrange', sugg: SSZ.suggest(hands[0], 3), special: SSZ.special(hands[0]) };
  beep('draw'); renderC();
  // 電腦陸續排好
  for (let p = 1; p < 4; p++) setTimeout(() => { if (tk === CS.token && CS.st.phase === 'arrange') { CS.st.done[p] = true; renderC(); } }, 900 + p * 700 + rnd(900));
  const mine = CS.auto ? autoSSZ() : await askHuman('ssz');
  chk(tk);
  const plays = hands.map((h, p) => {
    if (p === 0) return mine;
    const sp = SSZ.special(h); return sp ? { arr: sp.arr, special: sp } : { arr: SSZ.best(h) };
  });
  CS.st.plays = plays; CS.st.done = [true, true, true, true]; CS.st.phase = 'compare';
  const r = SSZ.settle(plays); CS.st.res = r;
  beep('claim'); renderC();
  r.shot.forEach((row, i) => row.forEach((v, j) => { if (v) setTimeout(() => { if (tk === CS.token) cpop(i, '打槍', 'pon'); }, 700 + i * 250); }));
  r.homerun.forEach((v, i) => { if (v) setTimeout(() => { if (tk === CS.token) cpop(i, '全壘打', 'hu'); }, 1500); });
  plays.forEach((pl, i) => { if (pl.special) setTimeout(() => { if (tk === CS.token) cpop(i, '報到・' + pl.special.name, 'hu'); }, 500); });
  await cWait(1800); chk(tk);
  const text = r.homerun.some(Boolean) ? `${cname(r.homerun.indexOf(true))} 全壘打` : `${cname(r.pts.indexOf(Math.max(...r.pts)))} 最多 ${Math.max(...r.pts)} 水`;
  cRoundOver(r.pts, sszDetail(plays, r), text, Math.max(...r.pts));
}
function autoSSZ() { const h = CS.st.hands[0], sp = CG.SSZ.special(h); return sp ? { arr: sp.arr, special: sp } : { arr: CG.SSZ.best(h) }; }

async function runB2(tk) {

function sszAct(a, b) {
  const S = CS.st, caps = [3, 5, 5];
  if (a === 'row') {
    const k = +b.dataset.k, room = caps[k] - S.rows[k].length;
    let pickC = [...CS.sel];
    if (!pickC.length) return toast('先在下方選牌，再點要放的墩');
    if (pickC.length > room) return toast(`這一墩只剩 ${room} 個位置`);
    S.rows[k] = S.rows[k].concat(pickC).sort((x, y) => x - y); S.left = S.left.filter(c => !CS.sel.has(c)); CS.sel = new Set();
    // 只剩一墩空位時自動填滿
    const empty = [0, 1, 2].filter(i => S.rows[i].length < caps[i]);
    if (empty.length === 1 && S.left.length === caps[empty[0]] - S.rows[empty[0]].length) { S.rows[empty[0]] = S.rows[empty[0]].concat(S.left).sort((x, y) => x - y); S.left = []; }
    renderC(); return;
  }
  if (a === 'sugg') { const s = S.sugg[+b.dataset.i]; S.rows = s.map(r => r.slice()); S.left = []; CS.sel = new Set(); renderC(); return; }
  if (a === 'clear') { S.rows = [[], [], []]; S.left = S.hands[0].slice(); CS.sel = new Set(); renderC(); return; }
  if (a === 'special') { resolveC({ arr: S.special.arr, special: S.special }); return; }
  if (a === 'sszok') {
    if (S.left.length) return;
    const arr = S.rows.map(r => r.slice());
    if (CG.SSZ.isFoul(arr)) return confirmBox('倒水警告', '頭墩 ≤ 中墩 ≤ 尾墩 才合法；倒水會被每一家打槍。確定要出嗎？', '照樣出', () => resolveC({ arr }));
    resolveC({ arr });
  }
}
function aqClick(i) {
  const S = CS.st, A = CG.AQ, pc = S.board[i], side = S.color[0];
  if (pc && !pc.up) { if (CS.aqSel >= 0 && A.moves(S, side).some(m => m.t === 'move' && m.from === CS.aqSel && m.to === i)) return resolveC({ t: 'move', from: CS.aqSel, to: i }); return resolveC({ t: 'flip', i }); }
  if (CS.aqSel >= 0) {
    if (A.moves(S, side).some(m => m.t === 'move' && m.from === CS.aqSel && m.to === i)) return resolveC({ t: 'move', from: CS.aqSel, to: i });
  }
  if (pc && pc.up && pc.side === side) { CS.aqSel = CS.aqSel === i ? -1 : i; beep('tap'); renderC(); return; }
  if (CS.aqSel >= 0) toast(pc ? '吃不到這顆棋（大吃小、兵卒吃帥將、炮要隔一子）' : '只能走一格（上下左右）');
}

        renderC(); }
      if (m === 'leave') { closeModal(); leaveC(); }

};

      <li>牌型：烏龍＜對子＜兩對＜三條＜順子＜同花＜葫蘆＜鐵支＜同花順（A2345 為最小順子）。頭墩只算烏龍、對子、三條。</li>

      <li>計分：先出完者贏，其他人依剩牌張數付分：1–7 張 ×1、8–9 張 ×2、10–12 張 ×3、13 張以上 ×4；手上每張 2 再 ×2。</li>`,
    ddz: `<li>3 人、54 張（含大小王），每人 17 張，留 3 張底牌。輪流叫分 1–3 分，叫最高者當 <b>地主</b> 並拿底牌，對抗兩位 <b>農民</b>。都不叫則重新發牌。</li>
      <li>大小：3＜…＜A＜2＜小王＜大王。牌型：單張、對子、三張、三帶一、三帶二、順子（≥5 張，不含 2 和王）、連對（≥3 對）、飛機（連續三張，可帶同數量單張或對子）、四帶二、四帶兩對、<b>炸彈</b>（四張）、<b>王炸</b>。</li>
      <li>跟牌要同牌型同張數且更大；炸彈可壓任何非炸彈牌型，王炸最大。</li>

    aq: `<li>台灣暗棋（翻翻棋）：32 顆象棋全部蓋著放在 4×8 棋盤。每回合 <b>翻一顆棋</b> 或 <b>走一顆自己的棋</b>。第一個翻棋的人，翻到的顏色就是他的顏色。</li>

      <li><b>炮／包</b> 不能直接吃相鄰的棋，要隔一顆棋（不論明暗）跳吃，可吃任何棋子。</li>
      <li>吃光對方或對方無棋可走即獲勝；連續 50 步沒有吃子或翻棋為和局。每局勝者得 1 局分 × 底分。</li>`,
  }[g];
  modal(`<h2>${GAMES[g].name} 規則</h2><ul class="rules">${R}</ul><div class="foot"><button class="btn mint" data-close>知道了</button></div>`, null, { cls: 'wide' });
};
